<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BuurtWacht World</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="light-mode">

    <div id="auth-screen" class="screen">
        <div class="auth-box" id="login-form">
            <h1>🛡️ BuurtWacht</h1>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="password" placeholder="Wachtwoord">
            <button id="login-btn" class="primary-btn">Inloggen</button>
            <button id="register-btn" class="secondary-btn">Account maken</button>
        </div>

        <div class="auth-box hidden" id="onboarding-form">
            <h2>Welkom! 🏠</h2>
            <p>Vul je profiel in om te beginnen</p>
            <input type="text" id="username" placeholder="Gebruikersnaam">
            <input type="text" id="straat" placeholder="Straatnaam">
            <div class="row">
                <input type="number" id="leeftijd" placeholder="Leeftijd">
                <select id="geslacht">
                    <option value="Man">Man</option>
                    <option value="Vrouw">Vrouw</option>
                    <option value="Anders">Anders</option>
                </select>
            </div>
            <button id="save-profile-btn" class="primary-btn">De wijk in gaan</button>
        </div>
    </div>

    <div id="main-app" class="app-container hidden">
        
        <aside class="sidebar">
            <div class="sidebar-logo">🛡️ BuurtWacht</div>
            <nav>
                <button onclick="showTab('world')"><i data-lucide="map"></i> De Wijk</button>
                <button onclick="showTab('feed')"><i data-lucide="shield"></i> Buurt Feed</button>
                <button onclick="showTab('huis')"><i data-lucide="home"></i> Mijn Huis</button>
                <button onclick="showTab('settings')"><i data-lucide="settings"></i> Instellingen</button>
            </nav>
        </aside>

        <div class="content-wrapper">
            <header class="top-nav">
                <h2 id="page-title">De Wijk</h2>
                <div id="user-badge" class="badge">Laden...</div>
            </header>

            <main class="viewport">
                <section id="world-tab" class="tab-content">
                    <div class="world-map">
                        <div class="building bingo" onclick="enterRoom('Bingo Club')">🎰 <span>Bingo Club</span></div>
                        <div class="building my-house" onclick="showTab('huis')">🏡 <span>Mijn Huis</span></div>
                        <div class="building park">🌳 <span>Buurtpark</span></div>
                    </div>
                </section>

                <section id="feed-tab" class="tab-content hidden">
                    <div class="post-box">
                        <input type="text" id="post-input" placeholder="Meld een verdachte situatie...">
                        <button id="post-btn">Meld</button>
                    </div>
                    <div id="feed-list"></div>
                </section>

                <section id="room-tab" class="tab-content hidden">
                    <div class="room-header">
                        <button onclick="showTab('world')">⬅ Terug</button>
                        <h3 id="room-name">Bingo Club</h3>
                    </div>
                    <div id="game-canvas" class="game-area"></div>
                </section>

                <section id="huis-tab" class="tab-content hidden">
                    <div class="toolbar">
                        <span class="drag-obj" draggable="true" data-type="🛋️">🛋️</span>
                        <span class="drag-obj" draggable="true" data-type="🪴">🪴</span>
                        <span class="drag-obj" draggable="true" data-type="📺">📺</span>
                        <span class="drag-obj" draggable="true" data-type="🪑">🪑</span>
                    </div>
                    <div id="house-canvas" class="dropzone"></div>
                </section>

                <section id="settings-tab" class="tab-content hidden">
                    <div class="card">
                        <h3>Opties</h3>
                        <div class="setting-row">
                            <span>Donkere Modus</span>
                            <input type="checkbox" id="dark-toggle">
                        </div>
                        <button id="logout-btn" class="danger-btn">Uitloggen</button>
                    </div>
                </section>
            </main>
        </div>

        <nav class="mobile-nav">
            <button onclick="showTab('world')"><i data-lucide="map"></i></button>
            <button onclick="showTab('feed')"><i data-lucide="shield"></i></button>
            <button onclick="showTab('huis')"><i data-lucide="home"></i></button>
        </nav>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
