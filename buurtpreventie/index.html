<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuurtWacht Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="light-mode">

    <div id="auth-screen" class="screen">
        <div class="auth-card">
            <h1>🛡️ BuurtWacht</h1>
            <p>Veilig en verbonden in de wijk</p>
            <input type="email" id="email" placeholder="E-mailadres">
            <input type="password" id="password" placeholder="Wachtwoord">
            <button id="login-btn">Inloggen</button>
            <button id="register-btn" class="btn-secondary">Registreren</button>
        </div>
    </div>

    <div id="main-app" class="screen hidden">
        <header>
            <h2 id="page-title">Buurt Feed</h2>
            <button id="theme-toggle">🌙</button>
        </header>

        <main id="content-area">
            <section id="feed-section" class="tab-content">
                <div class="input-group">
                    <input type="text" id="alert-input" placeholder="Wat is er aan de hand?">
                    <button id="send-alert">Meld</button>
                </div>
                <div id="alerts-list"></div>
            </section>

            <section id="huis-section" class="tab-content hidden">
                <h3>Mijn Virtuele Huis</h3>
                <div class="furniture-bank">
                    <div class="item" draggable="true" data-type="🛋️">🛋️</div>
                    <div class="item" draggable="true" data-type="🪴">🪴</div>
                    <div class="item" draggable="true" data-type="🪑">🪑</div>
                </div>
                <div id="house-grid" class="dropzone"></div>
                <button id="save-house">Inrichting Opslaan</button>
            </section>
        </main>

        <nav class="bottom-nav">
            <button onclick="showTab('feed')"><i data-lucide="shield"></i><span>Feed</span></button>
            <button onclick="showTab('huis')"><i data-lucide="home"></i><span>Huis</span></button>
            <button id="logout-btn"><i data-lucide="log-out"></i><span>Uitloggen</span></button>
        </nav>
    </div>

    <script type="module" src="script.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
