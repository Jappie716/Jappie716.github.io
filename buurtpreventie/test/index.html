<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buurtpreventie World</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="light-mode">

    <div id="auth-screen" class="screen">
        <div class="auth-box pulse" id="login-form">
            <div class="logo-icon">🛡️</div>
            <h1>Buurtpreventie</h1>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="password" placeholder="Wachtwoord">
            <button id="login-btn" class="primary-btn">Inloggen</button>
            <button id="register-btn" class="secondary-btn">Account aanmaken</button>
        </div>

        <div class="auth-box hidden" id="onboarding-form">
            <h2>Welkom in de buurt! 🏠</h2>
            <p>Stel je profiel in</p>
            <input type="text" id="username" placeholder="Gebruikersnaam">
            <input type="text" id="huisnummer" placeholder="Huisnummer">
            <div class="row">
                <input type="number" id="leeftijd" placeholder="Leeftijd">
                <select id="geslacht">
                    <option value="Man">Man</option>
                    <option value="Vrouw">Vrouw</option>
                    <option value="Anders">Anders</option>
                </select>
            </div>
            <button id="save-profile-btn" class="primary-btn">Starten</button>
        </div>
    </div>

    <div id="main-app" class="app-container hidden">
        
        <aside class="sidebar">
            <div class="sidebar-logo">🛡️ Buurtpreventie</div>
            <nav>
                <button onclick="showTab('world')" class="nav-btn active"><i data-lucide="map"></i> De Wijk</button>
                <button onclick="showTab('chat')" class="nav-btn"><i data-lucide="message-circle"></i> BuurtChat</button>
                <button onclick="showTab('huis')" class="nav-btn"><i data-lucide="home"></i> Mijn Huis</button>
                <button onclick="showTab('settings')" class="nav-btn"><i data-lucide="settings"></i> Instellingen</button>
            </nav>
            <div class="sidebar-footer">
                <div id="user-display-name">...</div>
            </div>
        </aside>

        <div class="content-wrapper">
            <header class="top-nav">
                <h2 id="page-title">De Wijk</h2>
                <div class="header-icons">
                    <i data-lucide="bell" size="20"></i>
                </div>
            </header>

            <main class="viewport">
                <section id="world-tab" class="tab-content">
                    <div id="map-container" class="map-container">
                        <div class="map-scroll-wrapper">
                            <svg id="neighborhood-svg" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
                                <!-- Achtergrond gras -->
                                <rect width="900" height="700" fill="#4ade80" rx="0"/>
                                <!-- Gras textuur stippen -->
                                <g opacity="0.15">
                                    <circle cx="50" cy="50" r="2" fill="#166534"/>
                                    <circle cx="150" cy="80" r="1.5" fill="#166534"/>
                                    <circle cx="250" cy="40" r="2" fill="#166534"/>
                                    <circle cx="350" cy="70" r="1.5" fill="#166534"/>
                                    <circle cx="450" cy="45" r="2" fill="#166534"/>
                                    <circle cx="550" cy="85" r="1.5" fill="#166534"/>
                                    <circle cx="650" cy="50" r="2" fill="#166534"/>
                                    <circle cx="750" cy="75" r="1.5" fill="#166534"/>
                                    <circle cx="850" cy="55" r="2" fill="#166534"/>
                                    <circle cx="80" cy="150" r="1.5" fill="#166534"/>
                                    <circle cx="180" cy="180" r="2" fill="#166534"/>
                                    <circle cx="700" cy="150" r="2" fill="#166534"/>
                                    <circle cx="820" cy="170" r="1.5" fill="#166534"/>
                                    <circle cx="60" cy="600" r="2" fill="#166534"/>
                                    <circle cx="200" cy="620" r="1.5" fill="#166534"/>
                                    <circle cx="700" cy="610" r="2" fill="#166534"/>
                                    <circle cx="850" cy="590" r="1.5" fill="#166534"/>
                                </g>

                                <!-- Hoofdstraten -->
                                <!-- Horizontale hoofdstraat midden -->
                                <rect x="0" y="310" width="900" height="60" fill="#d4c89a"/>
                                <line x1="0" y1="340" x2="900" y2="340" stroke="#c4b88a" stroke-width="1" stroke-dasharray="20,15"/>
                                <!-- Vertikale hoofdstraat midden -->
                                <rect x="410" y="0" width="60" height="700" fill="#d4c89a"/>
                                <line x1="440" y1="0" x2="440" y2="700" stroke="#c4b88a" stroke-width="1" stroke-dasharray="20,15"/>

                                <!-- Zijstraten boven-links kwadrant -->
                                <rect x="130" y="80" width="40" height="230" fill="#ddd3aa"/>
                                <rect x="0" y="160" width="130" height="40" fill="#ddd3aa"/>

                                <!-- Zijstraten boven-rechts kwadrant -->
                                <rect x="700" y="80" width="40" height="230" fill="#ddd3aa"/>
                                <rect x="740" y="160" width="160" height="40" fill="#ddd3aa"/>

                                <!-- Zijstraten onder-links kwadrant -->
                                <rect x="130" y="370" width="40" height="230" fill="#ddd3aa"/>
                                <rect x="0" y="480" width="130" height="40" fill="#ddd3aa"/>

                                <!-- Zijstraten onder-rechts kwadrant -->
                                <rect x="700" y="370" width="40" height="230" fill="#ddd3aa"/>
                                <rect x="740" y="480" width="160" height="40" fill="#ddd3aa"/>

                                <!-- Stoeprand strepen -->
                                <rect x="0" y="308" width="900" height="4" fill="#bfb080" opacity="0.6"/>
                                <rect x="0" y="368" width="900" height="4" fill="#bfb080" opacity="0.6"/>
                                <rect x="408" y="0" width="4" height="700" fill="#bfb080" opacity="0.6"/>
                                <rect x="468" y="0" width="4" height="700" fill="#bfb080" opacity="0.6"/>

                                <!-- PARK (rechtsonder) -->
                                <rect x="530" y="400" width="155" height="120" fill="#22c55e" rx="8"/>
                                <rect x="530" y="400" width="155" height="120" fill="none" stroke="#16a34a" stroke-width="2" rx="8"/>
                                <!-- Bomen in park -->
                                <circle cx="565" cy="435" r="16" fill="#15803d"/>
                                <circle cx="565" cy="435" r="10" fill="#16a34a"/>
                                <circle cx="600" cy="450" r="18" fill="#15803d"/>
                                <circle cx="600" cy="450" r="12" fill="#16a34a"/>
                                <circle cx="640" cy="432" r="15" fill="#15803d"/>
                                <circle cx="640" cy="432" r="9" fill="#16a34a"/>
                                <circle cx="575" cy="490" r="14" fill="#15803d"/>
                                <circle cx="575" cy="490" r="8" fill="#16a34a"/>
                                <circle cx="655" cy="480" r="16" fill="#15803d"/>
                                <circle cx="655" cy="480" r="10" fill="#16a34a"/>
                                <!-- Bankje in park -->
                                <rect x="608" y="468" width="24" height="6" fill="#92400e" rx="2"/>
                                <rect x="611" y="474" width="4" height="5" fill="#78350f"/>
                                <rect x="625" y="474" width="4" height="5" fill="#78350f"/>
                                <!-- Pad in park -->
                                <path d="M530 500 Q560 490 590 510 Q620 530 650 510 Q680 490 685 520" fill="none" stroke="#d4c89a" stroke-width="3" opacity="0.7"/>
                                <text x="607" y="516" text-anchor="middle" font-size="10" fill="#14532d" font-weight="600" font-family="Georgia, serif">Buurtpark</text>
                                <!-- Park klikbare overlay -->
                                <rect x="530" y="400" width="155" height="120" fill="transparent" rx="8" class="park-clickable" onclick="visitPark()" style="cursor:pointer"/>

                                <!-- BINGO CLUB (links boven) -->
                                <rect x="20" y="20" width="100" height="65" fill="#1e40af" rx="6"/>
                                <rect x="20" y="20" width="100" height="65" fill="none" stroke="#1d4ed8" stroke-width="2" rx="6"/>
                                <!-- Ramen bingo -->
                                <rect x="28" y="30" width="20" height="16" fill="#93c5fd" rx="2"/>
                                <rect x="55" y="30" width="20" height="16" fill="#93c5fd" rx="2"/>
                                <rect x="82" y="30" width="20" height="16" fill="#93c5fd" rx="2"/>
                                <!-- Deur bingo -->
                                <rect x="51" y="55" width="18" height="26" fill="#1d4ed8" rx="2"/>
                                <circle cx="66" cy="68" r="2" fill="#93c5fd"/>
                                <!-- Dak bingo -->
                                <polygon points="15,20 120,20 105,5 35,5" fill="#1e3a8a"/>
                                <text x="70" y="97" text-anchor="middle" font-size="9" fill="#1e40af" font-weight="700" font-family="Georgia, serif">Bingo Club</text>
                                <!-- Bingo klikbare overlay -->
                                <rect x="15" y="5" width="110" height="95" fill="transparent" class="bingo-clickable" onclick="openBingo()" style="cursor:pointer"/>

                                <!-- Percelen grid - wordt gevuld door JS -->
                                <!-- Perceel posities zijn gedefinieerd in script.js -->
                                <g id="plots-layer">
                                    <!-- Boven-links blok: 6 percelen -->
                                    <rect x="180" y="30" width="200" height="255" fill="#bbf7d0" rx="4" opacity="0.4"/>
                                    <!-- Boven-rechts blok: 6 percelen -->
                                    <rect x="490" y="30" width="190" height="255" fill="#bbf7d0" rx="4" opacity="0.4"/>
                                    <!-- Onder-links blok: 6 percelen -->
                                    <rect x="180" y="390" width="200" height="255" fill="#bbf7d0" rx="4" opacity="0.4"/>
                                    <!-- Onder-rechts blok: 6 percelen -->
                                    <rect x="490" y="390" width="190" height="255" fill="#bbf7d0" rx="4" opacity="0.4"/>
                                </g>

                                <!-- Huizen worden hier dynamisch neergezet -->
                                <g id="houses-layer"></g>

                                <!-- Tooltip overlay (bovenaan zodat het altijd zichtbaar is) -->
                                <g id="tooltip-layer"></g>
                            </svg>
                        </div>
                    </div>
                </section>

                <section id="chat-tab" class="tab-content hidden">
                    <div class="chat-container">
                        <div id="chat-messages" class="chat-scroll"></div>
                        <div class="chat-input-area">
                            <input type="text" id="chat-input" placeholder="Typ een bericht...">
                            <button id="send-chat-btn"><i data-lucide="send"></i></button>
                        </div>
                    </div>
                </section>

                <section id="huis-tab" class="tab-content hidden">
                    <div class="game-toolbar">
                        <span class="drag-obj" draggable="true" data-type="🛋️">🛋️</span>
                        <span class="drag-obj" draggable="true" data-type="🪴">🪴</span>
                        <span class="drag-obj" draggable="true" data-type="📺">📺</span>
                        <span class="drag-obj" draggable="true" data-type="🪑">🪑</span>
                        <span class="drag-obj" draggable="true" data-type="🍕">🍕</span>
                    </div>
                    <div id="house-canvas" class="game-room"></div>
                </section>

                <section id="settings-tab" class="tab-content hidden">
                    <div class="settings-wrapper">
                        <div class="settings-card">
                            <h3 class="settings-title">Profiel</h3>
                            <div class="form-group">
                                <label for="settings-username">Naam</label>
                                <input type="text" id="settings-username" placeholder="Jouw naam">
                            </div>
                            <div class="form-group">
                                <label for="settings-huisnummer">Huisnummer</label>
                                <input type="text" id="settings-huisnummer" placeholder="Bijv. 42">
                            </div>
                            <div class="form-group">
                                <label for="settings-status">Leeftijd</label>
                                <input type="number" id="settings-status" placeholder="Leeftijd">
                            </div>
                            </div>
                        
                        <div class="settings-card">
                            <h3 class="settings-title">Voorkeuren</h3>
                            <div class="setting-item">
                                <span>Donkere Modus</span>
                                <label class="switch">
                                    <input type="checkbox" id="dark-toggle">
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>
                        
                        <div style="display: flex; gap: 12px; justify-content: center; margin-top: 16px; margin-bottom: 40px;">
                            <button id="save-settings-btn" class="save-btn">Opslaan</button>
                            <button id="logout-btn" class="logout-btn">Log uit</button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
        <div id="doorbell-modal" class="hidden auth-box pulse" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; border: 4px solid var(--primary);">
    <div class="logo-icon">🔔</div>
    <h2 id="doorbell-msg">Iemand staat voor de deur!</h2>
    <div class="row">
        <button id="accept-door-btn" class="primary-btn">Opendoen</button>
        <button id="decline-door-btn" class="secondary-btn">Negeren</button>
    </div>
</div>

        <nav class="mobile-nav">
            <button onclick="showTab('world')"><i data-lucide="map"></i></button>
            <button onclick="showTab('chat')"><i data-lucide="message-circle"></i></button>
            <button onclick="showTab('huis')"><i data-lucide="home"></i></button>
            <button onclick="showTab('settings')"><i data-lucide="settings"></i></button>
        </nav>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
