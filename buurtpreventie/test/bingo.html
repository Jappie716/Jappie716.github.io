<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Club - Lobby</title>
    <link rel="stylesheet" href="bingo.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
</head>
<body>
    <div id="app">
        <div id="auth-screen" class="screen active">
            <div class="auth-container">
                <h1 class="title">Bingo Club</h1>
                <p class="subtitle">Log in om te spelen</p>
                <form id="login-form">
                    <input type="email" id="email-input" placeholder="E-mailadres" required>
                    <input type="password" id="password-input" placeholder="Wachtwoord" required>
                    <button type="submit" id="login-btn" class="btn-primary">Inloggen</button>
                </form>
                <p class="auth-error" id="auth-error"></p>
                <p class="auth-toggle">Nog geen account? <button type="button" id="register-btn">Registreren</button></p>
            </div>
        </div>

        <div id="bingo-lobby" class="screen">
            <div class="lobby-board">
                <h2 class="lobby-title">🗳️ Spelerlijst</h2>
                <div id="player-list"></div>
                <div class="opt-out-section">
                    <label class="opt-out-label">
                        <input type="checkbox" id="opt-out-check">
                        <span>Ik wil niet draaien</span>
                    </label>
                </div>
                <button id="start-voting-btn" class="btn-primary">Start Stemmen</button>
            </div>
        </div>
    </div>

    <script type="module" src="bingo.js"></script>
</body>
</html>
