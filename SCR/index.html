<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCR Speler Tracker</title>
    <style>
        /* Basis styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Header & Input */
        header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="text"] {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            width: 100%;
            max-width: 300px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }

        /* Navigatie Knoppen */
        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            background-color: #e9ecef;
            color: #495057;
        }

        button:hover {
            background-color: #dee2e6;
        }

        button.primary { background-color: #007bff; color: white; }
        button.primary:hover { background-color: #0056b3; }
        
        button.success { background-color: #28a745; color: white; }
        button.success:hover { background-color: #218838; }

        button.danger { background-color: #dc3545; color: white; margin-bottom: 15px; }
        button.danger:hover { background-color: #c82333; }

        /* Content Secties & Animatie */
        .section {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* iFrames */
        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid #eee;
            border-radius: 8px;
            background-color: #fafafa;
        }

        /* Stations Lijst */
        .station-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .station-btn {
            text-align: left;
            background: #f8f9fa;
            border: 1px solid #ddd;
        }

        .station-btn.selected {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚆 SCR Speler Tracker</h1>
        <div class="input-group">
            <label for="serverInput"><strong>Server:</strong></label>
            <input type="text" id="serverInput" placeholder="Bijv. 123456">
        </div>
        <nav>
            <button id="btnHuidigeRit" class="primary">Huidige rit</button>
            <button id="btnStations" class="primary">Stations</button>
            <button id="btnVolledigeRit" class="success">Volledige rit (Nieuw tabblad)</button>
        </nav>
    </header>

    <main>
        <div id="sectieHuidigeRit" class="section">
            <h2>Huidige Activiteit</h2>
            <iframe id="frameHuidigeRit" src=""></iframe>
        </div>

        <div id="sectieStations" class="section">
            <h2>Live Vertrektijden per Station</h2>
            
            <div id="stationMenu" class="station-list"></div>

            <div id="stationView" style="display: none; margin-top: 20px;">
                <button id="btnKlaar" class="danger">← Klaar (Sluiten)</button>
                <iframe id="frameStation" src=""></iframe>
            </div>
        </div>
    </main>
</div>

<script>
    // 1. Array met stations (Makkelijk uit te breiden!)
    const stations = [
        "Stepford Central",
        "City Hospital",
        "Benton",
        "Leighton Stepford Road",
        "Morganstown",
        "Waterline",
        "Airport Central"
    ];

    // 2. Elementen ophalen uit de HTML
    const serverInput = document.getElementById('serverInput');
    const sectieHuidigeRit = document.getElementById('sectieHuidigeRit');
    const sectieStations = document.getElementById('sectieStations');
    const frameHuidigeRit = document.getElementById('frameHuidigeRit');
    const stationMenu = document.getElementById('stationMenu');
    const stationView = document.getElementById('stationView');
    const frameStation = document.getElementById('frameStation');

    // 3. LocalStorage setup (Bewaart servernummer bij verversen)
    if (localStorage.getItem('scrServerNummer')) {
        serverInput.value = localStorage.getItem('scrServerNummer');
    }
    serverInput.addEventListener('input', (e) => {
        localStorage.setItem('scrServerNummer', e.target.value);
    });

    // Hulpfunctie om servernummer veilig op te halen
    function getServerNummer() {
        const nr = serverInput.value.trim();
        if (!nr) {
            alert("Vul alsjeblieft eerst een servernummer in!");
            return null;
        }
        return nr;
    }

    // Hulpfunctie om secties te wisselen (uitklappen/inklappen)
    function toonSectie(sectie) {
        sectieHuidigeRit.classList.remove('active');
        sectieStations.classList.remove('active');
        if (sectie) sectie.classList.add('active');
    }

    // 4. Navigatie Knoppen
    document.getElementById('btnHuidigeRit').addEventListener('click', () => {
        const serverNr = getServerNummer();
        if (!serverNr) return;
        
        frameHuidigeRit.src = `https://stepfordcountyrailway.co.uk/Players/${serverNr}/CurrentActivity`;
        toonSectie(sectieHuidigeRit);
    });

    document.getElementById('btnVolledigeRit').addEventListener('click', () => {
        const serverNr = getServerNummer();
        if (!serverNr) return;
        
        window.open(`https://stepfordcountyrailway.co.uk/Players/${serverNr}/CurrentActivity`, '_blank');
    });

    document.getElementById('btnStations').addEventListener('click', () => {
        toonSectie(sectieStations);
        // Reset de weergave als we naar de stations tab gaan
        stationMenu.style.display = "flex";
        stationView.style.display = "none";
        document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('selected'));
    });

    // 5. Stations Dynamisch Inladen
    function initStations() {
        stations.forEach(stationNaam => {
            const btn = document.createElement('button');
            btn.className = 'station-btn';
            btn.textContent = stationNaam;
            
            btn.addEventListener('click', () => {
                const serverNr = getServerNummer();
                if (!serverNr) return;

                // Highlight de actieve knop
                document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');

                // Verberg menu, toon iframe
                stationMenu.style.display = "none";
                stationView.style.display = "block";

                // Genereer de URL (encodeURIComponent zorgt dat spaties veranderen in %20)
                const veiligeNaam = encodeURIComponent(stationNaam);
                frameStation.src = `https://stepfordcountyrailway.co.uk/LiveDepartureBoard/${serverNr}/${veiligeNaam}`;
            });

            stationMenu.appendChild(btn);
        });
    }

    // 6. 'Klaar' knop logica
    document.getElementById('btnKlaar').addEventListener('click', () => {
        stationView.style.display = "none";     // Verberg iframe
        stationMenu.style.display = "flex";     // Toon lijst
        frameStation.src = "";                  // Stop met laden van de iframe pagina
        document.querySelectorAll('.station-btn').forEach(b => b.classList.remove('selected')); // Verwijder highlight
    });

    // Start applicatie
    initStations();

</script>
</body>
</html>
