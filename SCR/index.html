<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCR Speler Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="text"] {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            width: 100%;
            max-width: 300px;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button.primary { background-color: #007bff; color: white; }
        button.primary:hover { background-color: #0056b3; }
        
        button.danger { background-color: #dc3545; color: white; }
        button.danger:hover { background-color: #c82333; }

        button.secondary { background-color: #6c757d; color: white; }
        button.secondary:hover { background-color: #5a6268; }

        .section { display: none; margin-top: 20px; }
        .section.active { display: block; animation: fadeIn 0.3s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid #eee;
            border-radius: 8px;
            background-color: #fafafa;
            margin-top: 15px;
        }

        /* Stations Specifiek */
        .station-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
            padding-right: 5px;
        }

        .station-btn {
            text-align: left;
            background: #f8f9fa;
            border: 1px solid #ddd;
            color: #333;
        }
        
        .station-btn:hover { background: #e2e6ea; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🚆 SCR Speler Tracker</h1>
        <div class="input-group">
            <label for="serverInput"><strong>Server/Player ID:</strong></label>
            <input type="text" id="serverInput" placeholder="Bijv. 934718616">
        </div>
        <nav>
            <button id="btnOverzicht" class="primary">Overzicht</button>
            <button id="btnStations" class="primary">Stations</button>
        </nav>
    </header>

    <main>
        <div id="sectieOverzicht" class="section">
            <div class="toolbar">
                <h2>Speler Overzicht</h2>
                <button id="btnOverzichtNewTab" class="secondary">Open in nieuw tabblad (Als scherm wit blijft)</button>
            </div>
            <iframe id="frameOverzicht" src=""></iframe>
        </div>

        <div id="sectieStations" class="section">
            <h2>Live Vertrektijden per Station</h2>
            
            <div id="stationMenu">
                <input type="text" id="zoekBalk" placeholder="🔍 Zoek een station..." style="max-width: 100%; margin-bottom: 10px;">
                <div id="stationLijst" class="station-list"></div>
            </div>

            <div id="stationView" style="display: none;">
                <div class="toolbar">
                    <button id="btnKlaar" class="danger">← Terug naar lijst</button>
                    <button id="btnStationNewTab" class="secondary">Open in nieuw tabblad</button>
                </div>
                <iframe id="frameStation" src=""></iframe>
            </div>
        </div>
    </main>
</div>

<script>
    // 1. Vul hier AL je stations in
    const stations = [
        "Stepford Central",
        "City Hospital",
        "Benton",
        "Leighton Stepford Road",
        "Morganstown",
        "Waterline",
        "Airport Central",
        "Boddington",
        "St Helens Bridge"
    ];

    const serverInput = document.getElementById('serverInput');
    const frameOverzicht = document.getElementById('frameOverzicht');
    const frameStation = document.getElementById('frameStation');
    const zoekBalk = document.getElementById('zoekBalk');
    let actieveStationLink = ""; // Bewaart de link voor de 'nieuw tabblad' knop

    // Bewaar ID
    if (localStorage.getItem('scrServerNummer')) serverInput.value = localStorage.getItem('scrServerNummer');
    serverInput.addEventListener('input', (e) => localStorage.setItem('scrServerNummer', e.target.value));

    function getServerNummer() {
        const nr = serverInput.value.trim();
        if (!nr) { alert("Vul een Server of Player ID in!"); return null; }
        return nr;
    }

    function toonSectie(sectieId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(sectieId).classList.add('active');
    }

    // -- OVERZICHT LOGICA --
    document.getElementById('btnOverzicht').addEventListener('click', () => {
        const id = getServerNummer();
        if (!id) return;
        const link = `https://stepfordcountyrailway.co.uk/Players/${id}/CurrentActivity`;
        frameOverzicht.src = link;
        
        // Link updaten voor de 'Nieuw Tabblad' knop
        document.getElementById('btnOverzichtNewTab').onclick = () => window.open(link, '_blank');
        toonSectie('sectieOverzicht');
    });

    // -- STATIONS LOGICA --
    document.getElementById('btnStations').addEventListener('click', () => {
        toonSectie('sectieStations');
        document.getElementById('stationMenu').style.display = "block";
        document.getElementById('stationView').style.display = "none";
        frameStation.src = "";
    });

    // Bouw de stationslijst op
    const stationLijst = document.getElementById('stationLijst');
    stations.sort().forEach(stationNaam => {
        const btn = document.createElement('button');
        btn.className = 'station-btn';
        btn.textContent = stationNaam;
        
        btn.addEventListener('click', () => {
            const id = getServerNummer();
            if (!id) return;

            document.getElementById('stationMenu').style.display = "none";
            document.getElementById('stationView').style.display = "block";

            // Formatteer de link, forceer HTTPS. 
            // Let op: vaak is de syntax /<serverID>/<station>, ik heb een '/' toegevoegd voor de veiligheid. 
            // Als SCR écht geen slash gebruikt, verander het hieronder naar: `${id}${encodeURIComponent(stationNaam)}`
            const veiligeNaam = encodeURIComponent(stationNaam);
            actieveStationLink = `https://stepfordcountyrailway.co.uk/LiveDepartureBoard/${id}/${veiligeNaam}`;
            
            frameStation.src = actieveStationLink;
        });
        stationLijst.appendChild(btn);
    });

    // Zoekfunctie
    zoekBalk.addEventListener('input', (e) => {
        const zoekterm = e.target.value.toLowerCase();
        document.querySelectorAll('.station-btn').forEach(btn => {
            if (btn.textContent.toLowerCase().includes(zoekterm)) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        });
    });

    // Station 'Klaar' en 'Nieuw tabblad' knoppen
    document.getElementById('btnKlaar').addEventListener('click', () => {
        document.getElementById('stationView').style.display = "none";
        document.getElementById('stationMenu').style.display = "block";
        frameStation.src = "";
    });

    document.getElementById('btnStationNewTab').addEventListener('click', () => {
        if (actieveStationLink) window.open(actieveStationLink, '_blank');
    });

</script>
</body>
</html>
