<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCR Speler Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&family=Ubuntu+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --scr-bg:       #040d1c;
            --scr-card:     #091c38;
            --scr-slate:    #19304a;
            --scr-border:   #1e3a5a;
            --scr-green:    #15bd94;
            --scr-blue:     #2f8cf9;
            --scr-paleblue: #6bbbfc;
            --scr-red:      #fa5300;
            --scr-text:     #ffffff;
            --scr-muted:    rgba(255,255,255,0.55);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Oxygen", Arial, sans-serif;
            background-color: var(--scr-bg);
            color: var(--scr-text);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background-color: var(--scr-card);
            border-bottom: 1px solid var(--scr-border);
            padding: 0 1.5rem;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--scr-text);
            text-decoration: none;
        }
        .logo-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--scr-green);
        }
        .navbar-sub { color: var(--scr-muted); font-size: 0.8rem; }

        /* Layout */
        .page {
            max-width: 860px;
            margin: 0 auto;
            padding: 2rem 1.25rem;
        }
        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }
        .page-subtitle {
            color: var(--scr-muted);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        /* Card */
        .card {
            background: var(--scr-card);
            border: 1px solid var(--scr-border);
            border-radius: 0.75rem;
            overflow: hidden;
            margin-bottom: 1.25rem;
        }
        .card-header {
            background: var(--scr-slate);
            border-bottom: 1px solid var(--scr-border);
            padding: 0.8rem 1.25rem;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--scr-paleblue);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-body { padding: 1.25rem; }

        /* Form */
        .input-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 0.85rem;
        }
        label {
            font-size: 0.8rem;
            color: var(--scr-muted);
            font-weight: 700;
            white-space: nowrap;
            min-width: 80px;
        }
        input[type="text"] {
            background: var(--scr-bg);
            border: 1px solid var(--scr-border);
            border-radius: 0.5rem;
            color: var(--scr-text);
            font-family: "Ubuntu Mono", monospace;
            font-size: 0.88rem;
            padding: 0.5rem 0.75rem;
            flex: 1;
            min-width: 180px;
            max-width: 320px;
            outline: none;
            transition: border-color 0.15s;
        }
        input[type="text"]:focus { border-color: var(--scr-blue); }
        input[type="text"]::placeholder { color: rgba(255,255,255,0.2); }

        /* Buttons */
        nav { display: flex; gap: 0.65rem; flex-wrap: wrap; margin-top: 1rem; }

        button {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0.55rem 1.15rem;
            font-size: 0.88rem;
            font-weight: 700;
            font-family: "Oxygen", Arial, sans-serif;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: filter 0.15s, transform 0.1s;
        }
        button:hover  { filter: brightness(1.18); }
        button:active { transform: scale(0.97); }
        button.primary   { background: var(--scr-blue); color: #fff; }
        button.danger    { background: var(--scr-red);  color: #fff; }
        button.secondary { background: var(--scr-slate); color: var(--scr-text); border: 1px solid var(--scr-border); }

        /* Sections */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Station list */
        .station-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 430px;
            overflow-y: auto;
            margin-top: 0.85rem;
            padding-right: 4px;
        }
        .station-list::-webkit-scrollbar { width: 5px; }
        .station-list::-webkit-scrollbar-track { background: var(--scr-bg); }
        .station-list::-webkit-scrollbar-thumb { background: var(--scr-slate); border-radius: 3px; }

        .station-btn {
            background: var(--scr-bg);
            border: 1px solid var(--scr-border);
            border-radius: 0.5rem;
            color: var(--scr-text);
            font-family: "Oxygen", Arial, sans-serif;
            font-size: 0.88rem;
            font-weight: 400;
            padding: 0.6rem 1rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s;
        }
        .station-btn:hover {
            background: var(--scr-slate);
            border-color: var(--scr-blue);
            filter: none;
        }

        .toolbar {
            display: flex;
            align-items: center;
            margin-bottom: 0.85rem;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="#">
        <span class="logo-dot"></span>
        SCR Hub
    </a>
    <span class="navbar-sub">/ Speler Tracker</span>
</nav>

<div class="page">

    <div class="page-title">🚆 SCR Speler Tracker</div>
    <div class="page-subtitle">Voer je Server ID in om snel naar het speleroverzicht en live vertrektijden te gaan.</div>

    <!-- Header kaart met input + knoppen -->
    <div class="card">
        <div class="card-header">⚙️ Instellingen</div>
        <div class="card-body">
            <div class="input-group">
                <label for="serverInput">Server ID:</label>
                <input type="text" id="serverInput" placeholder="Bijv. 934718616">
            </div>
            <nav>
                <button id="btnOverzicht" class="primary">Overzicht</button>
                <button id="btnStations" class="primary">Stations</button>
            </nav>
        </div>
    </div>

    <main>
        <!-- OVERZICHT -->
        <div id="sectieOverzicht" class="section"></div>

        <!-- STATIONS -->
        <div id="sectieStations" class="section">
            <div class="card">
                <div class="card-header">🚉 Informatie per station</div>
                <div class="card-body">
                    <div id="stationMenu">
                        <input type="text" id="zoekBalk" placeholder="🔍 Zoek een station..." style="max-width:100%;">
                        <div id="stationLijst" class="station-list"></div>
                    </div>

                    <div id="stationView" style="display: none;">
                        <div class="toolbar">
                            <button id="btnKlaar" class="danger">← Terug naar lijst</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</div>

<script>
    const stations = [
        "AirportCentral","AirportParkway","AirportWest","AngelPass","AshlanPark",
        "Aslockby","Barton","BeaulieuPark","Beechley","Benton","BentonBridge",
        "Berrily","Bodin","Cadoxton","CambridgeStreet","CarnaleaBridge","CityHospital",
        "Connolly","Coxly","CoxlyNewtown","DentonRoad","EastBerrily","EdenQuay",
        "Edgemead","ElsemereJunction","ElsemerePond","Esterfield","FaradayRoad",
        "Farleigh","Faymere","FinancialQuarter","FourWays","Greenslade",
        "HamptonHargate","HemdonPark","HoughtonRake","JamesStreet","LeightonCity",
        "StepfordRoad","LeightonWest","Llyn","Millcastle","MillcastleRacecourse",
        "Morganstown","MorganstownDocks","NewHarrow","Newry","NewryHarbour",
        "Northshore","PortBenton","RayleighBay","RobinsonWay","RocketParade",
        "RosedaleVillage","StHelensBridge","Starryloch","StepfordBay","StepfordCentral",
        "StepfordEast","HighStreet","StepfordUnited","StepfordVictoria",
        "Terminal1","Terminal2","Terminal3","UpperStaploe","WaterNewton",
        "WestBenton","Westercoast","Westwyvern","Whitefield","WhitefieldLido",
        "WhitneyGreen","Willowfield","WoodheadLane"
    ];

    const serverInput = document.getElementById('serverInput');
    const zoekBalk    = document.getElementById('zoekBalk');
    let actieveStationLink = "";

    // Bewaar ID in localStorage
    if (localStorage.getItem('scrServerNummer')) serverInput.value = localStorage.getItem('scrServerNummer');
    serverInput.addEventListener('input', (e) => localStorage.setItem('scrServerNummer', e.target.value));

    function getServerNummer() {
        const nr = serverInput.value.trim();
        if (!nr) { alert("Vul een Server of Player ID in!"); return null; }
        return nr;
    }

    function toonSectie(sectieId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(sectieId).classList.add('active');
    }

    // -- OVERZICHT --
    document.getElementById('btnOverzicht').addEventListener('click', () => {
        window.open(`https://stepfordcountyrailway.co.uk/Players/934718616/CurrentActivity`, '_blank');
        toonSectie('sectieOverzicht');
    });

    // -- STATIONS --
    document.getElementById('btnStations').addEventListener('click', () => {
        toonSectie('sectieStations');
        document.getElementById('stationMenu').style.display = "block";
        document.getElementById('stationView').style.display = "none";
    });

    // Stationslijst bouwen
    const stationLijst = document.getElementById('stationLijst');
    stations.sort().forEach(stationNaam => {
        const btn = document.createElement('button');
        btn.className = 'station-btn';
        btn.textContent = stationNaam;
        btn.addEventListener('click', () => {
            const id = getServerNummer();
            if (!id) return;
            const veiligeNaam = encodeURIComponent(stationNaam);
            actieveStationLink = `https://stepfordcountyrailway.co.uk/LiveDepartureBoard/${id}/${veiligeNaam}`;
            window.open(actieveStationLink, '_blank');
        });
        stationLijst.appendChild(btn);
    });

    // Zoekfunctie
    zoekBalk.addEventListener('input', (e) => {
        const zoekterm = e.target.value.toLowerCase();
        document.querySelectorAll('.station-btn').forEach(btn => {
            btn.style.display = btn.textContent.toLowerCase().includes(zoekterm) ? "block" : "none";
        });
    });

    // Terug naar lijst
    document.getElementById('btnKlaar').addEventListener('click', () => {
        document.getElementById('stationView').style.display = "none";
        document.getElementById('stationMenu').style.display = "block";
    });
</script>
</body>
</html>
