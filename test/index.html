<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Game Paradise - Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/icon/favicon.png">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #020617; --sidebar-bg: #010409; --card-bg: #0f172a;
            --primary: #2563eb; --accent: #60a5fa; --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px 20px; text-align: center; }
        .sidebar-header h1 { font-size: 1.5rem; color: var(--accent); margin: 0; }
        
        .nav-links { flex: 1; padding: 10px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; padding: 12px 15px; color: var(--text-dim); text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .nav-item:hover, .nav-item.active { background: #1e293b; color: white; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { padding: 20px 40px; display: flex; align-items: center; gap: 20px; background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(10px); }
        .search-bar { flex: 1; background: var(--card-bg); border: 1px solid #1e293b; border-radius: 12px; padding: 10px 20px; color: white; outline: none; }

        .game-grid { flex: 1; overflow-y: auto; padding: 20px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
        .game-card { background: var(--card-bg); border-radius: 15px; overflow: hidden; border: 1px solid #1e293b; cursor: pointer; transition: 0.3s; position: relative; }
        .game-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .game-card img { width: 100%; height: 150px; object-fit: cover; }
        .game-card h3 { margin: 0; padding: 15px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; }

        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-box { background: #0f172a; padding: 25px; border-radius: 18px; border: 1px solid var(--accent); max-width: 450px; width: 100%; }

        .info-btn { background: #334155; color: white; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 5px; }
        .star { color: #334155; font-size: 1.2rem; }
        .star.fav { color: #fbbf24; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header"><h1>Game Paradise</h1></div>
    <div class="nav-links" id="catList">
        <div class="nav-item active" onclick="filterCat('all', this)">🎮 Alle Games</div>
        <div class="nav-item" onclick="filterCat('favorites', this)">⭐ Favorieten</div>
    </div>
    
    <div style="padding: 20px; border-top: 1px solid #1e293b; display: flex; flex-direction: column; gap: 10px;">
        <button class="btn" onclick="openNewsModal()" style="background: linear-gradient(45deg, #1d4ed8, #7c3aed);">📢 Nieuws & Updates</button>
        <button class="btn" onclick="location.href='chat.html'">💬 GP Chat</button>
    </div>
</div>

<div class="main-content">
    <div class="top-bar">
        <input type="text" id="searchInput" class="search-bar" placeholder="Zoek een game...">
    </div>
    <div class="game-grid" id="gameGrid"></div>
</div>

<div id="newsModal" class="modal">
    <div class="modal-box">
        <h2 id="viewNewsTitle" style="margin:0; color:var(--accent);">Laden...</h2>
        <hr style="border:0; border-top:1px solid #334155; margin:15px 0;">
        <p id="viewNewsText" style="line-height:1.6; color:#cbd5e1; white-space: pre-wrap;"></p>
        <div id="viewNewsLinkArea"></div>
        <button class="btn" onclick="closeNewsModal()" style="margin-top:20px; background:#334155;">Sluiten</button>
    </div>
</div>

<div id="infoModal" class="modal">
    <div class="modal-box">
        <h2 id="infoTitle" style="margin:0; color:var(--accent);">Info</h2>
        <p id="infoBody" style="margin: 20px 0; line-height:1.6;"></p>
        <button class="btn" onclick="closeModal('infoModal')">Sluiten</button>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
    authDomain: "gameparadise-80490.firebaseapp.com",
    projectId: "gameparadise-80490",
    storageBucket: "gameparadise-80490.firebasestorage.app",
    messagingSenderId: "335620903527",
    appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allGames = {};
let favorites = JSON.parse(localStorage.getItem("gp_favs") || "{}");
let currentFilter = "all";

// NIEUWS LOGICA
async function openNewsModal() {
    document.getElementById('newsModal').style.display = 'flex';
    const doc = await db.collection("settings").doc("news").get();
    if(doc.exists) {
        const d = doc.data();
        document.getElementById('viewNewsTitle').innerText = d.title;
        document.getElementById('viewNewsText').innerText = d.text;
        if(d.link) {
            document.getElementById('viewNewsLinkArea').innerHTML = `<a href="${d.link}" target="_blank" class="btn" style="text-decoration:none; display:block; text-align:center; margin-top:10px;">Lees Meer →</a>`;
        } else {
            document.getElementById('viewNewsLinkArea').innerHTML = "";
        }
    }
}

function closeNewsModal() { document.getElementById('newsModal').style.display = 'none'; }

// GAME LOGICA
function filterCat(cat, el) {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    currentFilter = cat;
    renderGames();
}

db.collection("categories").onSnapshot(snap => {
    const list = document.getElementById('catList');
    list.innerHTML = `<div class="nav-item ${currentFilter==='all'?'active':''}" onclick="filterCat('all', this)">🎮 Alle Games</div><div class="nav-item ${currentFilter==='favorites'?'active':''}" onclick="filterCat('favorites', this)">⭐ Favorieten</div>`;
    snap.forEach(doc => {
        list.innerHTML += `<div class="nav-item" onclick="filterCat('${doc.id}', this)">• ${doc.data().name}</div>`;
    });
});

db.collection("games").onSnapshot(snap => {
    snap.forEach(doc => allGames[doc.id] = doc.data());
    renderGames();
});

function renderGames() {
    const grid = document.getElementById('gameGrid');
    const search = document.getElementById('searchInput').value.toLowerCase();
    grid.innerHTML = "";
    Object.entries(allGames).forEach(([id, g]) => {
        if(currentFilter !== 'all' && currentFilter !== 'favorites' && g.category !== currentFilter) return;
        if(currentFilter === 'favorites' && !favorites[id]) return;
        if(search && !g.title.toLowerCase().includes(search)) return;

        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
            <img src="${g.image}">
            <h3>
                <span>${g.hasSave?'💾 ':''}${g.title}</span>
                <span>
                    ${g.hasInfo?`<span class="info-btn" onclick="showInfo('${id}', event)">?</span>`:''}
                    <span class="star ${favorites[id]?'fav':''}" onclick="toggleFav('${id}', event)">★</span>
                </span>
            </h3>
        `;
        card.onclick = () => location.href = g.link;
        grid.appendChild(card);
    });
}

function toggleFav(id, e) {
    e.stopPropagation();
    favorites[id] = !favorites[id];
    localStorage.setItem("gp_favs", JSON.stringify(favorites));
    renderGames();
}

function showInfo(id, e) {
    e.stopPropagation();
    document.getElementById('infoTitle').innerText = allGames[id].title;
    document.getElementById('infoBody').innerText = allGames[id].infoText || "Geen extra informatie beschikbaar.";
    document.getElementById('infoModal').style.display = 'flex';
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }
document.getElementById('searchInput').oninput = renderGames;
</script>
</body>
</html>
