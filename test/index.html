<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Game Paradise - Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/icon/favicon.png">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://elfsightcdn.com/platform.js" async></script>

<style>
:root {
  --bg: #020617;
  --sidebar-bg: #010409;
  --card-bg: #0f172a;
  --primary: #2563eb;
  --accent: #60a5fa;
  --text-dim: #94a3b8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: white;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* --- SIDEBAR --- */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--sidebar-bg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #1e293b;
  overflow-y: auto;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  color: var(--accent);
  margin-bottom: 25px;
  text-align: center;
}

.search-box input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #1e293b;
  background: #0f172a;
  color: white;
  margin-bottom: 20px;
  outline: none;
}

.category-btn {
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--text-dim);
}

.category-btn:hover {
  background: #1e293b;
  color: white;
}

.category-btn.active {
  background: var(--primary);
  color: white;
  font-weight: bold;
}

/* --- MAIN --- */
.main {
  flex: 1;
  padding: 30px;
  overflow-y: auto;
  background: radial-gradient(circle at top right, #0f172a, #020617);
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.section-title {
  font-size: 24px;
  margin: 0;
}

.auth-btn {
  background: var(--primary);
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

.admin-btn {
  background: #1e293b;
  margin-right: 10px;
  border: 1px solid #334155;
}

/* --- GAME GRID --- */
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
}

.game-card {
  background: var(--card-bg);
  border-radius: 15px;
  overflow: hidden;
  transition: 0.3s;
  border: 1px solid #1e293b;
  cursor: pointer;
}

.game-card:hover {
  transform: translateY(-8px);
  border-color: var(--primary);
  box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

.game-card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.game-card h3 {
  margin: 0;
  padding: 12px;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  background: rgba(0,0,0,0.3);
}

/* --- MODALS --- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal-box {
  background: #0f172a;
  padding: 30px;
  border-radius: 20px;
  width: 400px;
  text-align: center;
  border: 1px solid #1e293b;
}

.modal-box input {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #334155;
  background: #020617;
  color: white;
}

.modal-box button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
}

/* --- TOAST --- */
#toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 99999;
}

.toast {
  background: #1e293b;
  color: white;
  padding: 15px 20px;
  border-radius: 12px;
  margin-bottom: 10px;
  border-left: 5px solid var(--primary);
}
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">🎮 Game Paradise</div>

  <div class="search-box">
    <input id="searchInput" type="search" placeholder="Zoek games..." autocomplete="off">
  </div>

  <div class="category-btn active" onclick="setFilter('all', this)">Alle games</div>
  <div class="category-btn" onclick="setFilter('favorites', this)">⭐ Favorieten</div>
  <div id="categoryList"></div>

  <!-- SUPPORT -->
  <div class="category-btn"
       onclick="openSupport()"
       style="border: 1px solid #22c55e; color: #86efac; text-align: center;">
    🛟 Support
  </div>

  <!-- CHAT -->
  <div class="category-btn"
       onclick="location.href='chat.html'"
       style="margin-top:auto; border: 1px solid #2563eb; color: #60a5fa; text-align: center;">
    💬 GP Chat
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <h2 id="sectionTitle" class="section-title">Alle Games</h2>
    <div>
      <button id="adminBtn" class="auth-btn admin-btn" style="display:none" onclick="location.href='admin.html'">⚙️ Admin</button>
      <button id="authBtn" class="auth-btn">Inloggen</button>
    </div>
  </div>

  <div id="gameGrid" class="game-grid"></div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
  <div class="modal-box">
    <h2>Inloggen</h2>
    <input id="emailInput" type="email" placeholder="E-mail">
    <input id="passwordInput" type="password" placeholder="Wachtwoord">
    <button id="loginSubmit" style="background: var(--primary)">Inloggen</button>
    <button id="registerSubmit" style="background: #16a34a">Account aanvragen</button>
    <button onclick="document.getElementById('loginModal').style.display='none'"
            style="background:#334155">Annuleren</button>
  </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="modal">
  <div class="modal-box" style="width:500px; max-height:90vh; overflow-y:auto;">
    <h2 style="color:var(--accent)">Account Aanvragen</h2>

    <iframe
      data-tally-src="https://tally.so/embed/yPYeEd?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
      loading="lazy"
      width="100%"
      height="500"
      frameborder="0">
    </iframe>

    <button onclick="document.getElementById('registerModal').style.display='none'"
            style="background:#1e293b">Sluiten</button>
  </div>
</div>

<!-- SUPPORT MODAL -->
<div id="supportModal" class="modal">
  <div class="modal-box" style="width:500px; max-height:90vh; overflow-y:auto;">
    <h2 style="color:var(--accent)">🛟 Support</h2>

    <iframe
      data-tally-src="https://tally.so/embed/jaPkda?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
      loading="lazy"
      width="100%"
      height="424"
      frameborder="0">
    </iframe>

    <button onclick="document.getElementById('supportModal').style.display='none'"
            style="background:#1e293b">Sluiten</button>
  </div>
</div>

<script>
var d=document,w="https://tally.so/widgets/embed.js",v=function(){
  if(typeof Tally!="undefined") Tally.loadEmbeds();
  else d.querySelectorAll("iframe[data-tally-src]:not([src])")
  .forEach(e=>e.src=e.dataset.tallySrc)
};
if(typeof Tally!="undefined") v();
else if(!d.querySelector('script[src="'+w+'"]')){
  var s=d.createElement("script");
  s.src=w; s.onload=v; s.onerror=v;
  d.body.appendChild(s);
}
</script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
  authDomain: "gameparadise-80490.firebaseapp.com",
  projectId: "gameparadise-80490",
  storageBucket: "gameparadise-80490.firebasestorage.app",
  messagingSenderId: "335620903527",
  appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAILS = ["someoeneheilig@gmail.com", "melle1337k@gmail.com"];
let currentUser = null;
let allGames = {};
let favorites = {};
let currentFilter = "all";

function openSupport() {
  document.getElementById("supportModal").style.display = "flex";
}

function notify(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerText = msg;
  document.getElementById("toast-container").appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

auth.onAuthStateChanged(user=>{
  currentUser = user;
  document.getElementById("authBtn").textContent = user ? "Uitloggen" : "Inloggen";
  document.getElementById("adminBtn").style.display =
    user && ADMIN_EMAILS.includes(user.email.toLowerCase()) ? "inline-block" : "none";
});

document.getElementById("authBtn").onclick = ()=>{
  if(currentUser) auth.signOut().then(()=>notify("Uitgelogd"));
  else document.getElementById("loginModal").style.display="flex";
};

document.getElementById("loginSubmit").onclick = ()=>{
  auth.signInWithEmailAndPassword(
    emailInput.value,
    passwordInput.value
  ).then(()=>{
    loginModal.style.display="none";
    notify("Ingelogd");
  }).catch(()=>notify("Fout bij inloggen"));
};

document.getElementById("registerSubmit").onclick = ()=>{
  loginModal.style.display="none";
  registerModal.style.display="flex";
};

function setFilter(cat, el){
  currentFilter = cat;
  document.querySelectorAll(".category-btn").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
}
</script>

</body>
</html>
