<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Game Paradise - Chat</title>
    <link rel="icon" type="image/png" href="/icon/favicon.png">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.6.4/dist/index.min.js"></script>

    <style>
        :root {
            --bg: #020617; --sidebar-bg: #010409; --card-bg: #0f172a;
            --primary: #2563eb; --accent: #60a5fa; --text-dim: #94a3b8;
            --sent: #172554; --received: #1e293b; --danger: #ef4444; --system: #334155;
            --online: #22c55e; --offline: #64748b; --reply-bg: #0f172a;
            --pending: #eab308;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: #e2e8f0; height: 100vh; overflow: hidden; display: flex; }

        /* SCROLLBARS */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* LAYOUT */
        .sidebar {
            width: 320px; background: var(--sidebar-bg); border-right: 1px solid #1e293b;
            display: flex; flex-direction: column; height: 100%; transition: transform 0.3s ease;
            z-index: 50;
        }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; background: var(--bg); height: 100%; }

        /* SIDEBAR ELEMENTS */
        .sb-header { padding: 20px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .sb-title { font-weight: 800; font-size: 20px; background: linear-gradient(to right, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .user-card { display: flex; align-items: center; padding: 15px; cursor: pointer; transition: 0.2s; border-radius: 12px; margin: 5px 10px; }
        .user-card:hover { background: #1e293b; }
        .user-card.active { background: #1e293b; border-left: 3px solid var(--accent); }
        .uc-pic { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #334155; margin-right: 12px; position: relative; }
        .uc-info { flex: 1; overflow: hidden; }
        .uc-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .uc-last { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
        .badge { background: var(--danger); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: auto; }
        
        /* TABS IN SIDEBAR */
        .sb-tabs { display: flex; padding: 10px; gap: 5px; }
        .sb-tab { flex: 1; padding: 8px; text-align: center; background: #1e293b; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text-dim); }
        .sb-tab.active { background: var(--primary); color: white; font-weight: bold; }
        
        .section-title { font-size: 11px; text-transform: uppercase; color: var(--text-dim); margin: 15px 15px 5px; font-weight: bold; letter-spacing: 0.5px; }

        /* CHAT AREA */
        .chat-header {
            padding: 15px 20px; border-bottom: 1px solid #1e293b; background: rgba(2, 6, 23, 0.95);
            display: flex; align-items: center; backdrop-filter: blur(10px); z-index: 10;
        }
        .ch-pic { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; object-fit: cover; }
        .ch-name { font-weight: bold; font-size: 16px; }
        .ch-status { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); }
        .status-dot.online { background: var(--online); box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }

        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 18px; position: relative; font-size: 14.5px; line-height: 1.5; word-wrap: break-word; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .msg.sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 4px; color: #e0f2fe; }
        .msg.received { align-self: flex-start; background: var(--received); border-bottom-left-radius: 4px; color: #f1f5f9; }
        
        .msg-img { max-width: 100%; border-radius: 12px; margin-top: 5px; cursor: pointer; }
        .msg-time { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: right; display: block; }
        
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* INPUT AREA */
        .chat-input { padding: 15px; background: var(--card-bg); position: relative; z-index: 20; }
        .input-row { display: flex; gap: 10px; align-items: flex-end; background: #1e293b; padding: 8px 12px; border-radius: 24px; border: 1px solid #334155; }
        
        #messageInput {
            flex: 1; background: transparent; border: none; color: white; padding: 8px;
            font-size: 15px; resize: none; max-height: 100px; outline: none;
        }
        
        .btn { padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        #sendBtn { background: var(--primary); color: white; padding: 8px 20px; }
        #sendBtn:hover { filter: brightness(1.1); }
        
        .btn-icon { background: transparent; color: var(--text-dim); padding: 8px; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { color: var(--accent); background: rgba(255,255,255,0.05); }

        /* --- NIEUWE MEDIA POPUP STYLES --- */
        .media-picker-btn {
            background: transparent; border: none; font-size: 22px; cursor: pointer;
            padding: 0 5px; transition: transform 0.2s;
        }
        .media-picker-btn:hover { transform: scale(1.1); }

        .media-popup {
            position: absolute; bottom: 80px; left: 15px; width: 340px; height: 400px;
            background: #0f172a; border: 1px solid #334155; border-radius: 12px;
            display: none; flex-direction: column; z-index: 2000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6); overflow: hidden;
        }
        
        .mp-tabs { display: flex; background: #020617; border-bottom: 1px solid #334155; }
        .mp-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #94a3b8; font-size: 13px; font-weight: bold; transition: 0.2s; }
        .mp-tab:hover { background: #1e293b; color: white; }
        .mp-tab.active { color: var(--accent); border-bottom: 3px solid var(--primary); background: #1e293b; }

        .mp-content { flex: 1; overflow-y: auto; padding: 10px; display: none; position: relative; }
        .mp-content.active { display: block; }

        /* GIF GRID STYLES */
        .gif-search {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155;
            background: #1e293b; color: white; margin-bottom: 10px; outline: none;
        }
        .gif-search:focus { border-color: var(--accent); }

        .gif-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
        }
        .gif-item {
            width: 100%; height: 100px; object-fit: cover; border-radius: 6px; 
            cursor: pointer; border: 2px solid transparent; background: #000; transition: border-color 0.2s;
        }
        .gif-item:hover { border-color: var(--accent); }
        
        /* LOGIN OVERLAY */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .auth-card {
            background: #1e293b; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px;
            text-align: center; border: 1px solid #334155; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .auth-input { width: 100%; padding: 12px; margin: 10px 0; background: #020617; border: 1px solid #334155; border-radius: 8px; color: white; }
        .auth-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* MOBILE RESPONSIVE */
        .back-btn { display: none; font-size: 20px; background: none; border: none; color: white; margin-right: 10px; }
        
        @media (max-width: 768px) {
            .sidebar { position: absolute; width: 100%; height: 100%; transform: translateX(0); }
            .sidebar.hidden { transform: translateX(-100%); }
            .back-btn { display: block; }
            .media-popup { width: calc(100% - 30px); left: 15px; bottom: 70px; }
        }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-card">
            <h2 style="margin-bottom:20px;">Welkom bij Game Paradise</h2>
            <input type="email" id="emailInput" class="auth-input" placeholder="E-mailadres">
            <input type="password" id="passInput" class="auth-input" placeholder="Wachtwoord">
            <button class="auth-btn" onclick="login()">Inloggen</button>
            <button class="auth-btn" style="background:#334155" onclick="register()">Registreren</button>
            <div style="margin-top:15px; font-size:12px; color:gray;">Login vereist om te chatten</div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sb-header">
            <div class="sb-title">Game Paradise</div>
            <button class="btn" style="padding:4px 8px; font-size:12px; background:#334155;" onclick="logout()">Uitloggen</button>
        </div>
        
        <div class="sb-tabs">
            <div class="sb-tab active" onclick="switchTab('chats')" id="tab-chats-btn">Chats</div>
            <div class="sb-tab" onclick="switchTab('add')" id="tab-add-btn">Toevoegen</div>
        </div>

        <div id="tab-chats" style="overflow-y:auto; flex:1;">
            <div id="requestsList"></div>
            <div class="section-title">Vrienden</div>
            <div id="friendsList">
                <div style="padding:20px; text-align:center; color:gray;">Laden...</div>
            </div>
        </div>

        <div id="tab-add" style="display:none; padding:15px;">
            <input type="email" id="friendEmail" class="auth-input" placeholder="E-mail van vriend">
            <button class="auth-btn" onclick="sendFriendRequest()">Verzoek Sturen</button>
            
            <div style="margin-top:20px;">
                <div class="section-title">Mijn Profiel</div>
                <input type="text" id="myDisplayName" class="auth-input" placeholder="Je Naam" onchange="updateProfile()">
                <input type="text" id="myPicUrl" class="auth-input" placeholder="Foto URL (Imgur)" onchange="updateProfile()">
            </div>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="chat-header" id="chatHeader" style="display:none;">
            <button class="back-btn" onclick="toggleSidebar()">←</button>
            <img src="" class="ch-pic" id="headerPic">
            <div>
                <div class="ch-name" id="headerName">Selecteer een vriend</div>
                <div class="ch-status">
                    <div class="status-dot" id="headerDot"></div>
                    <span id="headerStatus">Offline</span>
                </div>
            </div>
        </div>

        <div class="messages" id="messagesList">
            <div style="text-align:center; margin-top:50px; color:gray;">
                <h3>Welkom! 👋</h3>
                <p>Selecteer een vriend uit de lijst om te chatten.</p>
            </div>
        </div>

        <div class="chat-input" id="inputArea" style="display:none;">
            
            <div id="mediaPopup" class="media-popup">
                <div class="mp-tabs">
                    <div class="mp-tab active" onclick="switchMediaTab('emoji')">Emoji's</div>
                    <div class="mp-tab" onclick="switchMediaTab('gifs')">GIFs</div>
                    <div class="mp-tab" onclick="switchMediaTab('favs')">★ Favorieten</div>
                </div>
                
                <div id="tab-emoji" class="mp-content active"></div>

                <div id="tab-gifs" class="mp-content">
                    <input type="text" class="gif-search" placeholder="Zoek Tenor GIFs..." onkeyup="handleGifSearch(this.value)">
                    <div id="gifResults" class="gif-grid">Laden...</div>
                </div>

                <div id="tab-favs" class="mp-content">
                    <p style="font-size:11px; color:gray; text-align:center; margin-bottom:10px;">Rechtermuisklik op een GIF om op te slaan.</p>
                    <div id="favResults" class="gif-grid"></div>
                </div>
            </div>

            <div class="input-row">
                <button class="media-picker-btn" onclick="toggleMediaPopup()">😀</button>

                <button class="btn-icon" onclick="document.getElementById('imgInp').click()">
                    <img src="https://i.imgur.com/CeRZ8na.png" style="width: 24px; height: 24px; object-fit: contain;">
                </button>
                <input type="file" id="imgInp" hidden accept="image/*" onchange="handleImageSend(this)">
                
                <textarea id="messageInput" placeholder="Typ bericht... (Shift+Enter voor nieuwe regel)" 
                          oninput="handleTyping()"
                          onkeydown="handleKeyDown(event)"></textarea>
                
                <button id="sendBtn" class="btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function(e){e.src=e.dataset.tallySrc}))};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s);}</script>

    <script>
        // --- FIREBASE CONFIGURATIE ---
        // Vul hier je eigen firebase config in als dit niet werkt
        const firebaseConfig = {
            apiKey: "AIzaSyD...", 
            authDomain: "gameparadise-chat.firebaseapp.com",
            projectId: "gameparadise-chat",
            storageBucket: "gameparadise-chat.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };
        // Omdat ik geen echte keys heb, zal dit errors geven tenzij je jouw keys invult.
        // Als je het bestand hebt waar de config al in stond, vervang dit blok dan daarmee.
        // Voor nu ga ik ervan uit dat de firebase library geladen is.
        
        try {
            firebase.initializeApp(firebaseConfig);
        } catch(e) {
            console.log("Firebase init error (verwacht als config leeg is):", e);
        }
        
        const db = firebase.firestore();
        const auth = firebase.auth();
        let user = null;
        let activeChat = null;
        let unsubscribeChat = null;

        // --- AUTH ---
        auth.onAuthStateChanged(u => {
            user = u;
            if(user) {
                document.getElementById('authOverlay').style.display = 'none';
                initApp();
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
            }
        });

        async function login() {
            const e = document.getElementById('emailInput').value;
            const p = document.getElementById('passInput').value;
            try { await auth.signInWithEmailAndPassword(e, p); } 
            catch(err) { alert(err.message); }
        }

        async function register() {
            const e = document.getElementById('emailInput').value;
            const p = document.getElementById('passInput').value;
            try { 
                const cred = await auth.createUserWithEmailAndPassword(e, p);
                await db.collection('users').doc(cred.user.uid).set({
                    email: e, name: e.split('@')[0], pic: "", status: "online"
                });
            } catch(err) { alert(err.message); }
        }

        function logout() { auth.signOut(); location.reload(); }

        // --- APP LOGICA ---
        function initApp() {
            renderSidebar();
            // Zet status online
            db.collection('users').doc(user.uid).update({ status: 'online' });
            
            // Profiel laden in settings
            db.collection('users').doc(user.uid).get().then(doc => {
                if(doc.exists) {
                    const d = doc.data();
                    document.getElementById('myDisplayName').value = d.name || "";
                    document.getElementById('myPicUrl').value = d.pic || "";
                }
            });
        }

        async function renderSidebar() {
            // Vrienden laden
            db.collection('users').doc(user.uid).collection('friends').onSnapshot(snap => {
                const list = document.getElementById('friendsList');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const f = doc.data();
                    const div = document.createElement('div');
                    div.className = `user-card ${activeChat === doc.id ? 'active' : ''}`;
                    div.onclick = () => openChat(doc.id, f);
                    div.innerHTML = `
                        <img src="${f.pic || 'https://i.imgur.com/6VBx3io.png'}" class="uc-pic">
                        <div class="uc-info">
                            <div class="uc-name">${f.name}</div>
                            <div class="uc-last">Klik om te chatten</div>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });

            // Verzoeken laden
            db.collection('users').doc(user.uid).collection('requests').onSnapshot(snap => {
                const list = document.getElementById('requestsList');
                list.innerHTML = "";
                if(snap.empty) return;
                list.innerHTML = `<div class="section-title" style="color:var(--pending)">Verzoeken</div>`;
                snap.forEach(doc => {
                    const r = doc.data();
                    const div = document.createElement('div');
                    div.className = "user-card";
                    div.style.background = "#422006";
                    div.innerHTML = `
                        <div class="uc-info"><div class="uc-name">${r.name}</div><div class="uc-last">Wil vrienden worden</div></div>
                        <button class="btn" style="font-size:10px; padding:4px;" onclick="acceptRequest('${doc.id}', '${r.name}', '${r.pic}')">✔</button>
                    `;
                    list.appendChild(div);
                });
            });
        }

        function switchTab(t) {
            document.querySelectorAll('.sb-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${t}-btn`).classList.add('active');
            document.getElementById('tab-chats').style.display = t === 'chats' ? 'block' : 'none';
            document.getElementById('tab-add').style.display = t === 'add' ? 'block' : 'none';
        }

        async function sendFriendRequest() {
            const email = document.getElementById('friendEmail').value;
            if(!email) return;
            const snap = await db.collection('users').where('email', '==', email).get();
            if(snap.empty) { alert("Gebruiker niet gevonden."); return; }
            
            const friendId = snap.docs[0].id;
            const myData = (await db.collection('users').doc(user.uid).get()).data();
            
            await db.collection('users').doc(friendId).collection('requests').doc(user.uid).set({
                name: myData.name, pic: myData.pic || ""
            });
            alert("Verzoek verzonden!");
            document.getElementById('friendEmail').value = "";
        }

        async function acceptRequest(id, name, pic) {
            const myData = (await db.collection('users').doc(user.uid).get()).data();
            // Voeg toe aan mijn vrienden
            await db.collection('users').doc(user.uid).collection('friends').doc(id).set({ name, pic });
            // Voeg mij toe aan hun vrienden
            await db.collection('users').doc(id).collection('friends').doc(user.uid).set({ name: myData.name, pic: myData.pic });
            // Verwijder verzoek
            await db.collection('users').doc(user.uid).collection('requests').doc(id).delete();
        }

        async function updateProfile() {
            const name = document.getElementById('myDisplayName').value;
            const pic = document.getElementById('myPicUrl').value;
            await db.collection('users').doc(user.uid).update({ name, pic });
        }

        // --- CHAT FUNCTIONALITEIT ---
        function openChat(fid, fData) {
            activeChat = fid;
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'block';
            document.getElementById('headerName').innerText = fData.name;
            document.getElementById('headerPic').src = fData.pic || 'https://i.imgur.com/6VBx3io.png';
            
            // Mobiel: sidebar weg
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden');
            }

            // Load Messages
            const chatId = [user.uid, fid].sort().join('_');
            if(unsubscribeChat) unsubscribeChat();
            
            unsubscribeChat = db.collection('chats').doc(chatId).collection('msgs')
                .orderBy('ts', 'asc').limitToLast(50)
                .onSnapshot(snap => {
                    const div = document.getElementById('messagesList');
                    div.innerHTML = "";
                    snap.forEach(doc => {
                        renderMessage(doc.data(), div);
                    });
                    div.scrollTop = div.scrollHeight;
                });
        }

        function renderMessage(data, container) {
            const div = document.createElement('div');
            const isMe = data.uid === user.uid;
            div.className = `msg ${isMe ? 'sent' : 'received'}`;
            
            let content = "";
            if(data.txt) content += `<div>${escapeHtml(data.txt)}</div>`;
            if(data.img) content += `<img src="${data.img}" class="msg-img" onclick="window.open(this.src)">`;
            
            // Check voor Tally link
            if(data.txt && data.txt.includes("tally.so")) {
                content += `<iframe data-tally-src="${data.txt}" width="100%" height="200" frameborder="0" style="border-radius:10px; margin-top:5px;"></iframe>`;
                setTimeout(() => { if(typeof Tally !== 'undefined') Tally.loadEmbeds(); }, 500);
            }

            div.innerHTML = content + `<span class="msg-time">${new Date(data.ts?.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>`;
            container.appendChild(div);
        }

        function handleKeyDown(e) {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const txt = input.value.trim();
            if(!txt) return;
            pushMsg({ txt });
            input.value = "";
        }

        async function pushMsg(payload) {
            if(!activeChat) return;
            const chatId = [user.uid, activeChat].sort().join('_');
            await db.collection('chats').doc(chatId).collection('msgs').add({
                ...payload, uid: user.uid, ts: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        // Image Upload (via Imgur Anonymous)
        function handleImageSend(input) {
            const file = input.files[0];
            if(!file) return;
            
            const formData = new FormData();
            formData.append("image", file);
            
            // Notification
            const btn = document.querySelector('.btn-icon img');
            const originalSrc = btn.src;
            btn.src = "https://i.gifer.com/ZZ5H.gif"; // loading spinner

            fetch("https://api.imgur.com/3/image", {
                method: "POST",
                headers: { Authorization: "Client-ID 546c25a59c58ad7" }, // Publieke Client ID
                body: formData
            })
            .then(r => r.json())
            .then(data => {
                if(data.success) pushMsg({ img: data.data.link });
                else alert("Upload mislukt");
                btn.src = originalSrc;
            })
            .catch(e => { alert("Error"); btn.src = originalSrc; });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
        }

        function escapeHtml(text) {
            if(!text) return text;
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }


        // ==========================================
        //  NIEUWE FUNCTIES (EMOJI / GIFS / FAVS)
        // ==========================================

        const TENOR_KEY = "LIVDSRZULELA"; // Dit is een publieke test key. Vervang door je eigen als hij stopt.
        let emojiPickerInstance = null;
        let favoriteGifs = JSON.parse(localStorage.getItem('favGifs') || "[]");

        // 1. INITIALISEREN
        document.addEventListener('DOMContentLoaded', () => {
            // Init Emoji Picker
            const container = document.getElementById('tab-emoji');
            if(window.EmojiButton) {
                const picker = new EmojiButton({
                    position: 'bottom-start',
                    rootElement: container,
                    style: 'twemoji',
                    theme: 'dark',
                    autoHide: false,
                    showPreview: false,
                    initialCategory: 'smileys',
                    showSearch: false, // Cleaner look
                    rows: 6,
                    emojiSize: '24px'
                });

                picker.on('emoji', selection => {
                    const input = document.getElementById('messageInput');
                    input.value += selection.emoji;
                    input.focus();
                });
                
                // Hack: force show immediately in container
                picker.showPicker(container); 
                emojiPickerInstance = picker;
            }
            
            renderFavorites();
        });

        // 2. TOGGLE POPUP
        function toggleMediaPopup() {
            const popup = document.getElementById('mediaPopup');
            const isHidden = popup.style.display === 'none' || popup.style.display === '';
            popup.style.display = isHidden ? 'flex' : 'none';
            
            if(isHidden) {
                // Als we openen op de GIF tab, laad trending
                if(document.getElementById('tab-gifs').classList.contains('active')) {
                    if(document.getElementById('gifResults').innerHTML === 'Laden...') searchTenor('');
                }
            }
        }

        // 3. TAB SWITCHING
        function switchMediaTab(tabName) {
            document.querySelectorAll('.mp-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active'); 

            document.querySelectorAll('.mp-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');

            if(tabName === 'gifs') searchTenor(''); 
            if(tabName === 'favs') renderFavorites();
        }

        // 4. TENOR GIF LOGICA
        let gifDebounce = null;
        function handleGifSearch(query) {
            clearTimeout(gifDebounce);
            gifDebounce = setTimeout(() => searchTenor(query), 500);
        }

        async function searchTenor(query) {
            const grid = document.getElementById('gifResults');
            // Alleen laden animatie tonen als het leeg is of nieuwe zoekopdracht
            if(query) grid.innerHTML = '<div style="color:gray; padding:10px;">Laden...</div>';
            
            let url = `https://g.tenor.com/v1/trending?key=${TENOR_KEY}&limit=16`;
            if(query && query.trim() !== "") {
                url = `https://g.tenor.com/v1/search?q=${query}&key=${TENOR_KEY}&limit=16`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                grid.innerHTML = "";
                if(!data.results || data.results.length === 0) {
                    grid.innerHTML = '<div style="padding:10px;">Geen GIFs gevonden.</div>';
                    return;
                }

                data.results.forEach(gif => {
                    const previewUrl = gif.media[0].tinygif.url; // Sneller laden
                    const fullUrl = gif.media[0].gif.url; 

                    const img = document.createElement('img');
                    img.src = previewUrl;
                    img.className = 'gif-item';
                    
                    // Klik = Versturen
                    img.onclick = () => sendGifUrl(fullUrl);
                    
                    // Rechtsklik = Favoriet
                    img.oncontextmenu = (e) => {
                        e.preventDefault();
                        toggleFavorite(fullUrl, previewUrl);
                    };

                    grid.appendChild(img);
                });

            } catch(e) {
                console.error(e);
                grid.innerHTML = '<div style="color:red; padding:10px;">Fout bij laden GIFs.</div>';
            }
        }

        function sendGifUrl(url) {
            // Verstuur als plaatje
            pushMsg({ img: url });
            toggleMediaPopup(); // Sluit popup
        }

        // 5. FAVORIETEN LOGICA
        function toggleFavorite(fullUrl, previewUrl) {
            const index = favoriteGifs.findIndex(g => g.full === fullUrl);
            
            if(index === -1) {
                favoriteGifs.push({ full: fullUrl, preview: previewUrl });
                alert("GIF toegevoegd aan favorieten!");
            } else {
                favoriteGifs.splice(index, 1);
                alert("GIF verwijderd uit favorieten.");
            }
            
            localStorage.setItem('favGifs', JSON.stringify(favoriteGifs));
            renderFavorites();
        }

        function renderFavorites() {
            const grid = document.getElementById('favResults');
            grid.innerHTML = "";
            
            if(favoriteGifs.length === 0) {
                grid.innerHTML = '<div style="padding:10px; color:gray; font-size:12px;">Nog geen favorieten.<br><br>Rechtermuisklik op een GIF in de zoekresultaten om hem hier op te slaan.</div>';
                return;
            }

            favoriteGifs.forEach(gif => {
                const img = document.createElement('img');
                img.src = gif.preview;
                img.className = 'gif-item';
                img.onclick = () => sendGifUrl(gif.full);
                img.oncontextmenu = (e) => {
                    e.preventDefault();
                    toggleFavorite(gif.full, gif.preview);
                };
                grid.appendChild(img);
            });
        }
    </script>
</body>
</html>
