<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us Game</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <h1>Among Us Game</h1>
        <div id="login">
            <input type="text" id="username" placeholder="Enter username">
            <button id="loginButton">Login</button>
        </div>
        <div id="gameArea" style="display: none;">
            <h2>Welcome, <span id="displayUsername"></span>!</h2>
            <div id="gameFeatures">
                <!-- Game features go here -->
            </div>
        </div>
    </div>
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",  
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        document.getElementById('loginButton').addEventListener('click', function() {
            const username = document.getElementById('username').value;
            if (username) {
                // Set username in the database
                const userId = firebase.auth().currentUser ? firebase.auth().currentUser.uid : firebase.database().ref().child('users').push().key;
                firebase.database().ref('users/' + userId).set({ username: username });
                document.getElementById('displayUsername').innerText = username;
                document.getElementById('gameArea').style.display = 'block';
                document.getElementById('login').style.display = 'none';
            } else {
                alert('Please enter a username.');
            }
        });
    </script>
</body>
</html>
