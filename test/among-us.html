<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Among Us - Game Paradise</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  background: radial-gradient(circle at top, #1b1f3a, #000);
  color:white;
  font-family: Arial;
}

.container {
  max-width:800px;
  margin:auto;
  padding:20px;
  text-align:center;
}

button {
  background:#ff0055;
  border:none;
  padding:10px 20px;
  color:white;
  border-radius:8px;
  cursor:pointer;
  margin:5px;
}

button:hover {
  background:#ff3377;
}

.card {
  background:#111;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.player {
  padding:5px;
}
.impostor {
  color:red;
}
.crewmate {
  color:#00ffff;
}
.admin-panel {
  background:#300;
  padding:10px;
  margin-top:20px;
  border-radius:8px;
}
</style>
</head>

<body>
<div class="container">

<h1>Among Us</h1>

<div id="lobby">
  <button onclick="createRoom()">Create Room</button>
  <input id="roomInput" placeholder="Room ID">
  <button onclick="joinRoom()">Join Room</button>
</div>

<div id="game" style="display:none;">
  <h2 id="roomTitle"></h2>
  <div class="card">
    <h3>Players</h3>
    <div id="players"></div>
  </div>

  <button id="startBtn" style="display:none;" onclick="startGame()">Start Game</button>

  <div class="card">
    <h3>Your Role</h3>
    <div id="roleDisplay">Waiting...</div>
  </div>
</div>

<div id="adminPanel" class="admin-panel" style="display:none;">
  <h3>Admin Controls</h3>
  <button onclick="deleteRoom()">Delete Room</button>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "JOUW_API",
  authDomain: "JOUW_PROJECT.firebaseapp.com",
  projectId: "JOUW_PROJECT"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let currentRoom = null;
let username = "";
let isHost = false;

auth.onAuthStateChanged(async user => {
  if(!user){
    location.href = "index.html";
    return;
  }

  const userDoc = await db.collection("users").doc(user.uid).get();
  username = userDoc.data()?.username || user.email;
});

async function createRoom(){
  const user = auth.currentUser;

  const roomRef = await db.collection("rooms").add({
    hostId: user.uid,
    status:"waiting",
    maxPlayers:8,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  joinRoomById(roomRef.id);
}

async function joinRoom(){
  const id = document.getElementById("roomInput").value;
  joinRoomById(id);
}

async function joinRoomById(roomId){
  const user = auth.currentUser;
  currentRoom = roomId;

  await db.collection("rooms")
    .doc(roomId)
    .collection("players")
    .doc(user.uid)
    .set({
      name: username,
      role:null,
      alive:true
    });

  const roomDoc = await db.collection("rooms").doc(roomId).get();
  isHost = roomDoc.data().hostId === user.uid;

  document.getElementById("lobby").style.display="none";
  document.getElementById("game").style.display="block";
  document.getElementById("roomTitle").innerText="Room: "+roomId;

  if(isHost)
    document.getElementById("startBtn").style.display="block";

  listenPlayers();
  listenRole();
  checkAdmin();
}

function listenPlayers(){
  db.collection("rooms")
    .doc(currentRoom)
    .collection("players")
    .onSnapshot(snapshot=>{
      let html="";
      snapshot.forEach(doc=>{
        html+=`<div class="player">${doc.data().name}</div>`;
      });
      document.getElementById("players").innerHTML=html;
    });
}

function listenRole(){
  const user = auth.currentUser;

  db.collection("rooms")
    .doc(currentRoom)
    .collection("players")
    .doc(user.uid)
    .onSnapshot(doc=>{
      const role = doc.data()?.role;
      if(!role) return;

      const div = document.getElementById("roleDisplay");
      div.innerText = role.toUpperCase();
      div.className = role;
    });
}

async function startGame(){
  const playersSnap = await db.collection("rooms")
    .doc(currentRoom)
    .collection("players")
    .get();

  const players = playersSnap.docs;
  const randomIndex = Math.floor(Math.random()*players.length);

  for(let i=0;i<players.length;i++){
    const role = (i===randomIndex) ? "impostor" : "crewmate";
    await players[i].ref.update({ role });
  }

  await db.collection("rooms")
    .doc(currentRoom)
    .update({ status:"playing" });
}

async function deleteRoom(){
  await db.collection("rooms").doc(currentRoom).delete();
  location.reload();
}

function checkAdmin(){
  const user = auth.currentUser;
  if(user.email==="someoeneheilig@gmail.com" ||
     user.email==="melle1337k@gmail.com"){
    document.getElementById("adminPanel").style.display="block";
  }
}
</script>

</body>
</html>
