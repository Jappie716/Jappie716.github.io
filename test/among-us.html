<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Space Impostor</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  background:black;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 40px 40px;
  color:white;
  font-family: 'Arial Black', Arial;
}

.center {
  text-align:center;
  padding-top:40px;
}

.title {
  font-size:50px;
  color:#ff0044;
  text-shadow: 0 0 20px red;
}

button {
  background:#ff0044;
  border:none;
  padding:15px 30px;
  margin:10px;
  font-size:18px;
  border-radius:40px;
  color:white;
  cursor:pointer;
  box-shadow:0 0 20px #ff0044;
}

button:hover {
  transform:scale(1.05);
}

.room-box {
  background:#111;
  padding:20px;
  border-radius:20px;
  margin:20px auto;
  width:400px;
}

.player {
  margin:5px;
  padding:10px;
  border-radius:20px;
  background:#222;
}

.impostor {
  color:red;
  font-size:28px;
  text-shadow:0 0 15px red;
}

.crewmate {
  color:#00ffff;
  font-size:28px;
  text-shadow:0 0 15px cyan;
}
</style>
</head>
<body>

<div class="center">

<div class="title">SPACE IMPOSTOR</div>

<div id="lobby">
  <button onclick="createRoom()">CREATE GAME</button><br>
  <input id="roomInput" placeholder="Room Code" style="padding:10px;border-radius:20px;">
  <button onclick="joinRoom()">JOIN</button>
</div>

<div id="game" style="display:none;">
  <div class="room-box">
    <h2 id="roomTitle"></h2>
    <div id="players"></div>
  </div>

  <div id="roleDisplay"></div>

  <button id="startBtn" style="display:none;" onclick="startGame()">START</button>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "JOUW_API",
  authDomain: "JOUW_PROJECT.firebaseapp.com",
  projectId: "JOUW_PROJECT"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

let currentRoom = null;
let username = "";
let isHost = false;

auth.onAuthStateChanged(async user => {

  if(!user){
    document.body.innerHTML = `
      <div style="color:white;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;">
        <h1>Account Required</h1>
        <p>You must be logged in to play.</p>
        <a href="index.html" style="color:#00ffff;">Back to homepage</a>
      </div>
    `;
    return;
  }

  const userDoc = await db.collection("users").doc(user.uid).get();
  username = userDoc.data()?.username || user.email;
});

async function createRoom(){
  const user = auth.currentUser;

  const roomRef = await db.collection("rooms").add({
    hostId:user.uid,
    status:"waiting",
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });

  joinRoomById(roomRef.id);
}

async function joinRoom(){
  const id = document.getElementById("roomInput").value;
  joinRoomById(id);
}

async function joinRoomById(roomId){
  const user = auth.currentUser;
  currentRoom = roomId;

  await db.collection("rooms")
    .doc(roomId)
    .collection("players")
    .doc(user.uid)
    .set({
      name:username,
      role:null,
      alive:true
    });

  const roomDoc = await db.collection("rooms").doc(roomId).get();
  isHost = roomDoc.data().hostId===user.uid;

  document.getElementById("lobby").style.display="none";
  document.getElementById("game").style.display="block";
  document.getElementById("roomTitle").innerText="ROOM: "+roomId;

  if(isHost)
    document.getElementById("startBtn").style.display="block";

  listenPlayers();
  listenRole();
}

function listenPlayers(){
  db.collection("rooms")
    .doc(currentRoom)
    .collection("players")
    .onSnapshot(snapshot=>{
      let html="";
      snapshot.forEach(doc=>{
        html+=`<div class="player">${doc.data().name}</div>`;
      });
      document.getElementById("players").innerHTML=html;
    });
}

function listenRole(){
  const user = auth.currentUser;

  db.collection("rooms")
    .doc(currentRoom)
    .collection("players")
    .doc(user.uid)
    .onSnapshot(doc=>{
      const role=doc.data()?.role;
      if(!role) return;

      const div=document.getElementById("roleDisplay");
      div.innerText=role.toUpperCase();
      div.className=role;
    });
}

async function startGame(){
  const snap = await db.collection("rooms")
    .doc(currentRoom)
    .collection("players")
    .get();

  const players=snap.docs;
  const randomIndex=Math.floor(Math.random()*players.length);

  for(let i=0;i<players.length;i++){
    const role=(i===randomIndex)?"impostor":"crewmate";
    await players[i].ref.update({role});
  }
}
</script>

</body>
</html>
