<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Game Paradise - Admin</title>
    <link rel="icon" type="image/png" href="/icon/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #020617; --card-bg: rgba(30, 41, 59, 0.4);
            --primary: #2563eb; --accent: #60a5fa; --danger: #ef4444; --success: #22c55e;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 260px; background: #010409; padding: 20px; border-right: 1px solid #1e293b; display: flex; flex-direction: column; gap: 10px; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; color: var(--accent); }
        .sidebar button { background: transparent; border: 1px solid #1e293b; color: white; padding: 12px; text-align: left; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .sidebar button:hover { background: #1e293b; border-color: var(--accent); }

        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); padding: 25px; border-radius: 15px; border: 1px solid #1e293b; margin-bottom: 20px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #020617; border: 1px solid #1e293b; color: white; border-radius: 8px; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: var(--danger); }
        
        #toast { position: fixed; bottom: 20px; right: 20px; background: var(--success); color: white; padding: 15px 25px; border-radius: 8px; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div id="toast">Melding!</div>

<div class="sidebar">
    <h2>GP Admin</h2>
    <button onclick="showTab('news-tab')">📰 Nieuws Beheer</button>
    <button onclick="showTab('editor')">🎮 Game Toevoegen</button>
    <button onclick="showTab('list')">📋 Game Lijst</button>
    <button onclick="showTab('cats')">📁 Categorieën</button>
    <button onclick="showTab('users')">👤 Gebruikers</button>
    <button onclick="clearAllChat()" class="btn-danger">🗑 Wis Chat</button>
    <button onclick="location.href='index.html'" style="margin-top:auto">🏠 Naar Site</button>
</div>

<div class="main">
    <div id="news-tab" class="tab-content">
        <h2>📰 Nieuws & Updates Publiceren</h2>
        <div class="card">
            <label>Titel van het bericht</label>
            <input type="text" id="newsTitle" placeholder="Bijv: Update v2.0 is live!">
            <label>Inhoud</label>
            <textarea id="newsText" placeholder="Wat wil je vertellen aan de gebruikers?" style="height: 150px;"></textarea>
            <label>Link (optioneel)</label>
            <input type="text" id="newsLink" placeholder="https://gameparadise.nl/update-info">
            <button class="btn" onclick="publishNews()">Update Publiceren</button>
        </div>
    </div>

    <div id="editor" class="tab-content">
        <h2 id="editorTitle">Nieuwe Game</h2>
        <div class="card">
            <input type="hidden" id="editId">
            <input type="text" id="editTitle" placeholder="Game Titel">
            <input type="text" id="editImg" placeholder="Afbeelding URL">
            <input type="text" id="editLink" placeholder="Game Link (URL)">
            <select id="editCat"></select>
            <div style="margin: 15px 0;">
                <label><input type="checkbox" id="editHasSave"> Slaat voortgang op (💾)</label><br><br>
                <label><input type="checkbox" id="editHasInfo"> Heeft info-knop (❓)</label>
            </div>
            <textarea id="editInfoText" placeholder="Info tekst voor de ❓ knop..."></textarea>
            <button class="btn" onclick="saveGame()">Opslaan</button>
            <button class="btn btn-danger" onclick="resetEditor(); showTab('list')">Annuleren</button>
        </div>
    </div>

    <div id="list" class="tab-content">
        <h2>Alle Games</h2>
        <div id="gamesContainer"></div>
    </div>

    <div id="cats" class="tab-content">
        <h2>Categorieën</h2>
        <div class="card">
            <input type="text" id="catId" placeholder="ID (bijv. actie)">
            <input type="text" id="catName" placeholder="Naam (bijv. Actie & Avontuur)">
            <button class="btn" onclick="addCategory()">Toevoegen</button>
        </div>
        <div id="catsContainer"></div>
    </div>

    <div id="users" class="tab-content">
        <h2>Gebruikers</h2>
        <div id="usersContainer"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
    authDomain: "gameparadise-80490.firebaseapp.com",
    projectId: "gameparadise-80490",
    storageBucket: "gameparadise-80490.firebasestorage.app",
    messagingSenderId: "335620903527",
    appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function notify(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

function showTab(id) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'news-tab') loadCurrentNews();
}

// NIEUWS FUNCTIES
async function publishNews() {
    const title = document.getElementById('newsTitle').value;
    const text = document.getElementById('newsText').value;
    const link = document.getElementById('newsLink').value;

    await db.collection("settings").doc("news").set({
        title, text, link, timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    notify("✅ Nieuwsbericht geplaatst!");
}

async function loadCurrentNews() {
    const doc = await db.collection("settings").doc("news").get();
    if(doc.exists) {
        const d = doc.data();
        document.getElementById('newsTitle').value = d.title || "";
        document.getElementById('newsText').value = d.text || "";
        document.getElementById('newsLink').value = d.link || "";
    }
}

// GAME FUNCTIES
async function saveGame() {
    const id = document.getElementById('editId').value || document.getElementById('editTitle').value.toLowerCase().replace(/\s/g, '-');
    const data = {
        title: document.getElementById('editTitle').value,
        image: document.getElementById('editImg').value,
        link: document.getElementById('editLink').value,
        category: document.getElementById('editCat').value,
        hasSave: document.getElementById('editHasSave').checked,
        hasInfo: document.getElementById('editHasInfo').checked,
        infoText: document.getElementById('editInfoText').value
    };
    await db.collection("games").doc(id).set(data);
    notify("Game opgeslagen!");
    resetEditor();
    showTab('list');
}

function resetEditor() {
    document.getElementById('editId').value = "";
    document.getElementById('editTitle').value = "";
    document.getElementById('editImg').value = "";
    document.getElementById('editLink').value = "";
    document.getElementById('editHasSave').checked = false;
    document.getElementById('editHasInfo').checked = false;
    document.getElementById('editInfoText').value = "";
}

// Laden van data
db.collection("categories").onSnapshot(snap => {
    const select = document.getElementById('editCat');
    const container = document.getElementById('catsContainer');
    select.innerHTML = ""; container.innerHTML = "";
    snap.forEach(doc => {
        select.innerHTML += `<option value="${doc.id}">${doc.data().name}</option>`;
        container.innerHTML += `<div class="card">${doc.data().name} <button class="btn btn-danger" onclick="deleteItem('categories','${doc.id}')">X</button></div>`;
    });
});

db.collection("games").onSnapshot(snap => {
    const container = document.getElementById('gamesContainer');
    container.innerHTML = "";
    snap.forEach(doc => {
        const g = doc.data();
        container.innerHTML += `<div class="card"><b>${g.title}</b> (${g.category}) 
            <button class="btn" onclick="editGame('${doc.id}')">Edit</button>
            <button class="btn btn-danger" onclick="deleteItem('games','${doc.id}')">X</button></div>`;
    });
});

function editGame(id) {
    db.collection("games").doc(id).get().then(doc => {
        const g = doc.data();
        document.getElementById('editId').value = id;
        document.getElementById('editTitle').value = g.title;
        document.getElementById('editImg').value = g.image;
        document.getElementById('editLink').value = g.link;
        document.getElementById('editCat').value = g.category;
        document.getElementById('editHasSave').checked = g.hasSave;
        document.getElementById('editHasInfo').checked = g.hasInfo;
        document.getElementById('editInfoText').value = g.infoText || "";
        showTab('editor');
    });
}

function deleteItem(col, id) {
    if(confirm("Zeker weten?")) db.collection(col).doc(id).delete();
}

async function clearAllChat() {
    if(confirm("Hele chat wissen?")) {
        const snap = await db.collection("chats").get();
        snap.forEach(doc => doc.ref.delete());
        notify("Chat gewist.");
    }
}

showTab('news-tab');
</script>
</body>
</html>
