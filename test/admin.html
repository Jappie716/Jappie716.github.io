<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Game Paradise - Admin</title>
<link rel="icon" type="image/png" href="/icon/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
:root{
--bg:#020617;
--card-bg:rgba(30,41,59,0.4);
--primary:#2563eb;
--accent:#60a5fa;
--danger:#ef4444;
--success:#22c55e;
}
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:var(--bg);
color:white;
display:flex;
height:100vh;
overflow:hidden;
}
.sidebar{
width:260px;
background:#010409;
padding:20px;
border-right:1px solid #1e293b;
display:flex;
flex-direction:column;
}
.logo{
color:var(--accent);
font-size:20px;
font-weight:bold;
margin-bottom:30px;
text-align:center;
}
.nav-btn{
width:100%;
padding:12px;
margin-bottom:8px;
background:transparent;
color:#94a3b8;
border:none;
text-align:left;
cursor:pointer;
border-radius:8px;
transition:0.2s;
}
.nav-btn:hover{
background:#1e293b;
color:white;
}
.nav-btn.active{
background:var(--primary);
color:white;
}
.main{
flex:1;
padding:30px;
overflow-y:auto;
background:radial-gradient(circle at top right,#0f172a,#020617);
}
.section{display:none;}
.card{
background:var(--card-bg);
padding:25px;
border-radius:15px;
border:1px solid #1e293b;
margin-bottom:25px;
}
input,textarea{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #334155;
background:#0f172a;
color:white;
outline:none;
}
.btn{
padding:12px 20px;
border-radius:10px;
border:none;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}
.success{
background:var(--success);
color:white;
width:100%;
margin-bottom:10px;
}
.danger{
background:var(--danger);
color:white;
}
#toast-container{
position:fixed;
top:20px;
right:20px;
z-index:9999;
}
.toast{
background:#1e293b;
padding:15px 25px;
border-radius:10px;
margin-bottom:10px;
border-left:5px solid var(--primary);
}
</style>
</head>
<body>

<div id="toast-container"></div>

<div class="sidebar">
<div class="logo">🎮 Admin Panel</div>

<button class="nav-btn active" id="btn-dashboard" onclick="showTab('dashboard')">📊 Dashboard</button>
<button class="nav-btn" id="btn-users" onclick="showTab('users')">👤 User Beheer</button>

<div style="margin-top:auto;">
<button class="btn" style="width:100%;background:#1e293b;color:white;margin-bottom:10px" onclick="location.href='index.html'">🌐 Bekijk Site</button>
<button class="btn danger" style="width:100%" onclick="auth.signOut()">🚪 Uitloggen</button>
</div>
</div>

<div class="main">

<div id="dashboardSection" class="section" style="display:block">
<div class="card">
<h2>Welkom Admin</h2>
<p>Hier kan je gebruikers volledig verwijderen.</p>
</div>
</div>

<div id="usersSection" class="section">
<div class="card">
<h3>Gebruiker volledig verwijderen</h3>
<p style="color:#94a3b8;font-size:14px;">
Verwijdert ALLE Firestore data van deze gebruiker.
Auth user moet je daarna nog handmatig verwijderen.
</p>

<input type="text" id="deleteUidInput" placeholder="Voer UID in">

<button class="btn danger" style="width:100%;" onclick="deleteFullUser()">
🔥 Verwijder gebruiker compleet
</button>

<div style="margin-top:15px;">
<a href="https://console.firebase.google.com/u/0/project/gameparadise-80490/authentication/users"
target="_blank"
style="color:#60a5fa;">
👉 Open Firebase Authentication om user definitief te verwijderen
</a>
</div>

</div>
</div>

</div>

<script>
const firebaseConfig = {
apiKey:"AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
authDomain:"gameparadise-80490.firebaseapp.com",
projectId:"gameparadise-80490",
storageBucket:"gameparadise-80490.firebasestorage.app",
messagingSenderId:"335620903527",
appId:"1:335620903527:web:1bc1e01a386bf6e4e7fac2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const ADMINS=["someoeneheilig@gmail.com","melle1337k@gmail.com"];

auth.onAuthStateChanged(user=>{
if(user && ADMINS.includes(user.email.toLowerCase())){
}else{
alert("Geen toegang");
location.href="index.html";
}
});

function notify(msg){
const t=document.createElement('div');
t.className='toast';
t.innerText=msg;
document.getElementById('toast-container').appendChild(t);
setTimeout(()=>t.remove(),3000);
}

function showTab(id){
document.querySelectorAll('.section').forEach(s=>s.style.display='none');
document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
document.getElementById(id+'Section').style.display='block';
document.getElementById('btn-'+id).classList.add('active');
}

async function deleteCollection(ref){
const snap=await ref.get();
snap.forEach(doc=>doc.ref.delete());
}

async function deleteFullUser() {
    const uid = document.getElementById("deleteUidInput").value.trim();
    if(!uid) return notify("Voer een UID in");
    if(!confirm("Weet je zeker dat je deze gebruiker volledig wilt verwijderen?")) return;

    try {
        notify("Verwijderen gestart...");

        const userRef = db.collection("users").doc(uid);

        // --- Subcollections verwijderen ---
        const subcollections = ["friends", "requests", "sentRequests", "favorites", "saveData"];
        for (const col of subcollections) {
            const snap = await userRef.collection(col).get();
            snap.forEach(doc => doc.ref.delete());
        }

        // --- Hoofd document user ---
        await userRef.delete();

        // --- Chats ---
        const chats = await db.collection("chats").where("uid", "==", uid).get();
        chats.forEach(doc => doc.ref.delete());

        // --- Groups Messages ---
        const groups = await db.collection("groups").get();
        for (const g of groups.docs) {
            const msgs = await g.ref.collection("messages").where("uid","==",uid).get();
            msgs.forEach(doc => doc.ref.delete());
        }

        // --- Private Chats Messages ---
        const privateChats = await db.collection("private_chats").get();
        for (const pc of privateChats.docs) {
            const msgs = await pc.ref.collection("messages").where("uid","==",uid).get();
            msgs.forEach(doc => doc.ref.delete());
        }

        // --- Metadata ---
        const metadata = await db.collection("metadata").where("uid","==",uid).get();
        metadata.forEach(doc => doc.ref.delete());

        notify("Alle Firestore data volledig verwijderd.");
        alert("Firestore data verwijderd.\nVerwijder nu de gebruiker in Firebase Authentication.");

        document.getElementById("deleteUidInput").value="";

    } catch(e) {
        alert("Fout: " + e.message);
    }
}
</script>

</body>
</html>
