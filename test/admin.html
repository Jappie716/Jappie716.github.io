<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Game Paradise - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="/icon/favicon.png">
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg: #020617; 
            --card-bg: rgba(30, 41, 59, 0.4);
            --primary: #2563eb; 
            --accent: #60a5fa; 
            --danger: #ef4444; 
            --success: #22c55e;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); color: white; 
            display: flex; height: 100vh; overflow: hidden; 
        }
        
        /* --- SIDEBAR (Precies zoals index.html) --- */
        .sidebar { 
            width: 260px; background: #010409; padding: 20px; 
            border-right: 1px solid #1e293b; 
            display: flex; flex-direction: column; 
            height: 100vh; z-index: 50;
            transition: transform 0.3s ease;
        }
        
        .logo { color: var(--accent); font-size: 20px; font-weight: bold; margin-bottom: 30px; text-align: center; }
        
        .nav-btn { 
            width: 100%; padding: 12px; margin-bottom: 8px; 
            background: transparent; color: #94a3b8; border: none; 
            text-align: left; cursor: pointer; border-radius: 8px; 
            transition: 0.2s; font-size: 16px; 
        }
        .nav-btn:hover { background: #1e293b; color: white; }
        .nav-btn.active { background: var(--primary); color: white; }

        /* Overlay voor mobiel menu */
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
            z-index: 40; display: none; backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; }

        /* --- MAIN CONTENT --- */
        .main { 
            flex: 1; padding: 20px; overflow-y: auto; 
            background: radial-gradient(circle at top right, #0f172a, #020617); 
            position: relative; 
        }
        
        /* Topbar met hamburger (alleen zichtbaar op mobiel) */
        .topbar { display: none; align-items: center; gap: 15px; margin-bottom: 20px; }
        .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0; }

        .section { display: none; animation: fadeIn 0.3s ease; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid #1e293b; margin-bottom: 20px; }

        /* --- FORMS & INPUTS --- */
        input, select, textarea { 
            width: 100%; padding: 12px; margin-bottom: 15px; 
            border-radius: 10px; border: 1px solid #334155; 
            background: #0f172a; color: white; outline: none; font-size: 16px; 
        }
        .btn { padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .success { background: var(--success); color: white; }
        .danger { background: var(--danger); color: white; }
        .primary { background: var(--primary); color: white; }
        
        /* --- GEBRUIKERS LIJST (Aangepast voor compacte knoppen) --- */
        .user-item { 
            display: flex; 
            justify-content: space-between; /* Tekst links, knop rechts */
            align-items: center; 
            background: #1e293b; 
            padding: 12px 15px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            border: 1px solid #334155; 
        }
        .user-info { 
            overflow: hidden; 
            margin-right: 10px; 
        }
        .user-info strong { 
            font-size: 15px; display: block; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        .user-info small { 
            color: #64748b; font-family: monospace; font-size: 11px; 
        }
        /* De compacte verwijder knop */
        .btn-icon-small {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            padding: 0; font-size: 16px; flex-shrink: 0;
        }

        /* --- TABELLEN --- */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        td, th { padding: 10px; border-bottom: 1px solid #1e293b; text-align: left; }
        .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { background: #1e293b; color: white; padding: 15px 25px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; top: 0; left: 0; bottom: 0;
                transform: translateX(-100%); /* Verborgen links */
                width: 280px; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            }
            .sidebar.active { transform: translateX(0); /* Schuif in */ }
            .topbar { display: flex; /* Toon hamburger balk */ }
            .main { padding: 15px; }
            
            /* Nog iets compacter op mobiel */
            .user-item { padding: 10px; }
            .btn-icon-small { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

<div id="sidebar" class="sidebar">
    <div class="logo">🎮 Admin Panel</div>
    <button class="nav-btn active" id="btn-dashboard" onclick="showTab('dashboard')">📊 Dashboard</button>
    <button class="nav-btn" id="btn-users" onclick="showTab('users')">👥 Gebruikers</button>
    <button class="nav-btn" id="btn-editor" onclick="showTab('editor')">✏️ Game Editor</button>
    <button class="nav-btn" id="btn-games" onclick="showTab('games')">🎮 Games Lijst</button>
    <button class="nav-btn" id="btn-updates" onclick="showTab('updates')">🔔 Updates</button>
    <button class="nav-btn" id="btn-chat" onclick="showTab('chat')">💬 Chat Beheer</button>
    
    <div style="margin-top: auto;">
        <button class="btn" style="width:100%; background:#1e293b; color:white; margin-bottom:10px" onclick="location.href='index.html'">🌐 Bekijk Site</button>
        <button class="btn danger" style="width:100%" onclick="auth.signOut()">🚪 Uitloggen</button>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h2 style="margin:0; font-size: 18px;" id="pageTitle">Dashboard</h2>
    </div>

    <div id="dashboardSection" class="section" style="display:block">
        <div class="card">
            <h2>Welkom Admin</h2>
            <div id="stats" style="margin-top:10px; font-weight:bold; color:var(--accent);">Laden...</div>
        </div>
    </div>

    <div id="usersSection" class="section">
        <div class="card">
            <h3 style="margin-top:0">👥 Gebruikers</h3>
            <p style="font-size:12px; color:#94a3b8; margin-bottom:15px">Let op: verwijderen wist alle voortgang en chats.</p>
            
            <input type="text" id="userSearchInput" placeholder="🔍 Zoek gebruiker..." onkeyup="filterUsers()" style="padding:10px;">
            
            <div id="usersList">
                <p style="color:#94a3b8">Laden...</p>
            </div>
            
            <div style="margin-top:20px; padding-top:10px; border-top:1px solid #334155;">
                <a href="https://console.firebase.google.com/u/0/project/gameparadise-80490/authentication/users" 
                   target="_blank" style="color:var(--danger); text-decoration:none; font-size:12px;">
                   🔗 Naar Firebase Auth Console (voor definitief verwijderen login)
                </a>
            </div>
        </div>
    </div>

    <div id="editorSection" class="section">
        <div class="card">
            <h3 id="editorTitle">Nieuwe Game</h3>
            <div style="text-align:center; margin-bottom:10px;">
                <img id="editPreview" src="" alt="" style="max-height:100px; display:none; border-radius:8px; margin:0 auto;">
            </div>
            <input id="editId" placeholder="ID (bv: subway-surfers)">
            <input id="editTitle" placeholder="Titel">
            <input id="editImg" placeholder="Plaatje URL" oninput="updateImgPreview(this.value)">
            <input id="editLink" value="games/" placeholder="Map link">
            <div style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;" id="catCheckboxes"></div>
            <label style="display:block; margin-bottom:5px"><input type="checkbox" id="editHasSave" style="width:auto"> Slaat op (💾)</label>
            <label style="display:block; margin-bottom:10px"><input type="checkbox" id="editHasInfo" style="width:auto"> Info knop (❓)</label>
            <textarea id="editInfoText" placeholder="Info tekst" rows="2"></textarea>
            <button class="btn success" onclick="saveGame()">Opslaan</button>
            <button class="btn" onclick="resetEditor()">Reset</button>
        </div>
    </div>

    <div id="gamesSection" class="section">
        <div class="card">
            <input type="text" id="gameSearch" placeholder="🔍 Zoek game..." onkeyup="filterGamesTable()">
            <div class="table-container">
                <table id="gamesTable">
                    <thead><tr><th>Pic</th><th>Titel</th><th></th></tr></thead>
                    <tbody id="gamesList"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="updatesSection" class="section">
        <div class="card">
            <h3>Update Plaatsen</h3>
            <input id="updateTitle" placeholder="Titel">
            <textarea id="updateContent" placeholder="Tekst..." rows="3"></textarea>
            <button class="btn success" onclick="postUpdate()">Plaatsen</button>
        </div>
        <div class="card" id="updatesList"></div>
    </div>

    <div id="chatSection" class="section">
        <div class="card"><button class="btn danger" onclick="clearAllChat()">🚨 Wis HELE Chat</button></div>
        <div id="adminChatList"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
    authDomain: "gameparadise-80490.firebaseapp.com",
    projectId: "gameparadise-80490",
    storageBucket: "gameparadise-80490.firebasestorage.app",
    messagingSenderId: "335620903527",
    appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const ADMINS = ["someoeneheilig@gmail.com", "melle1337k@gmail.com"];

let allUsers = [];

auth.onAuthStateChanged(user => {
    if (user && ADMINS.includes(user.email.toLowerCase())) {
        init();
        loadUsers();
    } else {
        alert("Geen admin toegang.");
        location.href = "index.html";
    }
});

function notify(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.innerText = msg;
    document.getElementById('toast-container').appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

// --- Menu Logic (Hamburger) ---
function toggleSidebar(forceOpen = null) {
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebarOverlay');
    if (forceOpen === false) {
        sb.classList.remove('active');
        ov.classList.remove('active');
    } else {
        sb.classList.toggle('active');
        ov.classList.toggle('active');
    }
}

function showTab(id) {
    document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id + 'Section').style.display = 'block';
    document.getElementById('btn-' + id).classList.add('active');
    
    // Update titel in mobiele balk
    const names = {'dashboard':'Dashboard','users':'Gebruikers','editor':'Editor','games':'Games','updates':'Updates','chat':'Chat'};
    document.getElementById('pageTitle').innerText = names[id] || 'Admin';
    
    toggleSidebar(false); // Sluit menu op mobiel na klik
}

function updateImgPreview(url) {
    const img = document.getElementById('editPreview');
    if(url.length > 5){ img.src = url; img.style.display = 'block'; } 
    else { img.style.display = 'none'; }
}

function init() {
    // Games laden
    db.collection("games").onSnapshot(s => {
        const list = document.getElementById('gamesList'); list.innerHTML = "";
        document.getElementById('stats').innerText = `Games online: ${s.size}`;
        s.forEach(doc => {
            const g = doc.data();
            list.innerHTML += `<tr class="game-row">
                <td><img src="${g.image}" class="thumb"></td>
                <td class="g-title"><b>${g.title}</b></td>
                <td style="text-align:right">
                    <button class="btn btn-icon-small primary" onclick="editGame('${doc.id}')" style="display:inline-block; margin-right:5px">✏️</button>
                    <button class="btn btn-icon-small danger" onclick="deleteItem('games','${doc.id}')" style="display:inline-block">🗑️</button>
                </td>
            </tr>`;
        });
    });

    // Categorieën ophalen voor editor
    db.collection("categories").onSnapshot(s => {
        const box = document.getElementById('catCheckboxes'); box.innerHTML = "";
        s.forEach(doc => {
            box.innerHTML += `<label style="background:#1e293b; padding:5px 10px; border-radius:5px; font-size:13px; cursor:pointer;">
                <input type="checkbox" value="${doc.id}" name="gameCategory"> ${doc.data().name}
            </label>`;
        });
    });
    
    // Updates
    db.collection("updates").orderBy("timestamp", "desc").onSnapshot(s => {
        const list = document.getElementById('updatesList'); list.innerHTML = "";
        s.forEach(doc => {
            list.innerHTML += `<div style="border-bottom:1px solid #334155; padding:10px; position:relative;">
                <button onclick="deleteItem('updates','${doc.id}')" style="position:absolute; right:0; top:5px; background:none; border:none; cursor:pointer;">❌</button>
                <b>${doc.data().title}</b><br><small style="color:#94a3b8">${doc.data().content}</small>
            </div>`;
        });
    });
    
    // Chat
    db.collection("chats").orderBy("timestamp", "desc").limit(20).onSnapshot(s => {
        const list = document.getElementById('adminChatList'); list.innerHTML = "";
        s.forEach(doc => {
            list.innerHTML += `<div style="background:#1e293b; padding:8px; margin-bottom:5px; border-radius:5px; display:flex; justify-content:space-between;">
                <span style="font-size:13px;"><b>${doc.data().user}:</b> ${doc.data().text}</span>
                <button onclick="deleteItem('chats','${doc.id}')" style="background:none; border:none; cursor:pointer;">❌</button>
            </div>`;
        });
    });
}

// --- GEBRUIKERS LOGICA (Aangepast) ---
function loadUsers() {
    db.collection("users").get().then(snap => {
        allUsers = [];
        snap.forEach(doc => allUsers.push({ id: doc.id, ...doc.data() }));
        renderUsers(allUsers);
    });
}

function renderUsers(users) {
    const list = document.getElementById('usersList');
    list.innerHTML = "";
    if(users.length === 0) { list.innerHTML = "<p>Geen resultaat.</p>"; return; }

    users.forEach(u => {
        // Logic: Als er geen naam is, pak email.
        let mainName = u.username || u.displayName;
        if (!mainName || mainName.trim() === "") {
            mainName = u.email || "Naamloos";
        }
        // Subtekst is altijd UID
        const subText = u.id;

        list.innerHTML += `
            <div class="user-item">
                <div class="user-info">
                    <strong>${mainName}</strong>
                    <small>UID: ${subText}</small>
                </div>
                <button class="btn danger btn-icon-small" onclick="deleteFullUser('${u.id}', '${mainName}')" title="Verwijder Gebruiker">
                    🗑️
                </button>
            </div>
        `;
    });
}

function filterUsers() {
    const term = document.getElementById('userSearchInput').value.toLowerCase();
    const filtered = allUsers.filter(u => {
        const n = (u.username || u.email || "").toLowerCase();
        return n.includes(term) || u.id.includes(term);
    });
    renderUsers(filtered);
}

// --- ACTIES ---
async function deleteFullUser(uid, name) {
    if(!confirm(`⚠️ Verwijder ${name}?\nDit wist Savegames & Chats.`)) return;
    
    try {
        const ref = db.collection("users").doc(uid);
        // Wis subcollecties (mag handmatig in code, of via cloud functions, dit is basic client-side delete)
        const subs = ["favorites", "saveData", "friends", "requests", "sentRequests"];
        for (const s of subs) {
            const snap = await ref.collection(s).get();
            const batch = db.batch();
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();
        }
        await ref.delete();
        
        // Wis chats van deze user
        const chats = await db.collection("chats").where("uid","==",uid).get();
        chats.forEach(d => d.ref.delete());

        notify("Gebruiker data gewist.");
        loadUsers();
    } catch(e) { alert(e.message); }
}

function deleteItem(col, id) {
    if(confirm("Wissen?")) db.collection(col).doc(id).delete();
}

function saveGame() {
    const id = document.getElementById('editId').value;
    if(!id) return notify("Geen ID!");
    
    const cats = [];
    document.querySelectorAll('input[name="gameCategory"]:checked').forEach(c => cats.push(c.value));
    
    db.collection("games").doc(id).set({
        title: document.getElementById('editTitle').value,
        image: document.getElementById('editImg').value,
        link: document.getElementById('editLink').value,
        categories: cats, category: cats[0] || 'all',
        hasSave: document.getElementById('editHasSave').checked,
        hasInfo: document.getElementById('editHasInfo').checked,
        infoText: document.getElementById('editInfoText').value
    }, {merge:true}).then(() => { notify("Opgeslagen"); resetEditor(); });
}

function resetEditor() {
    document.getElementById('editId').value = "";
    document.getElementById('editTitle').value = "";
    document.getElementById('editImg').value = "";
    document.getElementById('editInfoText').value = "";
    document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
    updateImgPreview("");
}

function postUpdate() {
    const t = document.getElementById('updateTitle').value;
    const c = document.getElementById('updateContent').value;
    if(t && c) db.collection("updates").add({
        title:t, content:c, timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
        document.getElementById('updateTitle').value="";
        document.getElementById('updateContent').value="";
        notify("Update geplaatst");
    });
}

async function clearAllChat() {
    if(confirm("Alles wissen?")) {
        const s = await db.collection("chats").get();
        s.forEach(d => d.ref.delete());
        notify("Chat leeg.");
    }
}

function filterGamesTable() {
    const t = document.getElementById('gameSearch').value.toLowerCase();
    document.querySelectorAll('.game-row').forEach(r => {
        r.style.display = r.querySelector('.g-title').innerText.toLowerCase().includes(t) ? '' : 'none';
    });
}
</script>
</body>
</html>
