<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Game Paradise - Ragdoll Archers</title>
  <link rel="icon" type="image/png" href="/icon/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/styyyle.css">
  <script src="game.js" defer></script>
</head>
<body>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  
  <div id="loading-cover">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="logo.jpeg"></div>
      <div class="progress-spinner-container">
        <div class="spinner-left"><img src="spinner.png"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner-right"><img src="spinner.png"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // 1. CONFIGURATIE
    const firebaseConfig = {
      apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
      authDomain: "gameparadise-80490.firebaseapp.com",
      projectId: "gameparadise-80490",
      storageBucket: "gameparadise-80490.firebasestorage.app",
      messagingSenderId: "335620903527",
      appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Forceer HTTP polling om AdBlockers te omzeilen
    db.settings({ experimentalForceLongPolling: true, useFetchStreams: false });

    const DB_NAME = "Ericetto-Ragdoll Archers"; 
    const STORE_NAME = "PlayerPrefs"; 
    const GAME_ID = "ragdoll-archers"; 
    const loaderUrl = "https://cdn.jsdelivr.net/gh/bubbls/ruffle@7117cc5006472d782b65d96abd375597d6273242/v11121212.js";
    const config = {
      dataUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
      frameworkUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
      codeUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Ericetto",
      productName: "Ragdoll Archers",
      productVersion: "0.1",
    };

    let currentUser = null;
    let gameStarted = false;

    // 2. AUTH & START LOGICA
    auth.onAuthStateChanged(async (user) => {
      if (gameStarted) return;
      gameStarted = true;

      if (user) {
        currentUser = user;
        try {
          const doc = await db.collection('users').doc(user.uid).collection('saveData').doc(GAME_ID).get();
          if (doc.exists) {
            await writeToIndexedDB(doc.data().playerPrefs || []);
          }
        } catch (e) { /* Stil falen */ }
      }
      startUnity();
    });

    // Beveiliging: als auth te lang duurt, start de game alsnog
    setTimeout(() => { if(!gameStarted) { gameStarted = true; startUnity(); } }, 3000);

    // 3. OPSLAG FUNCTIES
    async function saveToCloud() {
      if (!currentUser) return;
      try {
        const prefs = await readFromIndexedDB();
        if (prefs.length > 0) {
          await db.collection('users').doc(currentUser.uid).collection('saveData').doc(GAME_ID).set({
            lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
            playerPrefs: prefs
          }, { merge: true });
        }
      } catch (e) { /* Stil falen */ }
    }

    function writeToIndexedDB(items) {
      return new Promise((resolve) => {
        const request = indexedDB.open(DB_NAME, 2);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
        };
        request.onsuccess = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) { db.close(); resolve(); return; }
          const tx = db.transaction([STORE_NAME], "readwrite");
          const store = tx.objectStore(STORE_NAME);
          items.forEach(item => store.put(item.value, item.key));
          tx.oncomplete = () => { db.close(); resolve(); };
        };
        request.onerror = () => resolve();
      });
    }

    function readFromIndexedDB() {
      return new Promise((resolve) => {
        const request = indexedDB.open(DB_NAME);
        request.onsuccess = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) { db.close(); resolve([]); return; }
          const tx = db.transaction([STORE_NAME], "readonly");
          const store = tx.objectStore(STORE_NAME);
          const items = [];
          store.openCursor().onsuccess = (ev) => {
            const cursor = ev.target.result;
            if (cursor) { items.push({ key: cursor.key, value: cursor.value }); cursor.continue(); }
            else { db.close(); resolve(items); }
          };
        };
        request.onerror = () => resolve([]);
      });
    }

    // 4. UNITY LOADER
    function startUnity() {
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then((instance) => {
          loadingCover.style.display = "none";
          setInterval(saveToCloud, 15000); // Elke 15 sec opslaan
        });
      };
      document.body.appendChild(script);
    }

    window.addEventListener("beforeunload", saveToCloud);
  </script>
</body>
</html>
