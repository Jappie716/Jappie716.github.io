<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Game Paradise - Ragdoll Archers</title>
  <link rel="icon" type="image/png" href="/icon/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/styyyle.css">
  
  <script src="game.js" defer></script>
</head>
<body>

  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="logo.jpeg"></div>
      <div class="progress-spinner-container">
        <div class="spinner-left"><img src="spinner.png"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner-right"><img src="spinner.png"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // --- 1. FIREBASE CONFIGURATIE ---
    const firebaseConfig = {
        apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
        authDomain: "gameparadise-80490.firebaseapp.com",
        projectId: "gameparadise-80490",
        storageBucket: "gameparadise-80490.firebasestorage.app",
        messagingSenderId: "335620903527",
        appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // --- 2. GAME INSTELLINGEN ---
    const buildUrl = "Build";
    const loaderUrl = "https://cdn.jsdelivr.net/gh/bubbls/ruffle@7117cc5006472d782b65d96abd375597d6273242/v11121212.js";
    const config = {
      dataUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
      frameworkUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
      codeUrl: "https://cdn.jsdelivr.net/gh/bubbls/ruffle@04dd5345a30d6ebf4b0e2cc385568750cd56ed5a/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Ericetto",
      productName: "Ragdoll Archers",
      productVersion: "0.1",
    };

    // Naamgeving voor IndexedDB (Waar Unity lokaal opslaat)
    const DB_NAME = "Ericetto-Ragdoll Archers"; 
    const STORE_NAME = "PlayerPrefs"; 
    const GAME_ID = "ragdoll-archers"; 

    let currentUser = null;
    let gameStarted = false;

    // --- 3. START LOGICA (AUTO LOGIN) ---
    
    // Check direct of er een user ingelogd is vanuit de homepage
    auth.onAuthStateChanged(async (user) => {
        // Voorkom dubbele start
        if (gameStarted) return;
        gameStarted = true;

        if (user) {
            console.log("Gebruiker herkend:", user.uid);
            currentUser = user;
            // Probeer save data te laden VOORDAT Unity start
            try {
                await loadGameFromFirebase();
            } catch (e) {
                console.error("Kon save niet laden, start nieuw spel", e);
            }
        } else {
            console.log("Geen gebruiker ingelogd, spel start zonder cloud save.");
        }

        // Start het spel (met of zonder save data)
        initUnityGame();
    });

    // --- 4. DATA FUNCTIES ---

    async function loadGameFromFirebase() {
        if (!currentUser) return;
        const docRef = db.collection('users').doc(currentUser.uid).collection('saveData').doc(GAME_ID);
        const doc = await docRef.get();

        if (doc.exists) {
            const data = doc.data();
            // Injecteer data in de browser database
            await writeToIndexedDB(data.playerPrefs || []);
            console.log("Cloud save geladen.");
        }
    }

    async function saveGameToFirebase() {
        if (!currentUser) return;
        
        // Lees de lokale browser database
        const prefs = await readFromIndexedDB();
        if (prefs && prefs.length > 0) {
            await db.collection('users').doc(currentUser.uid).collection('saveData').doc(GAME_ID).set({
                lastUpdated: firebase.firestore.FieldValue.serverTimestamp(),
                playerPrefs: prefs
            }, { merge: true });
            console.log("Voortgang opgeslagen in cloud.");
        }
    }

    // --- 5. UNITY START ---
    function initUnityGame() {
        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          container.className = "unity-mobile";
        }
        
        loadingCover.style.display = "";

        const unityLoader = document.createElement("script");
        unityLoader.src = loaderUrl;
        unityLoader.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarEmpty.style.display = "";
            progressBarFull.style.width = `${100 * progress}%`;
          }).then((unityInstance) => {
            window.unityInstance = unityInstance;
            loadingCover.style.display = "none";
            
            // Start Auto-Save Loop (elke 15 seconden)
            if (currentUser) {
                setInterval(saveGameToFirebase, 15000);
            }
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(unityLoader);

        document.addEventListener("pointerdown", () => {
          container.focus();
          window.focus();
          canvas.focus();
        });
    }

    // Save bij afsluiten
    window.addEventListener("beforeunload", () => {
        saveGameToFirebase();
    });

    // --- 6. INDEXEDDB HELPERS (Browser Opslag) ---
    function writeToIndexedDB(items) {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 2); // Versie 2 forceert update indien nodig
            request.onupgradeneeded = (ev) => {
                const db = ev.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME);
                }
            };
            request.onsuccess = (ev) => {
                const db = ev.target.result;
                const transaction = db.transaction([STORE_NAME], "readwrite");
                const store = transaction.objectStore(STORE_NAME);
                items.forEach(item => store.put(item.value, item.key));
                transaction.oncomplete = () => { db.close(); resolve(); };
                transaction.onerror = (e) => reject(e);
            };
            request.onerror = (e) => reject(e);
        });
    }

    function readFromIndexedDB() {
        return new Promise((resolve) => {
            const request = indexedDB.open(DB_NAME);
            request.onsuccess = (ev) => {
                const db = ev.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) { db.close(); resolve([]); return; }
                const transaction = db.transaction([STORE_NAME], "readonly");
                const store = transaction.objectStore(STORE_NAME);
                const items = [];
                const cursorReq = store.openCursor();
                cursorReq.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) { items.push({ key: cursor.key, value: cursor.value }); cursor.continue(); }
                    else { db.close(); resolve(items); }
                };
            };
            request.onerror = () => resolve([]);
        });
    }
  </script>
</body>
</html>
