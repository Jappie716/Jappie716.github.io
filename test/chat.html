<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Game Paradise - Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg: #020617; --sidebar-bg: #010409; --card-bg: #0f172a;
            --primary: #2563eb; --accent: #60a5fa; --text-dim: #94a3b8;
            --sent: #172554; --received: #1e293b; --danger: #ef4444; --system: #334155;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; height: 100vh; display: flex; overflow: hidden; }

        .container { display: flex; width: 100%; height: 100%; }

        /* Sidebar */
        .sidebar { width: 320px; background: var(--sidebar-bg); border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: var(--card-bg); display: flex; align-items: center; gap: 10px; }
        .sidebar-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        
        .tabs { display: flex; border-bottom: 1px solid #1e293b; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 12px; color: var(--text-dim); }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--primary); background: #1e3a8a22; }

        .list-container { flex: 1; overflow-y: auto; }
        .item { display: flex; align-items: center; padding: 12px; cursor: pointer; border-bottom: 1px solid #0f172a; transition: 0.2s; }
        .item:hover { background: #0f172a; }
        .item.active-chat { background: #1e3a8a !important; }
        .item img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; }
        .unread-dot { width: 10px; height: 10px; background: var(--danger); border-radius: 50%; margin-left: auto; display: none; }
        .unread-dot.show { display: block; }

        /* Chat Area */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #020617; }
        .chat-header { padding: 10px 20px; background: var(--card-bg); display: flex; align-items: center; border-bottom: 1px solid #1e293b; height: 65px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        
        /* Berichten */
        .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; position: relative; }
        .msg.sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 2px; }
        .msg.received { align-self: flex-start; background: var(--received); border-bottom-left-radius: 2px; }
        .msg.system { align-self: center; background: #1e293b88; font-size: 11px; color: #94a3b8; border-radius: 20px; padding: 4px 12px; }
        
        .delete-btn { font-size: 10px; color: var(--danger); cursor: pointer; margin-top: 5px; display: block; text-align: right; opacity: 0.6; transition: 0.2s; }
        .delete-btn:hover { opacity: 1; }

        /* Typen animatie */
        .typing-indicator { font-size: 12px; color: var(--text-dim); padding: 5px 25px; display: none; }
        .dots { display: inline-block; }
        .dots span { animation: blink 1.4s infinite; opacity: 0; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        /* Input */
        .chat-input { padding: 15px; background: var(--card-bg); display: flex; gap: 10px; border-top: 1px solid #1e293b; }
        .chat-input input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #1e293b; background: var(--bg); color: white; outline: none; }
        
        .btn { background: var(--primary); border: none; padding: 10px 18px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }
        .btn-danger { background: var(--danger); }
        .btn-sm { padding: 4px 8px; font-size: 11px; }

        /* Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 350px; border: 1px solid #1e293b; }
        .member-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">
            <img id="myAvatar" src="https://ui-avatars.com/api/?name=User">
            <b id="myName">Laden...</b>
            <button class="btn btn-sm" onclick="document.getElementById('groupModal').style.display='flex'">+ Groep</button>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('chats', this)">Chats</div>
            <div class="tab" onclick="switchTab('discover', this)">Ontdek</div>
        </div>
        <div id="sidebarList" class="list-container"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <h3 id="activeChatName">Selecteer een chat</h3>
            <button id="settingsBtn" class="btn btn-sm" style="margin-left: auto; display: none;" onclick="openSettings()">⚙ Instellingen</button>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div id="typingIndicator" class="typing-indicator">
            <span id="typingText"></span> typt <div class="dots"><span>.</span><span>.</span><span>.</span></div>
        </div>
        <div class="chat-input" id="inputArea" style="display:none">
            <input type="text" id="messageInput" placeholder="Typ een bericht..." oninput="sendTypingStatus()" onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<div id="groupModal" class="modal">
    <div class="modal-box">
        <h3>Nieuwe Groep</h3>
        <input type="text" id="newGroupName" placeholder="Naam van de groep">
        <p style="font-size: 12px; color: gray;">Leden toevoegen kan zodra de groep is gemaakt.</p>
        <button class="btn" style="width: 100%;" onclick="createGroup()">Aanmaken</button>
        <button class="btn" style="width: 100%; background: #334155; margin-top: 5px;" onclick="closeModals()">Annuleren</button>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-box" id="settingsContent"></div>
</div>

<script>
// --- FIREBASE CONFIG ---
const firebaseConfig = {
    apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
    authDomain: "gameparadise-80490.firebaseapp.com",
    projectId: "gameparadise-80490",
    storageBucket: "gameparadise-80490.firebasestorage.app",
    messagingSenderId: "335620903527",
    appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let user = null;
let activeChatId = null;
let chatType = null;
let chatDataMap = new Map();
let msgUnsub = null;
let typingUnsub = null;

auth.onAuthStateChanged(u => {
    if (u) { user = u; initApp(); }
    else { window.location.href = "index.html"; }
});

function initApp() {
    // Vraag notificatie permissie
    if (Notification.permission !== "granted") Notification.requestPermission();

    db.collection("users").doc(user.uid).onSnapshot(d => {
        const data = d.data();
        document.getElementById('myName').innerText = data.name;
        document.getElementById('myAvatar').src = data.pic || `https://ui-avatars.com/api/?name=${data.name}`;
    });

    listenToSidebar();
}

// Live zijbalk updates (Groepen, Chats)
function listenToSidebar() {
    // Luister naar Groepen
    db.collection("groups").where("members", "array-contains", user.uid).onSnapshot(snap => {
        snap.docChanges().forEach(change => {
            const d = change.doc.data();
            chatDataMap.set(change.doc.id, { id: change.doc.id, name: d.name, type: 'group', pic: d.pic });
            renderSidebar();
        });
    });

    // Luister naar Vrienden
    db.collection("users").doc(user.uid).collection("friends").onSnapshot(snap => {
        snap.forEach(doc => {
            const d = doc.data();
            chatDataMap.set(doc.id, { id: doc.id, name: d.name, type: 'private', pic: d.pic });
            renderSidebar();
        });
    });
}

function renderSidebar() {
    const list = document.getElementById('sidebarList');
    list.innerHTML = "";
    chatDataMap.forEach(chat => {
        const item = document.createElement('div');
        item.className = `item ${activeChatId === chat.id ? 'active-chat' : ''}`;
        item.onclick = () => openChat(chat.id, chat.name, chat.type);
        item.innerHTML = `
            <img src="${chat.pic || `https://ui-avatars.com/api/?name=${chat.name}`}">
            <div>
                <b>${chat.name}</b><br>
                <small style="color:gray">${chat.type}</small>
            </div>
            <div class="unread-dot" id="dot-${chat.id}"></div>
        `;
        list.appendChild(item);
    });
}

// Chat Openen
function openChat(id, name, type) {
    activeChatId = id; chatType = type;
    document.getElementById('activeChatName').innerText = name;
    document.getElementById('inputArea').style.display = 'flex';
    document.getElementById('settingsBtn').style.display = type === 'group' ? 'block' : 'none';
    document.getElementById(`dot-${id}`).classList.remove('show');
    
    renderSidebar();
    listenToMessages(id, type);
    listenToTyping(id);
}

function listenToMessages(id, type) {
    if (msgUnsub) msgUnsub();
    let ref = type === 'group' ? db.collection("groups").doc(id).collection("messages") : 
               db.collection("private_chats").doc([user.uid, id].sort().join("_")).collection("messages");

    msgUnsub = ref.orderBy("timestamp", "asc").onSnapshot(snap => {
        const box = document.getElementById('chatMessages');
        box.innerHTML = "";
        snap.forEach(doc => {
            const m = doc.data();
            const isMe = m.uid === user.uid;
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${isMe ? 'sent' : 'received'}`;
            msgDiv.innerHTML = `
                <small style="color:var(--accent); font-weight:bold">${m.user}</small><br>
                ${m.text}
                ${isMe ? `<span class="delete-btn" onclick="deleteMessage('${doc.id}')">🗑 Verwijder</span>` : ''}
            `;
            box.appendChild(msgDiv);

            // Notificatie logica
            if (!isMe && document.hidden) {
                showNotification(m.user, m.text, id, name);
            }
        });
        box.scrollTop = box.scrollHeight;
    });
}

// Typ Status
function sendTypingStatus() {
    if (!activeChatId) return;
    const ref = db.collection("typing").doc(activeChatId);
    ref.set({ [user.uid]: document.getElementById('myName').innerText }, { merge: true });
    
    clearTimeout(window.typeTimer);
    window.typeTimer = setTimeout(() => {
        ref.update({ [user.uid]: firebase.firestore.FieldValue.delete() });
    }, 2000);
}

function listenToTyping(id) {
    if (typingUnsub) typingUnsub();
    typingUnsub = db.collection("typing").doc(id).onSnapshot(doc => {
        const data = doc.data() || {};
        delete data[user.uid];
        const typers = Object.values(data);
        const el = document.getElementById('typingIndicator');
        if (typers.length > 0) {
            document.getElementById('typingText').innerText = typers[0];
            el.style.display = 'block';
        } else { el.style.display = 'none'; }
    });
}

// Bericht Sturen
async function sendMessage() {
    const inp = document.getElementById('messageInput');
    const txt = inp.value.trim();
    if (!txt || !activeChatId) return;

    let ref = chatType === 'group' ? db.collection("groups").doc(activeChatId).collection("messages") : 
               db.collection("private_chats").doc([user.uid, activeChatId].sort().join("_")).collection("messages");

    await ref.add({
        text: txt,
        user: document.getElementById('myName').innerText,
        uid: user.uid,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    inp.value = "";
}

// Bericht Verwijderen
async function deleteMessage(mid) {
    if (!confirm("Bericht voor iedereen verwijderen?")) return;
    let ref = chatType === 'group' ? db.collection("groups").doc(activeChatId).collection("messages") : 
               db.collection("private_chats").doc([user.uid, activeChatId].sort().join("_")).collection("messages");
    await ref.doc(mid).delete();
}

// Groepsinstellingen (Leden beheer)
async function openSettings() {
    const modal = document.getElementById('settingsModal');
    const content = document.getElementById('settingsContent');
    modal.style.display = 'flex';
    
    const gDoc = await db.collection("groups").doc(activeChatId).get();
    const gData = gDoc.data();
    const isAdmin = gData.owner === user.uid;

    let html = `<h3>Groepsinstellingen</h3><div style="max-height: 250px; overflow-y: auto;">`;
    
    for (let mid of gData.members) {
        const uDoc = await db.collection("users").doc(mid).get();
        const uData = uDoc.data();
        html += `
            <div class="member-item">
                <span>${uData.name} ${gData.owner === mid ? '👑' : ''}</span>
                ${isAdmin && mid !== user.uid ? `
                    <div>
                        <button class="btn btn-sm" onclick="makeAdmin('${mid}')">Admin</button>
                        <button class="btn btn-sm btn-danger" onclick="kickMember('${mid}')">✖</button>
                    </div>
                ` : ''}
            </div>`;
    }

    html += `</div>`;
    if (isAdmin) {
        html += `<button class="btn btn-sm" style="width:100%; margin-top:10px;" onclick="addMemberPrompt()">+ Lid Toevoegen</button>`;
    }
    html += `<button class="btn" style="width:100%; margin-top:10px; background:#334155" onclick="closeModals()">Sluiten</button>`;
    content.innerHTML = html;
}

// Groep Functies
async function createGroup() {
    const name = document.getElementById('newGroupName').value.trim();
    if (!name) return;
    await db.collection("groups").add({
        name: name,
        owner: user.uid,
        members: [user.uid],
        pic: ""
    });
    closeModals();
}

async function addMemberPrompt() {
    const mail = prompt("Vul het e-mailadres in van de persoon die je wilt toevoegen:");
    if (!mail) return;
    const snap = await db.collection("users").where("email", "==", mail).get();
    if (snap.empty) return alert("Gebruiker niet gevonden.");
    const newUid = snap.docs[0].id;
    await db.collection("groups").doc(activeChatId).update({
        members: firebase.firestore.FieldValue.arrayUnion(newUid)
    });
    openSettings();
}

async function kickMember(mid) {
    if (!confirm("Lid verwijderen?")) return;
    await db.collection("groups").doc(activeChatId).update({
        members: firebase.firestore.FieldValue.arrayRemove(mid)
    });
    openSettings();
}

async function makeAdmin(mid) {
    if (!confirm("Deze persoon de eigenaar maken? Je verliest je eigen admin rechten.")) return;
    await db.collection("groups").doc(activeChatId).update({ owner: mid });
    openSettings();
}

// Notificaties & Windows Focus
function showNotification(title, body, chatId, name) {
    if (Notification.permission === "granted") {
        const n = new Notification(title, { body: body, icon: "https://i.imgur.com/CeRZ8na.png" });
        n.onclick = () => {
            window.focus();
            openChat(chatId, name, chatType);
            n.close();
        };
    }
}

function closeModals() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
function switchTab(t, el) {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    // Voeg hier eventueel discover logica toe
}
</script>
</body>
</html>
