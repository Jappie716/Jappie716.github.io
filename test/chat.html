<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Game Paradise - Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg: #020617; --sidebar-bg: #010409; --card-bg: #0f172a;
            --primary: #2563eb; --accent: #60a5fa; --text-dim: #94a3b8;
            --sent: #172554; --received: #1e293b; --danger: #ef4444; --system: #334155;
            --online: #22c55e;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); color: white; height: 100vh; 
            display: flex; overflow: hidden; 
        }

        /* --- UI COMPONENTS --- */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; pointer-events: none; }
        .toast { 
            background: var(--card-bg); color: white; padding: 15px 20px; 
            border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); 
            animation: slideIn 0.3s ease; pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .container { display: flex; width: 100%; height: 100%; }

        /* --- SIDEBAR --- */
        .sidebar { width: 320px; background: var(--sidebar-bg); border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: var(--card-bg); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1e293b; }
        .sidebar-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid var(--primary); }
        
        .search-box { padding: 10px; background: var(--sidebar-bg); border-bottom: 1px solid #1e293b; }
        .search-box input { width: 100%; background: #0f172a; border: 1px solid #1e293b; padding: 8px; border-radius: 6px; color: white; font-size: 13px; outline: none; }

        .tabs { display: flex; background: var(--sidebar-bg); border-bottom: 1px solid #1e293b; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 12px; color: var(--text-dim); position: relative; }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--primary); background: #1e3a8a22; font-weight: bold; }
        .tab-dot { position: absolute; top: 8px; right: 10px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; display: none; }

        .list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        
        .item { display: flex; align-items: center; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #0f172a; position: relative; transition: 0.2s; }
        .item:hover { background: #0f172a; }
        .item.active-chat { background: #1e3a8a !important; border-left: 4px solid #60a5fa; }
        .item img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; object-fit: cover; background: #334155; }
        .item-info { flex: 1; overflow: hidden; }
        .item-info h4 { margin: 0; font-size: 14px; color: #e2e8f0; display: flex; justify-content: space-between; }
        .item-info p { margin: 0; font-size: 11px; color: gray; }
        .unread-badge { background: var(--danger); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: auto; display: none; }
        .unread-badge.show { display: block; }
        
        /* Online Status Dot */
        .status-dot { width: 10px; height: 10px; background: gray; border-radius: 50%; border: 2px solid var(--sidebar-bg); position: absolute; bottom: 8px; left: 45px; }
        .status-dot.online { background: var(--online); }

        /* --- MAIN CHAT --- */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at center, #0f172a, #020617); }
        .chat-header { padding: 10px 20px; background: var(--card-bg); display: flex; align-items: center; border-bottom: 1px solid #1e293b; height: 65px; }
        .online-status-text { font-size: 11px; color: var(--text-dim); display: block; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; position: relative; word-wrap: break-word; }
        .msg.sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 2px; }
        .msg.received { align-self: flex-start; background: var(--received); border-bottom-left-radius: 2px; }
        .msg.system { align-self: center; background: #1e293b88; padding: 5px 12px; border-radius: 20px; font-size: 11px; color: #94a3b8; text-align: center; border: 1px solid #334155; margin: 5px 0; max-width: 90%; }
        
        .msg img { max-width: 350px; max-height: 350px; width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; object-fit: cover; }
        .msg .sender { font-size: 10px; color: var(--accent); font-weight: bold; margin-bottom: 2px; display: block; }
        
        /* Message Footer (Checks & Delete) */
        .msg-footer { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 4px; opacity: 0.7; }
        .checks { font-size: 10px; letter-spacing: -2px; }
        .checks.read { color: var(--accent); }
        .delete-btn { font-size: 12px; cursor: pointer; color: var(--danger); opacity: 0; transition: 0.2s; }
        .msg:hover .delete-btn { opacity: 1; }

        .chat-input { padding: 15px; background: var(--card-bg); display: flex; gap: 10px; align-items: center; border-top: 1px solid #1e293b; }
        .chat-input input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #1e293b; background: var(--bg); color: white; outline: none; }
        
        .btn { background: var(--primary); border: none; padding: 10px 18px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; font-size: 13px; }
        .btn:hover { background: #1d4ed8; }
        .btn-danger { background: var(--danger); }
        .btn-sm { padding: 5px 10px; font-size: 11px; }
        .btn-icon { padding: 10px; width: 44px; background: #334155; }
        
        .settings-icon { width: 30px; height: 30px; cursor: pointer; transition: transform 0.2s; }
        .settings-icon:hover { transform: rotate(45deg); }

        /* --- MODALS --- */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-box { background: var(--card-bg); padding: 25px; border-radius: 18px; width: 100%; max-width: 400px; border: 1px solid #1e293b; max-height: 90vh; overflow-y: auto; }
        input[type="text"] { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #1e293b; background: #020617; color: white; }
        .member-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
        .full-btn { width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div id="setupOverlay" style="position:fixed; inset:0; background:var(--bg); z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center;">
    <div class="modal-box" style="text-align:center;">
        <h2>Welkom!</h2>
        <img id="setupPreview" src="https://ui-avatars.com/api/?name=User" style="width:100px; height:100px; border-radius:50%; margin:15px auto; display:block; object-fit:cover;">
        <button class="btn btn-sm" onclick="document.getElementById('setupFile').click()" style="margin:0 auto;">Upload Foto</button>
        <input type="file" id="setupFile" hidden accept="image/*" onchange="previewImage(this, 'setupPreview')">
        <input type="text" id="setupName" placeholder="Je naam...">
        <button class="btn" onclick="completeSetup()" style="width:100%; margin-top:15px;">Start ➤</button>
    </div>
</div>

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">
            <img id="myAvatar" src="" onclick="openProfile()">
            <div style="flex:1; margin-left:10px;"><b id="myName">...</b></div>
            <button class="btn btn-sm" onclick="openGroupModal()">+ Groep</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchBar" placeholder="🔍 Zoeken..." onkeyup="renderSidebar()">
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('chats', this)">Chats</div>
            <div class="tab" onclick="switchTab('discover', this)">Ontdek</div>
            <div class="tab" onclick="switchTab('requests', this)">Verzoeken <div class="tab-dot" id="reqDot"></div></div>
        </div>
        <div id="sidebarList" class="list-container"></div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <img id="activeChatImg" src="" style="width:40px; height:40px; border-radius:50%; margin-right:12px; display:none; object-fit:cover;">
            <div style="flex:1">
                <h3 id="activeChatName" style="margin:0; font-size:16px;">Game Paradise</h3>
                <span id="headerStatus" class="online-status-text"></span>
            </div>
            <img id="settingsBtn" src="https://flaticons.net/icon.php?slug_category=mobile-application&slug_icon=settings-01&icon_size=256&icon_color=FFFFFF&icon_flip=&icon_rotate=100" class="settings-icon" style="display:none;" onclick="openChatSettings()">
        </div>
        <div class="chat-messages" id="chatMessages">
            <div style="text-align:center; color:gray; margin-top:50px;">Selecteer een chat links...</div>
        </div>
        <div class="chat-input" id="inputArea" style="display:none">
            <button class="btn btn-icon" onclick="document.getElementById('imgInp').click()" style="--size: 30px; width: calc(var(--size) + 15px); height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; background: #334155;">
                <img src="https://i.imgur.com/CeRZ8na.png" style="width: var(--size); height: var(--size); object-fit: contain;">
            </button>
            <input type="file" id="imgInp" hidden accept="image/*" onchange="handleImageSend(this)">
            <input type="text" id="messageInput" placeholder="Typ bericht..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">➤ Verstuur</button>
        </div>
    </div>
</div>

<div id="confirmModal" class="modal" style="z-index: 2000;">
    <div class="modal-box" style="text-align:center;">
        <h3 id="confirmTitle">Bevestigen</h3>
        <p id="confirmText" style="color:gray; font-size:14px;"></p>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
            <button class="btn btn-danger" id="confirmYesBtn">Ja, doe het</button>
            <button class="btn" style="background:#334155" onclick="closeModal('confirmModal')">Annuleren</button>
        </div>
    </div>
</div>

<div id="profileModal" class="modal"><div class="modal-box">
    <h3>Profiel</h3>
    <div style="text-align:center"><img id="editPreview" src="" style="width:100px; height:100px; border-radius:50%; object-fit:cover;"></div>
    <button class="btn btn-sm" onclick="document.getElementById('editFile').click()" style="margin:10px auto; display:block;">Wijzig Foto</button>
    <input type="file" id="editFile" hidden accept="image/*" onchange="previewImage(this, 'editPreview')">
    <input type="text" id="editName">
    <button class="btn" onclick="saveProfile()" style="width:100%">Opslaan</button>
    <button class="btn" onclick="closeModal('profileModal')" style="width:100%; background:#334155; margin-top:5px;">Sluiten</button>
</div></div>

<div id="groupModal" class="modal"><div class="modal-box">
    <h3>Nieuwe Groep</h3>
    <div style="text-align:center; margin-bottom:10px;">
        <img id="groupCreatePreview" src="https://ui-avatars.com/api/?name=Group" style="width:80px; height:80px; border-radius:50%; object-fit:cover;">
        <br>
        <button class="btn btn-sm" onclick="document.getElementById('groupCreateFile').click()" style="margin-top:5px;">Kies Groepsfoto</button>
        <input type="file" id="groupCreateFile" hidden accept="image/*" onchange="previewImage(this, 'groupCreatePreview')">
    </div>
    <input type="text" id="groupName" placeholder="Groepsnaam">
    <div id="inviteList" style="max-height:150px; overflow-y:auto; margin:10px 0; border:1px solid #1e293b; padding:10px; border-radius:8px;"></div>
    <button class="btn" onclick="createGroup()" style="width:100%">Aanmaken</button>
    <button class="btn" onclick="closeModal('groupModal')" style="width:100%; background:#334155; margin-top:5px;">Annuleren</button>
</div></div>

<div id="addMemberModal" class="modal"><div class="modal-box">
    <h3>Lid Toevoegen</h3>
    <div id="addMemberList" style="max-height:200px; overflow-y:auto; margin-bottom:15px; border:1px solid #1e293b; border-radius:8px; padding:10px;">Laden...</div>
    <button class="btn" onclick="closeModal('addMemberModal')" style="width:100%; background:#334155;">Sluiten</button>
</div></div>

<div id="settingsModal" class="modal"><div class="modal-box" id="settingsContent"></div></div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
    authDomain: "gameparadise-80490.firebaseapp.com",
    projectId: "gameparadise-80490",
    storageBucket: "gameparadise-80490.firebasestorage.app",
    messagingSenderId: "335620903527",
    appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let user = null;
let activeChatId = null;
let chatType = null;
let currentBase64 = null; 
let chatDataMap = new Map();
let activeListeners = new Set();
let msgUnsub = null;

// --- AUTH & ONLINE STATUS ---
auth.onAuthStateChanged(u => {
    if (u) { 
        user = u; 
        checkSetup(); 
        setOnlineStatus(true);
    } else { location.href = 'index.html'; }
});

// Update status bij sluiten/herladen
window.addEventListener('beforeunload', () => setOnlineStatus(false));
window.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        // Optioneel: zet status op 'afwezig'
    } else {
        setOnlineStatus(true);
    }
});

function setOnlineStatus(isOnline) {
    if(!user) return;
    const status = isOnline ? 'online' : 'offline';
    // Gebruik Beacon voor 'offline' om zeker te zijn dat het verstuurd wordt bij sluiten
    if (!isOnline) {
       // Firestore calls zijn soms traag bij sluiten, maar we proberen het
       db.collection("users").doc(user.uid).update({ status: status, lastSeen: Date.now() });
    } else {
       db.collection("users").doc(user.uid).update({ status: status });
    }
}

async function checkSetup() {
    const doc = await db.collection("users").doc(user.uid).get();
    if (!doc.exists || !doc.data().name) {
        document.getElementById('setupOverlay').style.display = 'flex';
    } else {
        document.getElementById('setupOverlay').style.display = 'none';
        if (Notification.permission !== "granted") Notification.requestPermission();
        initApp();
    }
}

function initApp() {
    db.collection("users").doc(user.uid).onSnapshot(d => {
        const data = d.data();
        document.getElementById('myName').innerText = data.name;
        document.getElementById('myAvatar').src = data.pic || `https://ui-avatars.com/api/?name=${data.name}`;
    });
    
    db.collection("users").doc(user.uid).collection("requests").onSnapshot(snap => {
        document.getElementById('reqDot').style.display = snap.empty ? 'none' : 'block';
        if(!snap.empty) {
            snap.docChanges().forEach(change => {
                if(change.type === 'added') notify("Vriendschapsverzoek", "Nieuw verzoek ontvangen", "", "requests", "request");
            });
        }
    });
    subscribeToChats();
}

// --- CHAT SUBSCRIPTIONS ---
async function subscribeToChats() {
    setupListener('global', 'Algemeen', 'https://i.imgur.com/C9HtyPv.jpeg', 'global', db.collection("chats"));

    db.collection("groups").where("members", "array-contains", user.uid).onSnapshot(snap => {
        snap.docChanges().forEach(change => {
            if (change.type === "added") {
                const d = change.doc.data();
                setupListener(change.doc.id, d.name, d.pic, 'group', db.collection("groups").doc(change.doc.id).collection("messages"));
            } else if (change.type === "removed") {
                // Groep verwijderd fix
                chatDataMap.delete(change.doc.id);
                if(activeChatId === change.doc.id) {
                    document.getElementById('chatMessages').innerHTML = "<div style='text-align:center;margin-top:50px'>Deze groep is verwijderd.</div>";
                    document.getElementById('inputArea').style.display = 'none';
                    activeChatId = null;
                }
                renderSidebar();
            }
        });
    });

    const fSnap = await db.collection("users").doc(user.uid).collection("friends").get();
    fSnap.forEach(doc => {
        const chatId = [user.uid, doc.id].sort().join("_");
        setupListener(doc.id, doc.data().name, doc.data().pic, 'private', db.collection("private_chats").doc(chatId).collection("messages"));
        // Luister naar online status vriend
        db.collection("users").doc(doc.id).onSnapshot(snap => {
            if(chatDataMap.has(doc.id)) {
                chatDataMap.get(doc.id).online = snap.data().status === 'online';
                renderSidebar();
                if(activeChatId === doc.id) updateHeaderStatus(snap.data().status);
            }
        });
    });
}

function updateHeaderStatus(status) {
    const el = document.getElementById('headerStatus');
    el.innerText = status === 'online' ? 'Online' : 'Offline';
    el.style.color = status === 'online' ? '#22c55e' : 'gray';
}

function setupListener(id, name, pic, type, ref) {
    if(activeListeners.has(id)) return;
    activeListeners.add(id);

    if(!chatDataMap.has(id)) chatDataMap.set(id, { id, name, pic, type, timestamp: 0, unread: false, online: false });

    ref.orderBy("timestamp", "desc").limit(1).onSnapshot(snap => {
        if(snap.empty) return;
        const m = snap.docs[0].data();
        const time = m.timestamp ? m.timestamp.toMillis() : Date.now();
        const cData = chatDataMap.get(id);
        cData.timestamp = time;

        // --- SPECIFIEKE MELDINGEN LOGICA ---
        // 1. Is het bericht niet van mij?
        if (m.uid !== user.uid) {
            // 2. Ben ik in deze chat?
            if (activeChatId === id) {
                // 3. Ja, maar is tabblad verborgen? -> WEL Melding
                if (document.hidden) {
                    notify(name, m.text || "📷 Foto", pic, id, type);
                }
                // Als tabblad open is -> GEEN melding (want je ziet het al)
            } else {
                // 4. Ben ik in een ANDERE chat? -> GEEN Melding (zoals gevraagd)
                // "niet op de zelfde chat dat je dan geen dekstop meldingen krijgt"
                cData.unread = true; // Wel rood bolletje in sidebar
            }
        }
        
        chatDataMap.set(id, cData);
        renderSidebar();
    });
}

function renderSidebar() {
    const list = document.getElementById('sidebarList');
    const tab = document.querySelector('.tab.active').innerText.split(' ')[0];
    const term = document.getElementById('searchBar').value.toLowerCase();
    list.innerHTML = "";

    if (tab === 'Chats') {
        let chats = Array.from(chatDataMap.values()).sort((a,b) => {
            if(a.type === 'global') return -1; if(b.type === 'global') return 1;
            return b.timestamp - a.timestamp;
        });

        chats.forEach(c => {
            if(term && !c.name.toLowerCase().includes(term)) return;
            
            const item = document.createElement('div');
            item.className = `item ${activeChatId === c.id ? 'active-chat' : ''}`;
            item.onclick = () => openChat(c.id, c.name, c.pic, c.type);
            item.innerHTML = `
                <div style="position:relative">
                    <img src="${c.pic || `https://ui-avatars.com/api/?name=${c.name}`}">
                    ${c.type === 'private' ? `<div class="status-dot ${c.online?'online':''}"></div>` : ''}
                </div>
                <div class="item-info"><h4>${c.name}</h4><p>${c.type==='private'?'Vriend':c.type==='group'?'Groep':'Community'}</p></div>
                <div class="unread-badge ${c.unread?'show':''}">${c.unread?'!':''}</div>`;
            list.appendChild(item);
        });
    } else if (tab === 'Ontdek') { renderDiscover(list, term); }
    else if (tab === 'Verzoeken') { renderRequests(list); }
}

// --- CHAT OPENEN & READ RECEIPTS ---
async function openChat(id, name, pic, type) {
    activeChatId = id; chatType = type;
    if(chatDataMap.has(id)) chatDataMap.get(id).unread = false;
    
    document.getElementById('activeChatName').innerText = name;
    document.getElementById('activeChatImg').src = pic || `https://ui-avatars.com/api/?name=${name}`;
    document.getElementById('activeChatImg').style.display = "block";
    document.getElementById('inputArea').style.display = "flex";
    document.getElementById('settingsBtn').style.display = type === 'global' ? 'none' : 'block';
    
    // Status update in header
    if(type === 'private') {
         db.collection("users").doc(id).get().then(doc => updateHeaderStatus(doc.data().status));
    } else {
        document.getElementById('headerStatus').innerText = "";
    }
    
    renderSidebar();
    
    if(msgUnsub) msgUnsub();
    let ref;
    if(type === 'global') ref = db.collection("chats");
    else if(type === 'group') ref = db.collection("groups").doc(id).collection("messages");
    else ref = db.collection("private_chats").doc([user.uid, id].sort().join("_")).collection("messages");

    msgUnsub = ref.orderBy("timestamp", "asc").limitToLast(50).onSnapshot(snap => {
        const box = document.getElementById('chatMessages');
        box.innerHTML = "";
        
        snap.forEach(async doc => {
            const m = doc.data();
            const isMe = m.uid === user.uid;
            
            // Mark as Read Logic
            if (!isMe && (!m.readBy || !m.readBy.includes(user.uid))) {
                ref.doc(doc.id).update({ 
                    readBy: firebase.firestore.FieldValue.arrayUnion(user.uid) 
                });
            }

            let content = "";
            if (m.type === 'system') {
                box.innerHTML += `<div class="msg system">${m.text}</div>`;
                return;
            }

            if (m.image) content = `<img src="${m.image}" onclick="window.open(this.src)">`;
            else content = m.text;

            // Checks (Vinkjes)
            let checksHtml = "";
            if(isMe && m.type !== 'system') {
                const isRead = m.readBy && m.readBy.length > 0; // Simpel: als iemand anders het heeft in array
                checksHtml = `<div class="msg-footer">
                    <span class="delete-btn" onclick="deleteMsg('${doc.id}')">🗑</span>
                    <span class="checks ${isRead?'read':''}">${isRead ? '✓✓' : '✓'}</span>
                </div>`;
            }

            box.innerHTML += `
                <div class="msg ${isMe ? 'sent' : 'received'}">
                    <span class="sender">${m.user}</span>
                    ${content}
                    ${checksHtml}
                </div>`;
        });
        box.scrollTop = box.scrollHeight;
    });
}

// --- MESSAGE FUNCTIONS ---
async function deleteMsg(mid) {
    if(!confirm("Bericht verwijderen?")) return;
    let ref;
    if(chatType === 'global') ref = db.collection("chats");
    else if(chatType === 'group') ref = db.collection("groups").doc(activeChatId).collection("messages");
    else ref = db.collection("private_chats").doc([user.uid, activeChatId].sort().join("_")).collection("messages");
    await ref.doc(mid).delete();
}

async function sendMessage() {
    const inp = document.getElementById('messageInput');
    const txt = inp.value.trim();
    if(!txt) return;
    inp.value = "";
    pushMsg({ text: txt });
}

async function handleImageSend(input) {
    if(input.files[0]) {
        const compressed = await resizeAndCompressImage(input.files[0]);
        pushMsg({ image: compressed });
    }
}

async function pushMsg(data) {
    const myName = document.getElementById('myName').innerText;
    const payload = { 
        ...data, 
        user: myName, 
        uid: user.uid, 
        readBy: [], // Array voor vinkjes
        timestamp: firebase.firestore.FieldValue.serverTimestamp() 
    };
    
    if(chatType === 'global') await db.collection("chats").add(payload);
    else if(chatType === 'group') await db.collection("groups").doc(activeChatId).collection("messages").add(payload);
    else await db.collection("private_chats").doc([user.uid, activeChatId].sort().join("_")).collection("messages").add(payload);
}

// --- SETTINGS & GROUPS ---
async function openChatSettings() {
    const modal = document.getElementById('settingsModal');
    const content = document.getElementById('settingsContent');
    modal.style.display = 'flex';
    content.innerHTML = "<h3>Laden...</h3>";

    if (chatType === 'private') {
        content.innerHTML = `<h3>Vriend</h3><button class="btn btn-danger" onclick="confirmAction('Verwijderen', 'Vriend verwijderen?', removeFriend)">Verwijder Vriend</button><button class="btn full-btn" style="background:#334155" onclick="closeModal('settingsModal')">Sluiten</button>`;
    } else if (chatType === 'group') {
        const gDoc = await db.collection("groups").doc(activeChatId).get();
        if(!gDoc.exists) { closeModal('settingsModal'); return; }
        const gData = gDoc.data();
        const isOwner = gData.owner === user.uid;
        
        let html = `<h3>${gData.name}</h3>`;
        if(isOwner) {
            html += `<div style="margin-bottom:10px; border-bottom:1px solid #334155; padding-bottom:10px;">
                <div style="display:flex; gap:10px; align-items:center">
                    <img id="gEditPic" src="${gData.pic}" style="width:40px;height:40px;border-radius:50%">
                    <input type="text" id="gEditName" value="${gData.name}">
                </div>
                <div style="display:flex; gap:5px; margin-top:5px;">
                    <button class="btn btn-sm" onclick="document.getElementById('gFile').click()">Wijzig Foto</button>
                    <input type="file" id="gFile" hidden onchange="previewImage(this, 'gEditPic')">
                    <button class="btn btn-sm" onclick="updateGroupInfo()">Opslaan</button>
                </div>
            </div>`;
        }
        
        html += `<div style="max-height:200px; overflow-y:auto;">`;
        for(let mid of gData.members) {
             const uDoc = await db.collection("users").doc(mid).get();
             const mName = uDoc.exists ? uDoc.data().name : "Unknown";
             html += `<div class="member-row"><span>${mName} ${gData.owner === mid ? '👑' : ''}</span>
             ${isOwner && mid !== user.uid ? `<button class="btn btn-sm btn-danger" onclick="kickMember('${mid}')">Kick</button>` : ''}
             </div>`;
        }
        html += `</div>`;
        
        if(isOwner) {
            html += `<button class="btn full-btn" onclick="openAddMemberModal('${gData.members.join(",")}')">+ Lid Toevoegen</button>`;
            html += `<button class="btn btn-danger full-btn" onclick="confirmAction('Verwijderen', 'Groep verwijderen?', deleteGroup)">Groep Verwijderen</button>`;
        } else {
             html += `<button class="btn btn-danger full-btn" onclick="confirmAction('Verlaten', 'Verlaten?', leaveGroup)">Groep Verlaten</button>`;
        }
        html += `<button class="btn full-btn" style="background:#334155" onclick="closeModal('settingsModal')">Sluiten</button>`;
        content.innerHTML = html;
    }
}

// --- UTILS ---
function notify(title, body, icon, chatId, type) {
    // Desktop Notification Logic: Alleen als tabblad hidden is
    if(Notification.permission === "granted" && document.hidden) {
        const n = new Notification(title, { body, icon: icon || "https://i.imgur.com/CeRZ8na.png" });
        n.onclick = function() { window.focus(); this.close(); if(chatId) openChat(chatId, title, icon, type); };
    }
    // In-app toast altijd tonen voor feedback als niet in die chat
    const box = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<img src="${icon||'https://ui-avatars.com/api/?name=Msg'}" style="width:30px;height:30px;border-radius:50%"><div><b>${title}</b><br><small>${body}</small></div>`;
    t.onclick = () => { t.remove(); if(chatId) openChat(chatId, title, icon, type); };
    box.appendChild(t);
    setTimeout(()=>t.remove(), 4000);
}

// Rest van de functies (compressie, modals, etc) identiek aan vorige versie, maar hier ingekort voor duidelijkheid
async function resizeAndCompressImage(file) { return new Promise((resolve) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = (e) => { const img = new Image(); img.src = e.target.result; img.onload = () => { const c = document.createElement('canvas'); const s = 800/img.width; c.width=800; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); resolve(c.toDataURL('image/jpeg',0.7)); } } }); }
function previewImage(i,id){ if(i.files[0]) resizeAndCompressImage(i.files[0]).then(b=>{document.getElementById(id).src=b; currentBase64=b;}); }
function closeModal(id){ document.getElementById(id).style.display='none'; }
function confirmAction(t,Txt,fn){ document.getElementById('confirmTitle').innerText=t; document.getElementById('confirmText').innerText=Txt; document.getElementById('confirmModal').style.display='flex'; document.getElementById('confirmYesBtn').onclick=()=>{fn();closeModal('confirmModal');} }

// CRUD Actions
async function deleteGroup(){ await db.collection("groups").doc(activeChatId).delete(); location.reload(); }
async function updateGroupInfo(){ await db.collection("groups").doc(activeChatId).update({name:document.getElementById('gEditName').value, pic:document.getElementById('gEditPic').src}); openChatSettings(); }
async function kickMember(mid){ await db.collection("groups").doc(activeChatId).update({members:firebase.firestore.FieldValue.arrayRemove(mid)}); openChatSettings(); }
async function leaveGroup(){ await db.collection("groups").doc(activeChatId).update({members:firebase.firestore.FieldValue.arrayRemove(user.uid)}); location.reload(); }
async function removeFriend(){ await db.collection("users").doc(user.uid).collection("friends").doc(activeChatId).delete(); location.reload(); }
async function completeSetup(){ await db.collection("users").doc(user.uid).set({name:document.getElementById('setupName').value, pic:currentBase64||"", email:user.email}); location.reload(); }
async function saveProfile(){ const u={name:document.getElementById('editName').value}; if(currentBase64) u.pic=currentBase64; await db.collection("users").doc(user.uid).update(u); closeModal('profileModal'); }
async function createGroup(){ const n=document.getElementById('groupName').value; if(!n) return; const m=[user.uid,...Array.from(document.querySelectorAll('.invite-chk:checked')).map(c=>c.value)]; await db.collection("groups").add({name:n,owner:user.uid,members:m,pic:currentBase64||""}); closeModal('groupModal'); }
function openGroupModal(){ currentBase64=null; document.getElementById('groupCreatePreview').src="https://ui-avatars.com/api/?name=Group"; document.getElementById('groupModal').style.display='flex'; const l=document.getElementById('inviteList'); l.innerHTML="Laden..."; db.collection("users").doc(user.uid).collection("friends").get().then(s=>{l.innerHTML="";s.forEach(d=>{l.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:5px"><span>${d.data().name}</span><input type="checkbox" class="invite-chk" value="${d.id}"></div>`})}); }
async function openAddMemberModal(curs){ const cur=curs.split(','); const l=document.getElementById('addMemberList'); document.getElementById('addMemberModal').style.display='flex'; l.innerHTML=""; const s=await db.collection("users").doc(user.uid).collection("friends").get(); s.forEach(d=>{ if(!cur.includes(d.id)) l.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:5px"><span>${d.data().name}</span><button class="btn btn-sm" onclick="addMem('${d.id}')">Add</button></div>`; }); }
async function addMem(id){ await db.collection("groups").doc(activeChatId).update({members:firebase.firestore.FieldValue.arrayUnion(id)}); closeModal('addMemberModal'); openChatSettings(); }
async function renderDiscover(l,t){ const m=(await db.collection("users").doc(user.uid).collection("friends").get()).docs.map(d=>d.id); db.collection("users").limit(20).get().then(s=>{s.forEach(d=>{if(d.id!==user.uid&&!m.includes(d.id)&&(!t||d.data().name.toLowerCase().includes(t)))l.innerHTML+=`<div class="item"><img src="${d.data().pic}"><div class="item-info"><h4>${d.data().name}</h4></div><button class="btn btn-sm" onclick="req('${d.id}','${d.data().name}')">Add</button></div>`})}); }
async function req(id,n){ const me=(await db.collection("users").doc(user.uid).get()).data(); await db.collection("users").doc(id).collection("requests").doc(user.uid).set({name:me.name,pic:me.pic||""}); notify("Verzonden", `Naar ${n}`); }
function renderRequests(l){ db.collection("users").doc(user.uid).collection("requests").get().then(s=>{if(s.empty)l.innerHTML="Geen verzoeken";s.forEach(d=>{l.innerHTML+=`<div class="item"><img src="${d.data().pic}"><div class="item-info"><h4>${d.data().name}</h4></div><button class="btn btn-sm" onclick="acc('${d.id}','${d.data().name}','${d.data().pic}')">Ja</button></div>`})}); }
async function acc(id,n,p){ const me=(await db.collection("users").doc(user.uid).get()).data(); await db.collection("users").doc(user.uid).collection("friends").doc(id).set({name:n,pic:p}); await db.collection("users").doc(id).collection("friends").doc(user.uid).set({name:me.name,pic:me.pic||""}); await db.collection("users").doc(user.uid).collection("requests").doc(id).delete(); location.reload(); }
function switchTab(t,e){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.classList.add('active');renderSidebar();}
function openProfile(){currentBase64=null;document.getElementById('editName').value=document.getElementById('myName').innerText;document.getElementById('editPreview').src=document.getElementById('myAvatar').src;document.getElementById('profileModal').style.display='flex';}
</script>
