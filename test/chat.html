<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Game Paradise - Chat</title>
    <link rel="icon" type="image/png" href="/icon/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg: #020617; --sidebar-bg: #010409; --card-bg: #0f172a;
            --primary: #2563eb; --accent: #60a5fa; --text-dim: #94a3b8;
            --sent: #172554; --received: #1e293b; --danger: #ef4444; --system: #334155;
            --online: #22c55e; --offline: #64748b;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 300px; background: var(--sidebar-bg); border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header img { width: 45px; height: 45px; border-radius: 50%; cursor: pointer; object-fit: cover; border: 2px solid var(--primary); }
        .chat-list { flex: 1; overflow-y: auto; }
        
        .chat-item { display: flex; align-items: center; padding: 12px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #1e293b; position: relative; }
        .chat-item:hover, .chat-item.active { background: #1e293b; border-left: 4px solid var(--accent); }
        .chat-item img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; object-fit: cover; background: #334155; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; font-size: 14px; }
        .chat-preview { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge { background: var(--danger); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 5px; }

        /* STATUS DOTS */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--offline); display: inline-block; margin-right: 5px; border: 2px solid var(--sidebar-bg); }
        .status-dot.online { background: var(--online); box-shadow: 0 0 5px var(--online); }

        /* MAIN CHAT AREA */
        .main { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at center, #0f172a, #020617); }
        .chat-header { padding: 15px; background: var(--card-bg); border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .header-info { display: flex; align-items: center; }
        .header-info img { width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 75%; padding: 10px 15px; border-radius: 12px; position: relative; word-wrap: break-word; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; }
        .msg.sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 2px; }
        .msg.received { align-self: flex-start; background: var(--received); border-bottom-left-radius: 2px; }
        .msg.system { align-self: center; background: var(--system); font-size: 11px; padding: 5px 15px; border-radius: 20px; color: #cbd5e1; text-align: center; }
        
        .sender { font-size: 10px; color: var(--accent); display: block; margin-bottom: 2px; font-weight: bold; }
        .timestamp { font-size: 9px; color: var(--text-dim); align-self: flex-end; margin-top: 4px; display: flex; align-items: center; gap: 5px; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; transition: 0.2s; max-height: 300px; object-fit: cover; }
        .msg img:hover { opacity: 0.9; }

        /* Actions (Edit/Delete) */
        .msg-actions { display: none; position: absolute; top: -10px; right: -5px; background: var(--card-bg); border: 1px solid #334155; border-radius: 10px; padding: 2px; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .msg.sent:hover .msg-actions { display: flex; }
        .action-btn { font-size: 12px; padding: 4px 8px; cursor: pointer; color: var(--text-dim); transition: 0.2s; }
        .action-btn:hover { color: white; }
        .action-btn.del:hover { color: var(--danger); }

        /* INPUT AREA */
        .input-area { padding: 15px; background: var(--card-bg); border-top: 1px solid #1e293b; display: flex; gap: 10px; align-items: flex-end; }
        .input-area textarea { flex: 1; background: #020617; border: 1px solid #1e293b; color: white; padding: 12px; border-radius: 12px; resize: none; outline: none; height: 44px; max-height: 120px; font-family: inherit; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-icon { padding: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #334155; }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
        .btn-danger { background: var(--danger); }

        /* MODALS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-box { background: #0f172a; padding: 25px; border-radius: 15px; width: 400px; max-width: 90%; border: 1px solid #1e293b; text-align: center; max-height: 90vh; overflow-y: auto; }
        .modal-box input { width: 100%; padding: 10px; margin: 10px 0; background: #020617; border: 1px solid #334155; color: white; border-radius: 8px; }
        .full-btn { width: 100%; margin-top: 10px; }

        /* Tabs */
        .tabs { display: flex; background: var(--sidebar-bg); border-bottom: 1px solid #1e293b; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 12px; color: var(--text-dim); position: relative; }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--primary); background: #1e3a8a22; font-weight: bold; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary); animation: slideIn 0.3s; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div id="imageModal" class="modal" style="z-index: 5000;" onclick="if(event.target===this) closeModal('imageModal')">
    <div style="position:relative; max-width:90%; max-height:90vh; text-align:center;">
        <img id="imgViewer" style="max-width:100%; max-height:80vh; border-radius:8px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
        <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
            <a id="imgDownload" href="#" download="afbeelding.jpg" class="btn">💾 Downloaden</a>
            <button class="btn btn-danger" onclick="closeModal('imageModal')">Sluiten</button>
        </div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-box">
        <h3>Bericht Bewerken</h3>
        <input type="text" id="editInput">
        <div style="display:flex; gap:10px;">
            <button class="btn" style="flex:1" onclick="saveEdit()">Opslaan</button>
            <button class="btn btn-danger" style="flex:1" onclick="closeModal('editModal')">Annuleren</button>
        </div>
    </div>
</div>

<div id="deleteModal" class="modal">
    <div class="modal-box">
        <h3>Bericht Verwijderen</h3>
        <p>Weet je het zeker? Dit kan niet ongedaan worden gemaakt.</p>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-danger" style="flex:1" onclick="confirmDelete()">Verwijderen</button>
            <button class="btn" style="background:#334155; flex:1" onclick="closeModal('deleteModal')">Annuleren</button>
        </div>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">
        <img id="myAvatar" src="" onclick="location.href='index.html'">
        <div style="flex:1; margin-left:10px; display:flex; flex-direction:column;">
            <b id="myName">Laden...</b>
            <div id="myStatusToggle" onclick="toggleMyStatus()" style="font-size:11px; color:gray; cursor:pointer; display:flex; align-items:center; gap:5px; margin-top:2px;">
                <div id="myStatusDot" class="status-dot online" style="position:relative; margin:0;"></div>
                <span id="myStatusText">Online</span>
            </div>
        </div>
        <button class="btn btn-sm" onclick="openGroupModal()">+ Groep</button>
    </div>
    
    <div style="padding:10px;">
        <input id="searchBar" type="text" placeholder="🔍 Zoeken..." onkeyup="renderSidebar()" style="width:100%; background:#0f172a; border:1px solid #1e293b; padding:8px; border-radius:8px; color:white;">
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('chats', this)">Chats</div>
        <div class="tab" onclick="switchTab('requests', this)">Verzoeken</div>
    </div>

    <div id="chatList" class="chat-list"></div>
    
    <div style="padding:10px; border-top:1px solid #1e293b; text-align:center;">
        <button class="btn btn-sm" style="background:#334155; width:100%" onclick="location.href='index.html'">🏠 Terug naar Home</button>
    </div>
</div>

<div class="main">
    <div class="chat-header">
        <div class="header-info">
            <img id="activeChatImg" src="" style="display:none">
            <div>
                <div id="activeChatName" style="font-weight:bold; font-size:16px;">Selecteer een chat</div>
                <div id="activeStatus" style="font-size:12px; color:var(--text-dim); display:none;"></div>
            </div>
        </div>
        <button id="settingsBtn" class="btn btn-sm btn-icon" style="display:none" onclick="openChatSettings()">⚙️</button>
    </div>

    <div id="chatMessages" class="messages">
        <div style="text-align:center; color:gray; margin-top:50px;">
            👋 Welkom bij Game Paradise Chat!<br>Selecteer een chat links om te beginnen.
        </div>
    </div>
    
    <div id="typingIndicator" style="display:none; padding: 0 20px; font-size: 11px; color: var(--accent); font-style: italic;">...</div>

    <div id="inputArea" class="input-area" style="display:none">
        <button class="btn btn-icon" onclick="document.getElementById('fileInput').click()" style="background:#334155;">📷</button>
        <input type="file" id="fileInput" accept="image/*" hidden onchange="handleFileUpload(this)">
        <textarea id="messageInput" placeholder="Typ een bericht..." oninput="handleTyping()" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}"></textarea>
        <button class="btn btn-icon" onclick="sendMessage()">➤</button>
    </div>
</div>

<div id="groupModal" class="modal">
    <div class="modal-box">
        <h2>Nieuwe Groep</h2>
        <div style="text-align:center; margin-bottom:10px;">
            <img id="groupCreatePreview" src="https://ui-avatars.com/api/?name=Group" style="width:80px; height:80px; border-radius:50%; object-fit:cover;">
            <br>
            <button class="btn btn-sm" onclick="document.getElementById('groupCreateFile').click()" style="margin-top:5px;">Kies Groepsfoto</button>
            <input type="file" id="groupCreateFile" hidden accept="image/*" onchange="previewImage(this, 'groupCreatePreview')">
        </div>
        <input id="newGroupName" placeholder="Groepsnaam">
        <button class="btn full-btn" onclick="createGroup()">Aanmaken</button>
        <button class="btn full-btn" style="background:transparent; color:gray;" onclick="closeModal('groupModal')">Annuleren</button>
    </div>
</div>

<div id="groupSettingsModal" class="modal">
    <div class="modal-box">
        <div id="settingsContent">
            </div>
        <button onclick="closeModal('groupSettingsModal')" style="background:transparent; color:gray; margin-top:10px; border:none; cursor:pointer;">Sluiten</button>
    </div>
</div>

<script>
// FIREBASE CONFIG
const firebaseConfig = {
    apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
    authDomain: "gameparadise-80490.firebaseapp.com",
    projectId: "gameparadise-80490",
    storageBucket: "gameparadise-80490.firebasestorage.app",
    messagingSenderId: "335620903527",
    appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let user = null;
let activeChatId = null;
let chatType = null; // 'global', 'group', 'private'
let msgUnsub = null;
let typingUnsub = null;
let chatDataMap = new Map();
let requestsMap = new Map();
let sentRequestsMap = new Map();
let typingTimeout = null;
let isOfflineMode = false;
let activeTab = 'chats';
let currentBase64 = null;
let editMsgId = null;
let delMsgId = null;

// INIT
auth.onAuthStateChanged(u => {
    if (!u) location.href = 'index.html';
    user = u;
    loadUserData();
    subscribeToChats();
    subscribeToRequests();
    startPresenceSystem();
});

function loadUserData() {
    db.collection("users").doc(user.uid).get().then(doc => {
        if(doc.exists) {
            const data = doc.data();
            document.getElementById('myName').innerText = data.name;
            document.getElementById('myAvatar').src = data.pic || `https://ui-avatars.com/api/?name=${data.name}`;
        }
    });
}

// --- STATUS SYSTEEM (FEATURE 6) ---
function startPresenceSystem() {
    if(!isOfflineMode) updatePresence('online');
    setInterval(() => { if(!isOfflineMode) updatePresence('online'); }, 60000);
    window.addEventListener('beforeunload', () => {
        updatePresence('offline');
        if(activeChatId) updateTyping(false);
    });
}

function updatePresence(status) {
    if(user) {
        db.collection("users").doc(user.uid).update({
            status: status, 
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
}

function toggleMyStatus() {
    isOfflineMode = !isOfflineMode;
    const dot = document.getElementById('myStatusDot');
    const txt = document.getElementById('myStatusText');
    
    if(isOfflineMode) {
        dot.className = "status-dot";
        txt.innerText = "Offline (Verborgen)";
        txt.style.color = "gray";
        updatePresence('offline');
    } else {
        dot.className = "status-dot online";
        txt.innerText = "Online";
        txt.style.color = "white";
        updatePresence('online');
    }
}

// --- DATA LADEN ---
function subscribeToChats() {
    // 1. Global
    setupListener('global', 'Algemeen', 'https://i.imgur.com/C9HtyPv.jpeg', 'global', db.collection("chats"));

    // 2. Groepen
    db.collection("groups").where("members", "array-contains", user.uid).onSnapshot(snap => {
        snap.docChanges().forEach(change => {
            if (change.type === "added") {
                const d = change.doc.data();
                setupListener(change.doc.id, d.name, d.pic, 'group', db.collection("groups").doc(change.doc.id).collection("messages"));
            } else if (change.type === "removed") {
                chatDataMap.delete(change.doc.id);
                renderSidebar();
            }
        });
    });

    // 3. Vrienden
    db.collection("users").doc(user.uid).collection("friends").onSnapshot(snap => {
        snap.forEach(doc => {
            const chatId = [user.uid, doc.id].sort().join("_");
            setupListener(doc.id, doc.data().name, doc.data().pic, 'private', db.collection("private_chats").doc(chatId).collection("messages"));
            
            // Check online status
            db.collection("users").doc(doc.id).onSnapshot(s => {
                const d = s.data();
                const isOnline = d && d.status === 'online';
                if(chatDataMap.has(doc.id)) {
                    const c = chatDataMap.get(doc.id);
                    c.online = isOnline;
                    c.pic = d.pic || c.pic;
                    chatDataMap.set(doc.id, c);
                    renderSidebar();
                    
                    if(activeChatId === doc.id) {
                        const el = document.getElementById('activeStatus');
                        el.innerText = isOnline ? 'Online' : 'Offline';
                        el.style.color = isOnline ? 'var(--online)' : 'gray';
                    }
                }
            });
        });
    });
}

function subscribeToRequests() {
    // Ontvangen
    db.collection("users").doc(user.uid).collection("requests").onSnapshot(snap => {
        requestsMap.clear();
        snap.forEach(doc => requestsMap.set(doc.id, doc.data()));
        renderSidebar();
    });
    // Verzonden (FEATURE 5)
    db.collection("users").doc(user.uid).collection("sent_requests").onSnapshot(snap => {
        sentRequestsMap.clear();
        snap.forEach(doc => sentRequestsMap.set(doc.id, doc.data()));
        renderSidebar();
    });
}

function setupListener(id, name, pic, type, ref) {
    if(!chatDataMap.has(id)) chatDataMap.set(id, { id, name, pic, type, timestamp: 0, unread: false, online: false });

    ref.orderBy("timestamp", "desc").limit(1).onSnapshot(snap => {
        if(snap.empty) return;
        const m = snap.docs[0].data();
        const time = m.timestamp ? m.timestamp.toMillis() : Date.now();
        const cData = chatDataMap.get(id);
        
        cData.timestamp = time;
        cData.lastMsg = m.image ? '📷 Foto' : m.text;
        
        // FEATURE 7: Unread badge logic
        if (m.uid !== user.uid && activeChatId !== id) {
            cData.unread = true;
            playNotificationSound();
        } else if (activeChatId === id) {
            cData.unread = false; // Direct resetten als chat open is
        }

        chatDataMap.set(id, cData);
        renderSidebar();
    });
}

function renderSidebar() {
    const list = document.getElementById('chatList');
    list.innerHTML = "";
    const term = document.getElementById('searchBar').value.toLowerCase();

    if(activeTab === 'chats') {
        const chats = Array.from(chatDataMap.values()).sort((a,b) => b.timestamp - a.timestamp);
        chats.forEach(c => {
            if(term && !c.name.toLowerCase().includes(term)) return;
            const div = document.createElement('div');
            div.className = `chat-item ${activeChatId === c.id ? 'active' : ''}`;
            
            let statusHtml = '';
            if(c.type === 'private') {
                statusHtml = `<div class="status-dot ${c.online ? 'online' : ''}" style="width:8px; height:8px; border:none; margin-right:0;"></div>`;
            }

            div.innerHTML = `
                <img src="${c.pic || `https://ui-avatars.com/api/?name=${c.name}`}">
                <div class="chat-info">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="chat-name">${c.name}</span>
                        ${statusHtml}
                    </div>
                    <div class="chat-preview" style="${c.unread ? 'font-weight:bold; color:white' : ''}">
                        ${c.unread ? '🔵 ' : ''}${c.lastMsg || 'Start een gesprek'}
                    </div>
                </div>
                ${c.unread ? `<div class="unread-badge">1</div>` : ''}
            `;
            div.onclick = () => openChat(c.id, c.name, c.pic, c.type);
            list.appendChild(div);
        });
    } else {
        // REQUESTS TAB (FEATURE 5)
        if(requestsMap.size === 0 && sentRequestsMap.size === 0) {
            list.innerHTML = "<div style='padding:20px; text-align:center; color:gray'>Geen verzoeken</div>";
            // Laat zoekresultaten zien om mensen toe te voegen
            if(term) searchUsers(term);
        } else {
            // Ontvangen
            requestsMap.forEach((d, id) => {
                list.innerHTML += `
                <div class="chat-item">
                    <img src="${d.pic}">
                    <div class="chat-info">
                        <span class="chat-name">${d.name}</span>
                        <div style="color:#22c55e; font-size:11px;">Ontvangen verzoek</div>
                    </div>
                    <button class="btn btn-sm" onclick="acceptFriend('${id}', '${d.name}', '${d.pic}')">✅</button>
                    <button class="btn btn-sm btn-danger" style="margin-left:5px" onclick="declineRequest('${id}')">❌</button>
                </div>`;
            });
            // Verzonden
            sentRequestsMap.forEach((d, id) => {
                list.innerHTML += `
                <div class="chat-item" style="opacity:0.7">
                    <img src="${d.pic}">
                    <div class="chat-info">
                        <span class="chat-name">${d.name}</span>
                        <div style="color:var(--text-dim); font-size:11px;">🕒 In afwachting...</div>
                    </div>
                </div>`;
            });
        }
    }
}

function searchUsers(term) {
    // Simpele search simulatie (in echt firestore moet je queries doen)
    db.collection("users").get().then(snap => {
        const list = document.getElementById('chatList');
        snap.forEach(doc => {
            const d = doc.data();
            if(d.name.toLowerCase().includes(term) && doc.id !== user.uid && !chatDataMap.has(doc.id)) {
                list.innerHTML += `
                <div class="chat-item">
                    <img src="${d.pic}">
                    <div class="chat-info"><span class="chat-name">${d.name}</span></div>
                    <button class="btn btn-sm" onclick="sendFriendRequest('${doc.id}', '${d.name}', '${d.pic}')">➕</button>
                </div>`;
            }
        });
    });
}

function switchTab(t, el) {
    activeTab = t;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    renderSidebar();
}

// --- OPEN CHAT ---
async function openChat(id, name, pic, type) {
    activeChatId = id; 
    chatType = type;
    
    // FEATURE 7: Direct unread weghalen
    if(chatDataMap.has(id)) {
        const c = chatDataMap.get(id);
        c.unread = false;
        chatDataMap.set(id, c);
    }
    renderSidebar();

    document.getElementById('activeChatName').innerText = name;
    document.getElementById('activeChatImg').src = pic || `https://ui-avatars.com/api/?name=${name}`;
    document.getElementById('activeChatImg').style.display = "block";
    document.getElementById('inputArea').style.display = "flex";
    
    const settingsBtn = document.getElementById('settingsBtn');
    settingsBtn.style.display = (type === 'group') ? 'block' : 'none';
    
    const statusEl = document.getElementById('activeStatus');
    if(type === 'private' && chatDataMap.has(id)) {
        const isOnline = chatDataMap.get(id).online;
        statusEl.style.display = 'block';
        statusEl.innerText = isOnline ? 'Online' : 'Offline';
        statusEl.style.color = isOnline ? 'var(--online)' : 'gray';
    } else {
        statusEl.style.display = 'none';
    }

    document.getElementById('messageInput').value = "";
    document.getElementById('chatMessages').innerHTML = '<div style="text-align:center; margin-top:20px;">Berichten laden...</div>';

    if(msgUnsub) msgUnsub();
    if(typingUnsub) typingUnsub();

    loadMessages();
    setupTypingListener();
}

function getChatRef() {
    if(chatType === 'global') return db.collection("chats");
    if(chatType === 'group') return db.collection("groups").doc(activeChatId).collection("messages");
    if(chatType === 'private') return db.collection("private_chats").doc([user.uid, activeChatId].sort().join("_")).collection("messages");
}

function getMetaRef() {
    // FEATURE 1: Correcte refs voor typen in alle chats
    if(chatType === 'global') return db.collection("metadata").doc("global");
    if(chatType === 'group') return db.collection("groups").doc(activeChatId);
    if(chatType === 'private') return db.collection("private_chats").doc([user.uid, activeChatId].sort().join("_"));
}

function loadMessages() {
    const ref = getChatRef();
    msgUnsub = ref.orderBy("timestamp", "asc").limitToLast(50).onSnapshot(snap => {
        const container = document.getElementById('chatMessages');
        container.innerHTML = "";
        snap.forEach(doc => renderMessage(doc.id, doc.data(), container));
        container.scrollTop = container.scrollHeight;
    });
}

function renderMessage(id, msg, container) {
    const div = document.createElement('div');
    const isMe = msg.uid === user.uid;
    
    div.className = `msg ${msg.type === 'system' ? 'system' : (isMe ? 'sent' : 'received')}`;
    
    let content = "";
    if(msg.image) {
        // FEATURE 2: Image Viewer
        content = `<img src="${msg.image}" onclick="openImage('${msg.image}')">`;
    } else {
        content = msg.text;
    }

    if(msg.type === 'system') {
        div.innerHTML = content;
    } else {
        // FEATURE 4: Edit/Delete knoppen voor eigen berichten
        let actions = "";
        if(isMe) {
            actions = `
            <div class="msg-actions">
                <span class="action-btn" onclick="openEditModal('${id}', '${msg.text}')">✎</span>
                <span class="action-btn del" onclick="openDeleteModal('${id}')">✖</span>
            </div>`;
        }

        div.innerHTML = `
            ${actions}
            ${!isMe && chatType !== 'private' ? `<span class="sender">${msg.user}</span>` : ''}
            ${content}
            ${msg.edited ? '<span style="font-size:9px; color:gray; font-style:italic;"> (bewerkt)</span>' : ''}
            <span class="timestamp">${msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...'}</span>
        `;
    }
    container.appendChild(div);
}

// --- ACTIES (VERSTUREN, BEWERKEN, VERWIJDEREN) ---
async function sendMessage(imageUrl = null) {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if(!text && !imageUrl) return;

    const msg = {
        text: text,
        image: imageUrl || null,
        uid: user.uid,
        user: document.getElementById('myName').innerText,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        type: 'text',
        edited: false
    };

    input.value = "";
    updateTyping(false);
    await getChatRef().add(msg);
}

// FEATURE 4: Edit & Delete Logic
function openEditModal(id, text) {
    editMsgId = id;
    document.getElementById('editInput').value = text;
    document.getElementById('editModal').style.display = 'flex';
}
async function saveEdit() {
    const newText = document.getElementById('editInput').value;
    if(newText && editMsgId) {
        await getChatRef().doc(editMsgId).update({ text: newText, edited: true });
        closeModal('editModal');
    }
}
function openDeleteModal(id) {
    delMsgId = id;
    document.getElementById('deleteModal').style.display = 'flex';
}
async function confirmDelete() {
    if(delMsgId) {
        await getChatRef().doc(delMsgId).delete();
        closeModal('deleteModal');
    }
}

// --- TYPEN INDICATOR (FEATURE 1) ---
async function setupTypingListener() {
    const ref = getMetaRef();
    typingUnsub = ref.onSnapshot(doc => {
        const indic = document.getElementById('typingIndicator');
        if(doc.exists && doc.data().typingStatus) {
            const typers = Object.entries(doc.data().typingStatus)
                .filter(([uid, name]) => uid !== user.uid)
                .map(([uid, name]) => name);
            
            if(typers.length > 0) {
                indic.style.display = 'block';
                indic.innerText = `${typers.join(", ")} is aan het typen...`;
            } else { indic.style.display = 'none'; }
        } else { indic.style.display = 'none'; }
    });
}

async function handleTyping() {
    if(typingTimeout) clearTimeout(typingTimeout);
    updateTyping(true);
    typingTimeout = setTimeout(() => updateTyping(false), 2000);
}

async function updateTyping(isTyping) {
    if(!activeChatId) return;
    const ref = getMetaRef();
    const myName = document.getElementById('myName').innerText;
    const fieldPath = "typingStatus." + user.uid;

    if(isTyping) {
        const update = {}; update[fieldPath] = myName;
        // Merge true zorgt dat het document wordt aangemaakt als het niet bestaat (cruciaal voor prive)
        await ref.set(update, { merge: true });
    } else {
        const update = {}; update[fieldPath] = firebase.firestore.FieldValue.delete();
        await ref.update(update).catch(e => {}); 
    }
}

// --- SETTINGS (FEATURE 3: NESTED MENU) ---
async function openChatSettings() {
    const modal = document.getElementById('groupSettingsModal');
    const content = document.getElementById('settingsContent');
    modal.style.display = 'flex';
    
    const groupDoc = await db.collection("groups").doc(activeChatId).get();
    const g = groupDoc.data();
    const isAdmin = g.owner === user.uid || (g.admins && g.admins.includes(user.uid));

    let membersHtml = '';
    for(const mid of g.members) {
        membersHtml += `<div style="padding:5px 0;">👤 ${mid === user.uid ? 'Jij' : 'Lid'}</div>`; 
    }

    content.innerHTML = `
        <h2 style="color:var(--accent)">${g.name}</h2>
        <div style="margin:20px 0; text-align:left; max-height:200px; overflow-y:auto; border:1px solid #334155; padding:10px; border-radius:8px;">
            <div style="color:gray; font-size:12px; margin-bottom:5px;">Leden (${g.members.length})</div>
            ${membersHtml}
        </div>
        ${isAdmin ? `
            <button class="btn full-btn" onclick="openAddMemberMenu('${g.members.join(",")}')">➕ Leden Toevoegen</button>
            <button class="btn full-btn btn-danger" onclick="deleteGroup()">Verwijder Groep</button>
        ` : `<button class="btn full-btn btn-danger" onclick="leaveGroup()">Groep Verlaten</button>`}
    `;
}

async function openAddMemberMenu(currentMembersStr) {
    const currentMembers = currentMembersStr.split(",");
    const content = document.getElementById('settingsContent');
    content.innerHTML = `<h3>Vrienden Uitnodigen</h3><div id="inviteList">Laden...</div>`;
    
    const friendsSnap = await db.collection("users").doc(user.uid).collection("friends").get();
    let html = `<div style="max-height:250px; overflow-y:auto; margin:15px 0; text-align:left; border:1px solid #334155; padding:10px; border-radius:8px;">`;
    
    let count = 0;
    friendsSnap.forEach(doc => {
        if(!currentMembers.includes(doc.id)) {
            count++;
            html += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #1e293b;">
                    <span>${doc.data().name}</span>
                    <button class="btn btn-sm" onclick="addMemberToGroup('${doc.id}', '${doc.data().name}')">Toevoegen</button>
                </div>`;
        }
    });

    if(count === 0) html += `<div style="text-align:center; color:gray;">Geen vrienden om toe te voegen.</div>`;
    html += `</div>`;
    html += `<button class="btn full-btn" style="background:#334155" onclick="openChatSettings()">⬅ Terug naar Instellingen</button>`;
    content.innerHTML = html;
}

async function addMemberToGroup(uid, name) {
    await db.collection("groups").doc(activeChatId).update({
        members: firebase.firestore.FieldValue.arrayUnion(uid)
    });
    await db.collection("groups").doc(activeChatId).collection("messages").add({
        text: `${document.getElementById('myName').innerText} heeft ${name} toegevoegd.`,
        type: 'system',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    notify("Succes", `${name} is toegevoegd!`);
    openChatSettings();
}

// --- UTILS & FRIEND REQUESTS ---
async function sendFriendRequest(id, name, pic) {
    const me = (await db.collection("users").doc(user.uid).get()).data();
    // 1. Stuur naar ontvanger
    await db.collection("users").doc(id).collection("requests").doc(user.uid).set({ name: me.name, pic: me.pic || "" });
    // 2. Sla op bij mezelf (FEATURE 5)
    await db.collection("users").doc(user.uid).collection("sent_requests").doc(id).set({ name: name, pic: pic || "" });
    
    notify("Verzonden", `Verzoek naar ${name}`);
}

async function acceptFriend(id, name, pic) {
    const me = (await db.collection("users").doc(user.uid).get()).data();
    await db.collection("users").doc(user.uid).collection("friends").doc(id).set({ name, pic });
    await db.collection("users").doc(id).collection("friends").doc(user.uid).set({ name: me.name, pic: me.pic || "" });
    await db.collection("users").doc(user.uid).collection("requests").doc(id).delete();
    // Verwijder ook uit sent_requests bij de ander (optioneel, maar netjes)
    db.collection("users").doc(id).collection("sent_requests").doc(user.uid).delete();
    notify("Vrienden", `Je bent nu vrienden met ${name}`);
}

async function declineRequest(id) {
    await db.collection("users").doc(user.uid).collection("requests").doc(id).delete();
}

function handleFileUpload(input) {
    const file = input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => sendMessage(e.target.result); 
}

function previewImage(inp, id) {
    if(inp.files[0]) {
        const reader = new FileReader();
        reader.readAsDataURL(inp.files[0]);
        reader.onload = (e) => {
            document.getElementById(id).src = e.target.result;
            currentBase64 = e.target.result;
        }
    }
}

function createGroup() {
    const name = document.getElementById('newGroupName').value;
    if(!name) return;
    db.collection("groups").add({
        name: name, owner: user.uid, members: [user.uid], pic: currentBase64 || "",
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => { closeModal('groupModal'); notify("Groep aangemaakt!"); });
}

function openGroupModal() { 
    currentBase64 = null;
    document.getElementById('groupCreatePreview').src = "https://ui-avatars.com/api/?name=Group";
    document.getElementById('groupModal').style.display = 'flex'; 
}
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// FEATURE 2: Image Modal Logic
function openImage(src) {
    document.getElementById('imgViewer').src = src;
    document.getElementById('imgDownload').href = src;
    document.getElementById('imageModal').style.display = 'flex';
}

function notify(title, msg) {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'toast'; t.innerHTML = `<b>${title}</b><br>${msg}`;
    c.appendChild(t); setTimeout(() => t.remove(), 3000);
}
function playNotificationSound() {
    const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    audio.play().catch(e => {});
}

document.addEventListener('keydown', (e) => { if(e.key==="Escape") document.querySelectorAll('.modal').forEach(m => m.style.display='none'); });
</script>
