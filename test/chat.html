<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Game Paradise - Chat</title>
    <link rel="icon" type="image/png" href="/icon/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg: #020617; --sidebar-bg: #010409; --card-bg: #0f172a;
            --primary: #2563eb; --accent: #60a5fa; --text-dim: #94a3b8;
            --sent: #172554; --received: #1e293b; --danger: #ef4444; --system: #334155;
            --online: #22c55e; --offline: #64748b;
        }

        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
        .sidebar-header img { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; object-fit: cover; }
        .chat-list { flex: 1; overflow-y: auto; }
        
        .chat-item { display: flex; align-items: center; padding: 12px; cursor: pointer; transition: 0.2s; border-bottom: 1px solid #1e293b; }
        .chat-item:hover, .chat-item.active { background: #1e293b; }
        .chat-item img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; object-fit: cover; }
        .chat-info { flex: 1; min-width: 0; }
        .chat-name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        .chat-preview { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge { background: var(--danger); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: 5px; }

        /* STATUS DOTS */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--offline); display: inline-block; margin-right: 5px; border: 2px solid var(--sidebar-bg); }
        .status-dot.online { background: var(--online); }

        /* MAIN CHAT AREA */
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
        .chat-header { padding: 15px; background: var(--card-bg); border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .header-info { display: flex; align-items: center; }
        .header-info img { width: 40px; height: 40px; border-radius: 50%; margin-right: 15px; object-fit: cover; }
        
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 70%; padding: 10px 15px; border-radius: 12px; position: relative; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
        .msg.sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 2px; }
        .msg.received { align-self: flex-start; background: var(--received); border-bottom-left-radius: 2px; }
        .msg.system { align-self: center; background: var(--system); font-size: 12px; padding: 5px 15px; border-radius: 20px; color: #cbd5e1; }
        
        .sender { font-size: 10px; color: var(--accent); display: block; margin-bottom: 2px; font-weight: bold; }
        .timestamp { font-size: 9px; color: var(--text-dim); float: right; margin-left: 10px; margin-top: 5px; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; transition: 0.2s; }
        .msg img:hover { opacity: 0.9; }

        /* INPUT AREA */
        .input-area { padding: 15px; background: var(--card-bg); border-top: 1px solid #1e293b; display: flex; gap: 10px; align-items: flex-end; }
        .input-area textarea { flex: 1; background: #1e293b; border: none; color: white; padding: 12px; border-radius: 20px; resize: none; outline: none; height: 44px; max-height: 120px; font-family: inherit; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .btn:hover { opacity: 0.9; }
        .btn-icon { padding: 10px; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
        .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
        .btn-danger { background: var(--danger); }

        /* MODALS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-box { background: #0f172a; padding: 25px; border-radius: 15px; width: 400px; max-width: 90%; border: 1px solid #1e293b; text-align: center; }
        .modal-box input { width: 100%; padding: 10px; margin: 10px 0; background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; }
        .full-btn { width: 100%; margin-top: 10px; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--primary); animation: slideIn 0.3s; }
        @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div id="imageModal" class="modal" style="z-index: 5000;" onclick="if(event.target===this) closeModal('imageModal')">
    <div style="position:relative; max-width:90%; max-height:90vh; text-align:center;">
        <img id="imgViewer" style="max-width:100%; max-height:80vh; border-radius:8px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
        <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
            <a id="imgDownload" href="#" download="afbeelding.jpg" class="btn">💾 Downloaden</a>
            <button class="btn btn-danger" onclick="closeModal('imageModal')">Sluiten</button>
        </div>
    </div>
</div>

<div class="sidebar">
    <div class="sidebar-header">
        <img id="myAvatar" src="" onclick="location.href='index.html'">
        <div style="flex:1; margin-left:10px; display:flex; flex-direction:column;">
            <b id="myName">Laden...</b>
            <div id="myStatusToggle" onclick="toggleMyStatus()" style="font-size:11px; color:gray; cursor:pointer; display:flex; align-items:center; gap:5px; margin-top:2px;">
                <div id="myStatusDot" class="status-dot online" style="position:relative; margin:0;"></div>
                <span id="myStatusText">Online</span>
            </div>
        </div>
        <button class="btn btn-sm" onclick="openGroupModal()">+ Groep</button>
    </div>
    <div id="chatList" class="chat-list"></div>
    <div style="padding:10px; border-top:1px solid #1e293b; text-align:center;">
        <button class="btn btn-sm" style="background:#334155" onclick="location.href='index.html'">🏠 Terug naar Home</button>
    </div>
</div>

<div class="main">
    <div class="chat-header">
        <div class="header-info">
            <img id="activeChatImg" src="" style="display:none">
            <div>
                <div id="activeChatName" style="font-weight:bold; font-size:16px;">Selecteer een chat</div>
                <div id="activeStatus" style="font-size:12px; color:var(--text-dim); display:none;"></div>
            </div>
        </div>
        <button id="settingsBtn" class="btn btn-sm btn-icon" style="display:none" onclick="openChatSettings()">⚙️</button>
    </div>

    <div id="chatMessages" class="messages">
        <div style="text-align:center; color:gray; margin-top:50px;">
            👋 Welkom bij Game Paradise Chat!<br>Selecteer een chat links om te beginnen.
        </div>
    </div>

    <div id="inputArea" class="input-area" style="display:none">
        <button class="btn btn-icon" onclick="document.getElementById('fileInput').click()" style="background:#334155;">📷</button>
        <input type="file" id="fileInput" accept="image/*" hidden onchange="handleFileUpload(this)">
        <textarea id="messageInput" placeholder="Typ een bericht..." oninput="handleTyping()" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); sendMessage();}"></textarea>
        <button class="btn btn-icon" onclick="sendMessage()">➤</button>
    </div>
</div>

<div id="groupModal" class="modal">
    <div class="modal-box">
        <h2>Nieuwe Groep</h2>
        <input id="newGroupName" placeholder="Groepsnaam">
        <button class="btn full-btn" onclick="createGroup()">Aanmaken</button>
        <button class="btn full-btn" style="background:transparent; color:gray;" onclick="closeModal('groupModal')">Annuleren</button>
    </div>
</div>

<div id="groupSettingsModal" class="modal">
    <div class="modal-box">
        <div id="settingsContent">
            </div>
        <button onclick="closeModal('groupSettingsModal')" style="background:transparent; color:gray; margin-top:10px; border:none; cursor:pointer;">Sluiten</button>
    </div>
</div>

<script>
// FIREBASE CONFIG
const firebaseConfig = {
    apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
    authDomain: "gameparadise-80490.firebaseapp.com",
    projectId: "gameparadise-80490",
    storageBucket: "gameparadise-80490.firebasestorage.app",
    messagingSenderId: "335620903527",
    appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const storage = firebase.storage();

// VARIABELEN
let user = null;
let activeChatId = null;
let chatType = null; // 'global', 'group', 'private'
let msgUnsub = null;
let typingUnsub = null;
let chatDataMap = new Map();
let typingTimeout = null;
let isOfflineMode = false;
let originalTitle = document.title;
let titleInterval = null;

// INIT
auth.onAuthStateChanged(u => {
    if (!u) location.href = 'index.html';
    user = u;
    loadUserData();
    loadChats();
    startPresenceSystem();
});

// STATUS SYSTEM
function startPresenceSystem() {
    if(!isOfflineMode) updatePresence('online');
    
    // Elke minuut status verversen
    setInterval(() => { if(!isOfflineMode) updatePresence('online'); }, 60000);

    // Bij afsluiten offline zetten
    window.addEventListener('beforeunload', () => {
        updatePresence('offline');
        if(activeChatId) updateTyping(false);
    });
}

function updatePresence(status) {
    if(user) {
        db.collection("users").doc(user.uid).update({
            status: status, 
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
}

function toggleMyStatus() {
    isOfflineMode = !isOfflineMode;
    const dot = document.getElementById('myStatusDot');
    const txt = document.getElementById('myStatusText');
    
    if(isOfflineMode) {
        dot.className = "status-dot";
        txt.innerText = "Offline (Verborgen)";
        txt.style.color = "gray";
        updatePresence('offline');
        notify("Status", "Je bent nu onzichtbaar.");
    } else {
        dot.className = "status-dot online";
        txt.innerText = "Online";
        txt.style.color = "white";
        updatePresence('online');
        notify("Status", "Je bent nu online.");
    }
}

function loadUserData() {
    db.collection("users").doc(user.uid).get().then(doc => {
        if(doc.exists) {
            const data = doc.data();
            document.getElementById('myName').innerText = data.name;
            document.getElementById('myAvatar').src = data.pic || `https://ui-avatars.com/api/?name=${data.name}`;
        }
    });
}

// CHATS LADEN
function loadChats() {
    // 1. Global Chat
    const globalChat = { id: 'global', name: 'Wereld Chat', type: 'global', pic: 'https://cdn-icons-png.flaticon.com/512/921/921347.png' };
    chatDataMap.set('global', globalChat);
    renderSidebar();

    // 2. Groepen
    db.collection("groups").where("members", "array-contains", user.uid).onSnapshot(snap => {
        snap.forEach(doc => {
            const d = doc.data();
            chatDataMap.set(doc.id, { ...d, id: doc.id, type: 'group', pic: d.pic || 'https://cdn-icons-png.flaticon.com/512/1256/1256650.png' });
        });
        renderSidebar();
    });

    // 3. Vrienden (Privé)
    db.collection("users").doc(user.uid).collection("friends").onSnapshot(snap => {
        snap.forEach(doc => {
            const d = doc.data();
            // Check online status van vriend
            db.collection("users").doc(doc.id).onSnapshot(friendDoc => {
                const friendData = friendDoc.data();
                const isOnline = friendData && friendData.status === 'online';
                
                chatDataMap.set(doc.id, { 
                    ...d, id: doc.id, type: 'private', 
                    name: d.name, pic: d.pic,
                    online: isOnline
                });
                
                // Als dit de actieve chat is, update header status direct
                if(activeChatId === doc.id) {
                    const statusEl = document.getElementById('activeStatus');
                    statusEl.innerText = isOnline ? 'Online' : 'Offline';
                    statusEl.style.color = isOnline ? 'var(--online)' : 'gray';
                }
                renderSidebar();
            });
        });
    });
    
    // Check unread messages
    listenForUnread();
}

function listenForUnread() {
    db.collection("messages").where("to", "==", user.uid).where("read", "==", false)
    .onSnapshot(snap => {
        snap.docChanges().forEach(change => {
            if(change.type === 'added') {
                const msg = change.doc.data();
                const senderId = msg.chatId || msg.from; // Voor groups is het chatId, prive is from
                
                // Als we niet in deze chat zitten, zet rood bolletje
                if(activeChatId !== senderId && chatDataMap.has(senderId)) {
                    const c = chatDataMap.get(senderId);
                    c.unread = true;
                    c.lastMsg = msg.text;
                    chatDataMap.set(senderId, c);
                    renderSidebar();
                    playNotificationSound();
                    
                    if(document.hidden) startTitleFlash("💬 Nieuw bericht!");
                }
            }
        });
    });
}

function renderSidebar() {
    const list = document.getElementById('chatList');
    list.innerHTML = "";
    
    // Sorteer: eerst ongelezen, dan alfabetisch (of op datum als je dat hebt)
    const chats = Array.from(chatDataMap.values()).sort((a, b) => (b.unread ? 1 : 0) - (a.unread ? 1 : 0));

    chats.forEach(c => {
        const div = document.createElement('div');
        div.className = `chat-item ${activeChatId === c.id ? 'active' : ''}`;
        
        // Status dot voor privé
        let statusHtml = '';
        if(c.type === 'private') {
            statusHtml = `<div class="status-dot ${c.online ? 'online' : ''}" style="width:8px; height:8px; border:none; margin-right:0;"></div>`;
        }

        div.innerHTML = `
            <img src="${c.pic || `https://ui-avatars.com/api/?name=${c.name}`}">
            <div class="chat-info">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="chat-name">${c.name}</span>
                    ${statusHtml}
                </div>
                <div class="chat-preview">${c.unread ? '<b>Nieuw bericht</b>' : (c.lastMsg || 'Klik om te openen')}</div>
            </div>
            ${c.unread ? `<div class="unread-badge">1</div>` : ''}
        `;
        div.onclick = () => openChat(c.id, c.name, c.pic, c.type);
        list.appendChild(div);
    });
}

// CHAT OPENEN
async function openChat(id, name, pic, type) {
    activeChatId = id; 
    chatType = type;
    
    // FIX: Rode bolletje direct weghalen en data updaten
    if(chatDataMap.has(id)) {
        const c = chatDataMap.get(id);
        c.unread = false;
        chatDataMap.set(id, c);
    }
    renderSidebar();

    // Titel flash stoppen
    if(titleInterval) { clearInterval(titleInterval); document.title = originalTitle; }

    // UI Update
    document.getElementById('activeChatName').innerText = name;
    document.getElementById('activeChatImg').src = pic || `https://ui-avatars.com/api/?name=${name}`;
    document.getElementById('activeChatImg').style.display = "block";
    document.getElementById('inputArea').style.display = "flex";
    
    // Instellingen knop alleen voor groepen
    const settingsBtn = document.getElementById('settingsBtn');
    settingsBtn.style.display = (type === 'group') ? 'block' : 'none';
    
    // Status in header
    const statusEl = document.getElementById('activeStatus');
    if(type === 'private' && chatDataMap.has(id)) {
        const isOnline = chatDataMap.get(id).online;
        statusEl.style.display = 'block';
        statusEl.innerText = isOnline ? 'Online' : 'Offline';
        statusEl.style.color = isOnline ? 'var(--online)' : 'gray';
    } else {
        statusEl.style.display = 'none';
    }

    document.getElementById('messageInput').value = "";
    document.getElementById('chatMessages').innerHTML = '<div style="text-align:center; margin-top:20px;">Berichten laden...</div>';

    // Oude listeners stoppen
    if(msgUnsub) msgUnsub();
    if(typingUnsub) typingUnsub();

    loadMessages();
    setupTypingListener();
}

function loadMessages() {
    let query;
    if(chatType === 'global') {
        query = db.collection("messages").where("chatId", "==", "global").orderBy("timestamp", "asc").limitToLast(50);
    } else if(chatType === 'group') {
        query = db.collection("messages").where("chatId", "==", activeChatId).orderBy("timestamp", "asc").limitToLast(50);
    } else {
        // Prive: berichten tussen mij en de ander
        const chatID = [user.uid, activeChatId].sort().join("_");
        query = db.collection("messages").where("chatId", "==", chatID).orderBy("timestamp", "asc").limitToLast(50);
    }

    msgUnsub = query.onSnapshot(snap => {
        const container = document.getElementById('chatMessages');
        container.innerHTML = "";
        snap.forEach(doc => renderMessage(doc.data(), container));
        container.scrollTop = container.scrollHeight;
        
        // Markeer als gelezen
        if(!snap.empty) {
            // Dit kan je optimaliseren door batch updates, voor nu simpel:
            // (In productie doe je dit server-side of slimmer)
        }
    });
}

function renderMessage(msg, container) {
    const div = document.createElement('div');
    const isMe = msg.from === user.uid;
    
    div.className = `msg ${msg.system ? 'system' : (isMe ? 'sent' : 'received')}`;
    
    let content = "";
    if(msg.image) {
        // NIEUW: Openen in modal ipv nieuw tabblad
        content = `<img src="${msg.image}" onclick="openImage('${msg.image}')">`;
    } else {
        content = msg.text;
    }

    if(msg.system) {
        div.innerHTML = content;
    } else {
        div.innerHTML = `
            ${!isMe && chatType !== 'private' ? `<span class="sender">${msg.senderName}</span>` : ''}
            ${content}
            <span class="timestamp">${msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...'}</span>
        `;
    }
    container.appendChild(div);
}

// BERICHTEN VERSTUREN
async function sendMessage(imageUrl = null) {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    
    if(!text && !imageUrl) return;

    let targetId = activeChatId;
    if(chatType === 'private') {
        targetId = [user.uid, activeChatId].sort().join("_");
    }

    const msg = {
        text: text,
        image: imageUrl || null,
        from: user.uid,
        senderName: document.getElementById('myName').innerText,
        chatId: targetId,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        system: false,
        read: false,
        to: chatType === 'private' ? activeChatId : null // Handig voor notifications
    };

    input.value = "";
    updateTyping(false);
    await db.collection("messages").add(msg);
}

// AFBEELDINGEN UPLOADEN
function handleFileUpload(input) {
    const file = input.files[0];
    if(!file) return;

    const ref = storage.ref(`chat_images/${Date.now()}_${file.name}`);
    ref.put(file).then(snap => snap.ref.getDownloadURL()).then(url => {
        sendMessage(url);
    });
}

// TYPING INDICATOR (FIX VOOR PRIVE)
async function setupTypingListener() {
    let ref;
    if(chatType === 'global') ref = db.collection("metadata").doc("global");
    else if(chatType === 'group') ref = db.collection("groups").doc(activeChatId);
    else ref = db.collection("private_chats").doc([user.uid, activeChatId].sort().join("_"));

    typingUnsub = ref.onSnapshot(doc => {
        // Maak element aan als het er niet is
        let indic = document.getElementById('typingIndicator');
        if(!indic) {
            indic = document.createElement('div');
            indic.id = 'typingIndicator';
            indic.style.cssText = "font-size:12px; color:#94a3b8; padding:0 20px; font-style:italic; display:none;";
            document.getElementById('inputArea').before(indic);
        }

        if(doc.exists && doc.data().typingStatus) {
            const typers = Object.entries(doc.data().typingStatus)
                .filter(([uid, name]) => uid !== user.uid)
                .map(([uid, name]) => name);
            
            if(typers.length > 0) {
                indic.style.display = 'block';
                indic.innerText = `${typers.join(", ")} is aan het typen...`;
            } else {
                indic.style.display = 'none';
            }
        } else {
            indic.style.display = 'none';
        }
    });
}

async function handleTyping() {
    if(typingTimeout) clearTimeout(typingTimeout);
    updateTyping(true);
    typingTimeout = setTimeout(() => updateTyping(false), 2000);
}

async function updateTyping(isTyping) {
    if(!activeChatId) return;
    let ref;
    
    // Correcte path bepalen
    if(chatType === 'global') ref = db.collection("metadata").doc("global");
    else if(chatType === 'group') ref = db.collection("groups").doc(activeChatId);
    else ref = db.collection("private_chats").doc([user.uid, activeChatId].sort().join("_"));

    const myName = document.getElementById('myName').innerText;
    const fieldPath = "typingStatus." + user.uid;

    if(isTyping) {
        const update = {};
        update[fieldPath] = myName;
        // Merge: true zorgt dat het document gemaakt wordt als het niet bestaat (belangrijk voor prive)
        await ref.set(update, { merge: true });
    } else {
        const update = {};
        update[fieldPath] = firebase.firestore.FieldValue.delete();
        // Update faalt als doc niet bestaat, catch dat
        await ref.update(update).catch(e => {}); 
    }
}

// INSTELLINGEN & LEDEN (GEFIXTE MENU'S)
async function openChatSettings() {
    const modal = document.getElementById('groupSettingsModal');
    const content = document.getElementById('settingsContent');
    modal.style.display = 'flex';
    
    const groupDoc = await db.collection("groups").doc(activeChatId).get();
    const g = groupDoc.data();
    const isAdmin = g.admins && g.admins.includes(user.uid);

    // Bouw de instellingen pagina
    content.innerHTML = `
        <h2 style="color:var(--accent)">${g.name}</h2>
        <div style="margin:20px 0; text-align:left; max-height:200px; overflow-y:auto; border:1px solid #334155; padding:10px; border-radius:8px;">
            <div style="color:gray; font-size:12px; margin-bottom:5px;">Leden (${g.members.length})</div>
            ${g.memberNames ? g.memberNames.map(n => `<div>👤 ${n}</div>`).join('') : 'Laden...'}
        </div>
        ${isAdmin ? `
            <button class="btn full-btn" onclick="openAddMemberMenu('${g.members.join(",")}')">➕ Leden Toevoegen</button>
            <button class="btn full-btn btn-danger" onclick="deleteGroup()">Verwijder Groep</button>
        ` : `<button class="btn full-btn btn-danger" onclick="leaveGroup()">Groep Verlaten</button>`}
    `;
}

// NIEUW: Opent menu IN de modal ipv erbovenop
async function openAddMemberMenu(currentMembersStr) {
    const currentMembers = currentMembersStr.split(",");
    const content = document.getElementById('settingsContent');
    
    content.innerHTML = `<h3>Vrienden Uitnodigen</h3><div id="inviteList">Laden...</div>`;
    
    const friendsSnap = await db.collection("users").doc(user.uid).collection("friends").get();
    let html = `<div style="max-height:250px; overflow-y:auto; margin:15px 0; text-align:left; border:1px solid #334155; padding:10px; border-radius:8px;">`;
    
    let count = 0;
    friendsSnap.forEach(doc => {
        if(!currentMembers.includes(doc.id)) {
            count++;
            html += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #1e293b;">
                    <span>${doc.data().name}</span>
                    <button class="btn btn-sm" onclick="addMemberToGroup('${doc.id}', '${doc.data().name}')">Toevoegen</button>
                </div>`;
        }
    });

    if(count === 0) html += `<div style="text-align:center; color:gray;">Geen vrienden om toe te voegen.</div>`;
    html += `</div>`;
    
    // Terug knop
    html += `<button class="btn full-btn" style="background:#334155" onclick="openChatSettings()">⬅ Terug naar Instellingen</button>`;
    
    content.innerHTML = html;
}

async function addMemberToGroup(uid, name) {
    const ref = db.collection("groups").doc(activeChatId);
    await ref.update({
        members: firebase.firestore.FieldValue.arrayUnion(uid),
        memberNames: firebase.firestore.FieldValue.arrayUnion(name)
    });
    notify("Succes", `${name} is toegevoegd!`);
    // Herlaad de lijst door menu opnieuw te openen
    const updatedDoc = await ref.get();
    openAddMemberMenu(updatedDoc.data().members.join(","));
}

// MODAL & IMAGE UTILS
function openGroupModal() { document.getElementById('groupModal').style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function openImage(src) {
    document.getElementById('imgViewer').src = src;
    document.getElementById('imgDownload').href = src;
    document.getElementById('imageModal').style.display = 'flex';
}

function createGroup() {
    const name = document.getElementById('newGroupName').value;
    if(!name) return;
    
    db.collection("groups").add({
        name: name,
        admins: [user.uid],
        members: [user.uid],
        memberNames: [document.getElementById('myName').innerText],
        pic: "",
        lastMsg: "Groep aangemaakt",
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
        closeModal('groupModal');
        notify("Groep aangemaakt!");
    });
}

function notify(title, msg) {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<b>${title}</b><br>${msg}`;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function playNotificationSound() {
    const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    audio.play().catch(e => {});
}

function startTitleFlash(text) {
    let state = false;
    titleInterval = setInterval(() => {
        document.title = state ? originalTitle : text;
        state = !state;
    }, 1000);
}

// GLOBALE ESCAPE KEY
document.addEventListener('keydown', (e) => {
    if(e.key === "Escape") {
        document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }
});
</script>
