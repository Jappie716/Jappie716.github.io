<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Game Paradise - Chat</title>
    <link rel="icon" type="image/png" href="/icon/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg: #020617; --sidebar-bg: #010409; --card-bg: #0f172a;
            --primary: #2563eb; --accent: #60a5fa; --text-dim: #94a3b8;
            --sent: #172554; --received: #1e293b; --danger: #ef4444; --system: #334155;
            --online: #22c55e; --offline: #64748b;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); color: white; height: 100vh; 
            display: flex; overflow: hidden; 
        }

        a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
        a:hover { border-bottom: 1px solid var(--accent); }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 999999; pointer-events: none; }
        .toast { 
            background: var(--card-bg); color: white; padding: 15px 20px; 
            border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); 
            animation: slideIn 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
            pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 10px;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .container { display: flex; width: 100%; height: 100%; }

        /* SIDEBAR */
        .sidebar { width: 320px; background: var(--sidebar-bg); border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; background: var(--card-bg); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1e293b; }
        .sidebar-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; cursor: pointer; border: 2px solid var(--primary); }
        
        .search-box { padding: 10px; background: var(--sidebar-bg); border-bottom: 1px solid #1e293b; }
        .search-box input { width: 100%; background: #0f172a; border: 1px solid #1e293b; padding: 8px; border-radius: 6px; color: white; font-size: 13px; outline: none; }

        .tabs { display: flex; background: var(--sidebar-bg); border-bottom: 1px solid #1e293b; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-size: 12px; color: var(--text-dim); position: relative; }
        .tab.active { color: var(--accent); border-bottom: 2px solid var(--primary); background: #1e3a8a22; font-weight: bold; }
        .tab-dot { position: absolute; top: 8px; right: 10px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; display: none; }

        .list-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .sidebar-footer { padding: 15px; border-top: 1px solid #1e293b; background: var(--sidebar-bg); }

        .item { display: flex; align-items: center; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #0f172a; position: relative; transition: 0.2s; }
        .item:hover { background: #0f172a; }
        .item.active-chat { background: #1e3a8a !important; border-left: 4px solid #60a5fa; }
        .item img { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; object-fit: cover; background: #334155; }
        .item-info { flex: 1; overflow: hidden; }
        .item-info h4 { margin: 0; font-size: 14px; color: #e2e8f0; }
        .item-info p { margin: 0; font-size: 11px; color: gray; }
        
        .status-wrapper { position: relative; margin-right: 12px; width: 40px; height: 40px; }
        .status-wrapper img { margin-right: 0; width: 100%; height: 100%; }
        .status-dot {
            width: 12px; height: 12px; border-radius: 50%; 
            position: absolute; bottom: 0; right: 0;
            border: 2px solid var(--sidebar-bg);
            background-color: var(--offline);
            z-index: 5;
        }
        .status-dot.online { background-color: var(--online); box-shadow: 0 0 5px var(--online); }

        .unread-badge { background: var(--danger); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-left: auto; display: none; }
        .unread-badge.show { display: block; }

        /* MAIN CHAT */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at center, #0f172a, #020617); }
        .chat-header { padding: 10px 20px; background: var(--card-bg); display: flex; align-items: center; border-bottom: 1px solid #1e293b; height: 65px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { 
            max-width: 75%; 
            padding: 10px 14px; 
            border-radius: 12px; 
            font-size: 14px; 
            position: relative; 
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            display: flex; 
            flex-direction: column;
        }
        .msg.sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 2px; }
        .msg.received { align-self: flex-start; background: var(--received); border-bottom-left-radius: 2px; }
        .msg.system { align-self: center; background: #1e293b88; padding: 5px 12px; border-radius: 20px; font-size: 11px; color: #94a3b8; text-align: center; border: 1px solid #334155; margin: 5px 0; max-width: 90%; }
        
        .msg img { max-width: 350px; max-height: 350px; width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; object-fit: cover; }
        .msg .sender { font-size: 10px; color: var(--accent); font-weight: bold; margin-bottom: 2px; display: block; }
        
        .msg-footer {
            display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px;
        }
        .msg-time { font-size: 9px; color: #64748b; }

        .date-divider {
            display: flex; align-items: center; justify-content: center; margin: 15px 0;
            font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;
        }
        .date-divider span { background: #1e293b; padding: 4px 12px; border-radius: 12px; border: 1px solid #334155; }

        .delete-btn { 
            position: absolute; top: -8px; right: -8px; 
            background: var(--card-bg); border: 1px solid var(--danger); 
            color: var(--danger); border-radius: 50%; width: 22px; height: 22px; 
            display: none; align-items: center; justify-content: center; 
            font-size: 12px; cursor: pointer; z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .msg.sent:hover .delete-btn { display: flex; }

        .chat-input { padding: 15px; background: var(--card-bg); display: flex; flex-direction:column; gap:0; border-top: 1px solid #1e293b; }
        .typing-indicator { font-size: 11px; color: var(--accent); height: 16px; margin-bottom: 4px; padding-left: 10px; opacity: 0; transition: 0.3s; }
        .typing-indicator.active { opacity: 1; }

        .input-row { display: flex; gap: 10px; align-items: flex-end; width: 100%; }
        
        /* AANGEPAST: Textarea styling voor auto-scaling */
        .chat-input textarea { 
            flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #1e293b; 
            background: var(--bg); color: white; outline: none; 
            resize: none; font-family: inherit; 
            height: 44px; 
            min-height: 44px; 
            max-height: 150px; /* Maximale hoogte */
            overflow-y: auto;
            line-height: 1.4;
        }
        
        .btn { background: var(--primary); border: none; padding: 10px 18px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; font-size: 13px; }
        .btn:hover { background: #1d4ed8; }
        .btn-danger { background: var(--danger); }
        .btn-sm { padding: 5px 10px; font-size: 11px; }
        .btn-icon { padding: 10px; width: 44px; height: 44px; background: #334155; }
        .btn-outline { background: transparent; border: 1px solid #334155; color: #94a3b8; }
        .btn-outline:hover { border-color: var(--primary); color: white; }
        
        .settings-icon { width: 30px; height: 30px; cursor: pointer; transition: transform 0.2s; }
        .settings-icon:hover { transform: rotate(45deg); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-box { background: var(--card-bg); padding: 25px; border-radius: 18px; width: 100%; max-width: 400px; border: 1px solid #1e293b; max-height: 90vh; overflow-y: auto; }
        input[type="text"] { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #1e293b; background: #020617; color: white; }
        
        .member-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
        .full-btn { width: 100%; margin-top: 5px; }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        #loadingOld { text-align: center; font-size: 11px; color: gray; padding: 5px; display: none; }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div id="imageModal" class="modal" style="z-index: 5000;" onclick="if(event.target===this) document.getElementById('imageModal').style.display='none'">
    <div style="position:relative; max-width:90%; max-height:90vh; text-align:center;">
        <img id="imgViewer" style="max-width:100%; max-height:80vh; border-radius:8px; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
        <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
            <a id="imgDownload" href="#" download="afbeelding.jpg" class="btn">💾 Downloaden</a>
            <button class="btn btn-danger" onclick="document.getElementById('imageModal').style.display='none'">Sluiten</button>
        </div>
    </div>
</div>

<div id="setupOverlay" style="position:fixed; inset:0; background:var(--bg); z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center;">
    <div class="modal-box" style="text-align:center;">
        <h2>Welkom!</h2>
        <img id="setupPreview" src="https://ui-avatars.com/api/?name=User" style="width:100px; height:100px; border-radius:50%; margin:15px auto; display:block; object-fit:cover;">
        <button class="btn btn-sm" onclick="document.getElementById('setupFile').click()" style="margin:0 auto;">Upload Foto</button>
        <input type="file" id="setupFile" hidden accept="image/*" onchange="previewImage(this, 'setupPreview')">

<div class="container">
    <div class="sidebar">
        <div class="sidebar-header">
            <img id="myAvatar" src="" onclick="openProfile()">

        <div class="sidebar-footer">

                ⬅ Terug naar Home
            </button>
        </div>
    </div>

    <div class="main-chat">
        <div class="chat-header">
            <img id="activeChatImg" src="" style="width:40px; height:40px; border-radius:50%; margin-right:12px; display:none; object-fit:cover;">
            <div style="flex:1">
                <h3 id="activeChatName" style="margin:0; font-size:16px;">Game Paradise</h3>
                <span id="activeStatus" style="font-size:11px; color:gray; display:none;">Online</span>
            </div>
            <img id="settingsBtn" src="https://flaticons.net/icon.php?slug_category=mobile-application&slug_icon=settings-01&icon_size=256&icon_color=FFFFFF&icon_flip=&icon_rotate=100" class="settings-icon" style="display:none;" onclick="openChatSettings()">
        </div>

        </div>

        <div class="chat-input" id="inputArea" style="display:none">
            <div id="typingIndicator" class="typing-indicator">Iemand is aan het typen...</div>
            <div class="input-row">
                <button class="btn btn-icon" onclick="document.getElementById('imgInp').click()" style="display: flex; align-items: center; justify-content: center;">
                    <img src="https://i.imgur.com/CeRZ8na.png" style="width: 24px; height: 24px; object-fit: contain;">
                </button>
                <input type="file" id="imgInp" hidden accept="image/*" onchange="handleImageSend(this)">
                
                <textarea id="messageInput" placeholder="Typ bericht... (Shift+Enter voor nieuwe regel)" 
                          oninput="handleTyping()"
                          onkeydown="handleKeyDown(event)"></textarea>
                
                <button class="btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<div id="deleteOptionsModal" class="modal">
    <div class="modal-box" style="text-align:center;">
        <h3>Bericht Opties</h3>
        <p style="color:gray; font-size:13px; margin-bottom:20px;">Wat wil je doen met dit bericht?</p>
        <button class="btn btn-danger" onclick="confirmDeleteMessage()" style="width:100%; margin-bottom:10px;">🗑 Verwijder voor iedereen</button>
        <button class="btn" style="background:#334155; width:100%;" onclick="closeModal('deleteOptionsModal')">Annuleren</button>
        <p id="deleteError" style="color:var(--danger); font-size:11px; margin-top:10px; display:none;"></p>

<div id="confirmModal" class="modal" style="z-index: 3000;">
    <div class="modal-box" style="text-align:center;">
        <h3 id="confirmTitle">Bevestigen</h3>
        <p id="confirmText" style="color:gray; font-size:14px;"></p>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">

            <button class="btn" style="background:#334155" onclick="closeModal('confirmModal')">Annuleren</button>

<div id="profileModal" class="modal"><div class="modal-box">
    <h3>Profiel</h3>
    <div style="text-align:center"><img id="editPreview" src="" style="width:100px; height:100px; border-radius:50%; object-fit:cover;"></div>
    <button class="btn btn-sm" onclick="document.getElementById('editFile').click()" style="margin:10px auto; display:block;">Wijzig Foto</button>
    <input type="file" id="editFile" hidden accept="image/*" onchange="previewImage(this, 'editPreview')">
    <input type="text" id="editName">

</div></div>

<div id="groupModal" class="modal"><div class="modal-box">
    <h3>Nieuwe Groep</h3>
    <div style="text-align:center; margin-bottom:10px;">
        <img id="groupCreatePreview" src="https://ui-avatars.com/api/?name=Group" style="width:80px; height:80px; border-radius:50%; object-fit:cover;">
        <br>
        <button class="btn btn-sm" onclick="document.getElementById('groupCreateFile').click()" style="margin-top:5px;">Kies Groepsfoto</button>

    <div id="inviteList" style="max-height:150px; overflow-y:auto; margin:10px 0; border:1px solid #1e293b; padding:10px; border-radius:8px;"></div>
    <button class="btn" onclick="createGroup()" style="width:100%">Aanmaken</button>
    <button class="btn" onclick="closeModal('groupModal')" style="width:100%; background:#334155; margin-top:5px;">Annuleren</button>
</div></div>

<div id="addMemberModal" class="modal"><div class="modal-box">
    <h3>Lid Toevoegen</h3>
    <div id="addMemberList" style="max-height:200px; overflow-y:auto; margin-bottom:15px; border:1px solid #1e293b; border-radius:8px; padding:10px;">Laden...</div>
    <button class="btn" onclick="closeModal('addMemberModal')" style="width:100%; background:#334155;">Sluiten</button>
</div></div>

<div id="settingsModal" class="modal"><div class="modal-box" id="settingsContent"></div></div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyA0K4geAuueVfiItB_98-LkqRTnpYNUNvM",
    authDomain: "gameparadise-80490.firebaseapp.com",
    projectId: "gameparadise-80490",
    storageBucket: "gameparadise-80490.firebasestorage.app",
    messagingSenderId: "335620903527",
    appId: "1:335620903527:web:1bc1e01a386bf6e4e7fac2"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let user = null;
let activeChatId = null;
let chatType = null;
let currentBase64 = null; 
let chatDataMap = new Map();
let activeListeners = new Set();
let msgUnsub = null;
let typingUnsub = null;
let originalTitle = document.title;
let titleInterval = null;
let ignoreInitialGroups = true;
let messageToDeleteId = null;
let typingTimeout = null;
let msgLimit = 50; // AANTAL BERICHTEN OM TE LADEN

auth.onAuthStateChanged(u => {
    if (u) { user = u; checkSetup(); startPresenceSystem(); }
    else { location.href = 'index.html'; }
});

function startPresenceSystem() {
    updatePresence('online');
    setInterval(() => { updatePresence('online'); }, 60000);
    window.addEventListener('beforeunload', () => {
        db.collection("users").doc(user.uid).update({ 
            status: 'offline', lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        });
        if(activeChatId) updateTyping(false);
    });
}

function updatePresence(status) {
    if(user) {
        db.collection("users").doc(user.uid).update({
            status: status, lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
}

async function checkSetup() {
    const doc = await db.collection("users").doc(user.uid).get();
    if (!doc.exists || !doc.data().name) {
        document.getElementById('setupOverlay').style.display = 'flex';
    } else {
        document.getElementById('setupOverlay').style.display = 'none';
        if (Notification.permission === "default") Notification.requestPermission();
        initApp();
    }
}

function initApp() {
    db.collection("users").doc(user.uid).onSnapshot(d => {
        const data = d.data();
        document.getElementById('myName').innerText = data.name;
        document.getElementById('myAvatar').src = data.pic || `https://ui-avatars.com/api/?name=${data.name}`;
    });
    
    db.collection("users").doc(user.uid).collection("requests").onSnapshot(snap => {
        document.getElementById('reqDot').style.display = snap.empty ? 'none' : 'block';
        if(!snap.empty) {
            snap.docChanges().forEach(change => {
                if(change.type === 'added') notify("Vriendschapsverzoek", "Je hebt een nieuw verzoek!", "", "requests");
            });
        }
    });
    subscribeToChats();
    setTimeout(() => { ignoreInitialGroups = false; }, 2000);
}

async function subscribeToChats() {
    setupListener('global', 'Algemeen', 'https://i.imgur.com/C9HtyPv.jpeg', 'global', db.collection("chats"));

    db.collection("groups").where("members", "array-contains", user.uid).onSnapshot(snap => {
        snap.docChanges().forEach(change => {
            if (change.type === "added") {
                const d = change.doc.data();
                setupListener(change.doc.id, d.name, d.pic, 'group', db.collection("groups").doc(change.doc.id).collection("messages"));
                if(!ignoreInitialGroups) notify("Nieuwe Groep", `Toegevoegd aan ${d.name}`, d.pic, change.doc.id, 'group');
            } else if (change.type === "removed") {
                chatDataMap.delete(change.doc.id);
                if(activeChatId === change.doc.id) {
                    document.getElementById('chatMessages').innerHTML = "<div style='text-align:center; margin-top:50px'>Groep verwijderd of verlaten</div>";
                    document.getElementById('inputArea').style.display = 'none';
                    activeChatId = null;
                }
                renderSidebar();
            }
        });
    });

    const fSnap = await db.collection("users").doc(user.uid).collection("friends").get();
    fSnap.forEach(doc => {
        const chatId = [user.uid, doc.id].sort().join("_");
        setupListener(doc.id, doc.data().name, doc.data().pic, 'private', db.collection("private_chats").doc(chatId).collection("messages"));
        
        db.collection("users").doc(doc.id).onSnapshot(s => {
            const data = s.data();
            const now = Date.now();
            const lastSeen = data.lastSeen ? data.lastSeen.toMillis() : 0;
            const isOnline = (now - lastSeen) < 120000; 
            
            if(chatDataMap.has(doc.id)) {
                const c = chatDataMap.get(doc.id);
                c.online = isOnline;
                c.pic = data.pic || c.pic;
                chatDataMap.set(doc.id, c);
                renderSidebar();
                
                if(activeChatId === doc.id) {
                    document.getElementById('activeStatus').style.display = 'block';
                    document.getElementById('activeStatus').innerText = isOnline ? 'Online' : 'Offline';
                    document.getElementById('activeStatus').style.color = isOnline ? 'var(--online)' : 'gray';
                    document.getElementById('activeChatImg').src = c.pic;
                }
            }
        });
    });
}

function setupListener(id, name, pic, type, ref) {
    if(activeListeners.has(id)) return;
    activeListeners.add(id);

    if(!chatDataMap.has(id)) chatDataMap.set(id, { id, name, pic, type, timestamp: 0, unread: false, online: false });

    if(type === 'group') {
        db.collection("groups").doc(id).onSnapshot(snap => {
            if(snap.exists) {
                const d = snap.data();
                const c = chatDataMap.get(id);
                c.name = d.name; c.pic = d.pic;
                chatDataMap.set(id, c);
                if(activeChatId === id) {
                    document.getElementById('activeChatName').innerText = d.name;
                    document.getElementById('activeChatImg').src = d.pic || `https://ui-avatars.com/api/?name=${d.name}`;
                }
                renderSidebar();
            }
        });
    }

    ref.orderBy("timestamp", "desc").limit(1).onSnapshot(snap => {
        if(snap.empty) return;
        const m = snap.docs[0].data();
        const time = m.timestamp ? m.timestamp.toMillis() : Date.now();
        const cData = chatDataMap.get(id);
        
        cData.timestamp = time;
        
        if (m.uid !== user.uid) {
            if (activeChatId !== id) {
                cData.unread = true;
                if(type !== 'global' && !ignoreInitialGroups) {
                    notify(name, m.type==='system'?m.text:(m.text || "Foto"), pic, id, type);
                    flashTitle("Nieuw bericht!");
                    playNotificationSound();
                }
            }
        } else if (activeChatId === id) {
            cData.unread = false;
        }

        chatDataMap.set(id, cData);
        renderSidebar();
    });
}

function flashTitle(msg) {
    if(titleInterval) clearInterval(titleInterval);
    let state = false;
    titleInterval = setInterval(() => {
        document.title = state ? originalTitle : `🔔 ${msg}`;
        state = !state;
    }, 1000);
    setTimeout(() => { clearInterval(titleInterval); document.title = originalTitle; }, 5000);
    window.onclick = () => { clearInterval(titleInterval); document.title = originalTitle; };
}

function renderSidebar() {
    const list = document.getElementById('sidebarList');
    const tab = document.querySelector('.tab.active').innerText.split(' ')[0];
    const term = document.getElementById('searchBar').value.toLowerCase();
    list.innerHTML = "";

    if (tab === 'Chats') {
        let chats = Array.from(chatDataMap.values()).sort((a,b) => {
            if(a.type === 'global') return -1; if(b.type === 'global') return 1;
            return b.timestamp - a.timestamp;
        });

        chats.forEach(c => {
            if(term && !c.name.toLowerCase().includes(term)) return;
            
            const item = document.createElement('div');
            item.className = `item ${activeChatId === c.id ? 'active-chat' : ''}`;
            item.onclick = () => openChat(c.id, c.name, c.pic, c.type);
            
            let avatarHtml = `<div class="status-wrapper">

                    ${c.type === 'private' ? `<div class="status-dot ${c.online?'online':''}"></div>` : ''}

                <div class="unread-badge ${c.unread?'show':''}">${c.unread?'!':''}</div>`;

        });
    } else if (tab === 'Ontdek') {
        renderDiscover(list, term);
    } else if (tab === 'Verzoeken') {
        renderRequests(list);
    }
}

function linkify(text) {
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    return text.replace(urlRegex, function(url) {
        return '<a href="' + url + '" target="_blank">' + url + '</a>';
    });
}

function getFormattedDate(date) {
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(yesterday.getDate() - 1);

    if (date.toDateString() === today.toDateString()) return "VANDAAG";
    if (date.toDateString() === yesterday.toDateString()) return "GISTEREN";
    const options = { day: 'numeric', month: 'long' };
    return date.toLocaleDateString('nl-NL', options);
}

// --- OPEN CHAT LOGICA ---
async function openChat(id, name, pic, type) {
    activeChatId = id; chatType = type;
    msgLimit = 50; // Reset limiet bij openen nieuwe chat
    
    if(chatDataMap.has(id)) chatDataMap.get(id).unread = false;
    if(titleInterval) { clearInterval(titleInterval); document.title = originalTitle; }

    document.getElementById('activeChatName').innerText = name;
    document.getElementById('activeChatImg').src = pic || `https://ui-avatars.com/api/?name=${name}`;
    document.getElementById('activeChatImg').style.display = "block";
    document.getElementById('inputArea').style.display = "flex";
    document.getElementById('settingsBtn').style.display = type === 'global' ? 'none' : 'block';
    
    // Reset input height
    const txtArea = document.getElementById('messageInput');
    txtArea.value = "";
    txtArea.style.height = "44px";

    // Scroll listener toevoegen voor history
    document.getElementById('chatMessages').onscroll = checkScroll;
    
    const statusEl = document.getElementById('activeStatus');
    if(type === 'private' && chatDataMap.has(id)) {
        const isOnline = chatDataMap.get(id).online;
        statusEl.style.display = 'block';
        statusEl.innerText = isOnline ? 'Online' : 'Offline';
        statusEl.style.color = isOnline ? 'var(--online)' : 'gray';
    } else {
        statusEl.style.display = 'none';
    }

    renderSidebar();
    
    if(msgUnsub) msgUnsub();
    if(typingUnsub) typingUnsub();

    setupChatListeners();
}

function setupChatListeners() {
    let ref, docRef;
    if(chatType === 'global') {
        ref = db.collection("chats");
        docRef = db.collection("metadata").doc("global");
    } else if(chatType === 'group') {
        docRef = db.collection("groups").doc(activeChatId);
        ref = docRef.collection("messages");
    } else {
        const chatId = [user.uid, activeChatId].sort().join("_");
        docRef = db.collection("private_chats").doc(chatId);
        ref = docRef.collection("messages");
    }

    // 1. Luister naar TYPEN (met namen)
    typingUnsub = docRef.onSnapshot(doc => {
        if(doc.exists) {
            const data = doc.data();
            const typingMap = data.typingStatus || {};
            
            // Haal namen van anderen op
            const typerNames = Object.keys(typingMap)
                .filter(uid => uid !== user.uid) // Filter mezelf eruit
                .map(uid => typingMap[uid]);

            const ind = document.getElementById('typingIndicator');
            
            if(typerNames.length > 0) {
                // Maak string: "Jan is aan het typen" of "Jan, Piet zijn aan het typen"
                const text = typerNames.join(", ") + (typerNames.length > 1 ? " zijn aan het typen..." : " is aan het typen...");
                ind.innerText = text;
                ind.classList.add('active');
            } else {
                ind.classList.remove('active');
            }
        }
    });

    // 2. Berichten luisteren (met msgLimit voor history)
    msgUnsub = ref.orderBy("timestamp", "asc").limitToLast(msgLimit).onSnapshot(snap => {
        window.currentSnap = snap;
        renderMessagesFromCache();
    });
}

// History Scroll Functie
function checkScroll() {
    const box = document.getElementById('chatMessages');
    if (box.scrollTop === 0 && window.currentSnap && window.currentSnap.size >= msgLimit) {
        // We zitten bovenaan én er zijn mogelijk meer berichten
        loadMoreMessages();
    }
}

function loadMoreMessages() {
    const oldLimit = msgLimit;
    msgLimit += 50; // Laad 50 extra
    document.getElementById('loadingOld').style.display = 'block';
    
    // Bewaar huidige scroll positie tov onderkant
    const box = document.getElementById('chatMessages');
    const oldHeight = box.scrollHeight;
    
    if(msgUnsub) msgUnsub(); // Stop huidige listener

    let ref;
    if(chatType === 'global') ref = db.collection("chats");
    else if(chatType === 'group') ref = db.collection("groups").doc(activeChatId).collection("messages");
    else ref = db.collection("private_chats").doc([user.uid, activeChatId].sort().join("_")).collection("messages");

    msgUnsub = ref.orderBy("timestamp", "asc").limitToLast(msgLimit).onSnapshot(snap => {
        window.currentSnap = snap;
        renderMessagesFromCache();
        
        document.getElementById('loadingOld').style.display = 'none';
        
        // Herstel scroll positie zodat je niet verspringt
        if (oldLimit !== msgLimit) {
            const newHeight = box.scrollHeight;
            box.scrollTop = newHeight - oldHeight;
        }
    });
}


function renderMessagesFromCache() {
    if(!window.currentSnap) return;
    const box = document.getElementById('chatMessages');
    // Bewaar of we beneden zijn voor auto-scroll bij nieuwe berichten
    const isAtBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 100;
    
    box.innerHTML = "";
    let lastDateStr = "";

    window.currentSnap.forEach(doc => {
        const m = doc.data();
        let content = "";
        let className = m.uid === user.uid ? 'sent' : 'received';
        let timeStr = "";

        if(m.timestamp) {
            const date = m.timestamp.toDate();
            timeStr = date.getHours().toString().padStart(2,'0') + ":" + date.getMinutes().toString().padStart(2,'0');
            
            const dateHeader = getFormattedDate(date);
            if(dateHeader !== lastDateStr) {
                box.innerHTML += `<div class="date-divider"><span>${dateHeader}</span></div>`;
                lastDateStr = dateHeader;
            }
        }

        if (m.type === 'system') {
            className = 'system';
            content = m.text;
        } else if (m.image) {
            // AANGEPAST: Nu met openImage functie ipv window.open
            content = `<span class="sender">${m.user}</span><img src="${m.image}" onclick="openImage('${m.image}')">`;
        } else {
            content = `<span class="sender">${m.user}</span>${linkify(m.text)}`;
        }
        
        let deleteBtn = "";
        if (m.uid === user.uid && m.type !== 'system') {
            deleteBtn = `<div class="delete-btn" title="Opties" onclick="openDeleteMenu('${doc.id}')">✖</div>`;
        }

        let footerHtml = "";
        if(m.type !== 'system') {
            footerHtml = `<div class="msg-footer"><span class="msg-time">${timeStr}</span></div>`;
        }

        box.innerHTML += `<div class="msg ${className}">${deleteBtn}${content}${footerHtml}</div>`;
    });

    // Alleen naar beneden scrollen als we al beneden waren of als het de eerste laad is
    if (msgLimit === 50 || isAtBottom) {
        box.scrollTop = box.scrollHeight;
    }
}

function handleTyping() {

// Aangepast: Sla nu NAAM op ipv alleen ID in een Map
async function updateTyping(isTyping) {
    if(!activeChatId) return;
    let ref;
    if(chatType === 'global') ref = db.collection("metadata").doc("global");
    else if(chatType === 'group') ref = db.collection("groups").doc(activeChatId);
    else ref = db.collection("private_chats").doc([user.uid, activeChatId].sort().join("_"));

    const myName = document.getElementById('myName').innerText;
    
    // NIEUW: We gebruiken nu een specifieke object structuur voor .set met merge
    // Dit zorgt ervoor dat het document wordt aangemaakt als het niet bestaat (voor prive chats)
    const field = {};
    field[user.uid] = isTyping ? myName : firebase.firestore.FieldValue.delete();

    // Als we typen, updaten we de naam. Als we stoppen, deleten we de field.
    // .set met merge: true fixt het probleem dat prive chat documenten soms niet bestaan
    await ref.set({ typingStatus: field }, { merge: true });
}

async function resizeAndCompressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const maxWidth = 800;
                const scaleSize = maxWidth / img.width;
                canvas.width = maxWidth;
                canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                resolve(canvas.toDataURL('image/jpeg', 0.7));
            }
        }
    });
}

        t.innerHTML = `<img src="${icon || 'https://ui-avatars.com/api/?name=Msg'}" style="width:30px;height:30px;border-radius:50%"><div><b>${title}</b><br><small>${body}</small></div>`;
        t.onclick = () => { if(chatId) openChat(chatId, title, icon, type); t.remove(); };
        box.appendChild(t);
        setTimeout(()=>t.remove(), 4000);
    }

    if(Notification.permission === "granted" && document.hidden) {
        const n = new Notification(title, { body: body, icon: icon || "https://i.imgur.com/CeRZ8na.png" });
        n.onclick = function() { window.focus(); this.close(); if(chatId) openChat(chatId, title, icon, type); };
    }
}

}
function switchTab(t, el) {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    el.classList.add('active'); renderSidebar();
}
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// NIEUW: Functie om image modal te openen
function openImage(src) {
    document.getElementById('imgViewer').src = src;
    document.getElementById('imgDownload').href = src;
    document.getElementById('imageModal').style.display = 'flex';
}

function openProfile() { 
    currentBase64 = null;
    document.getElementById('editName').value = document.getElementById('myName').innerText;
    document.getElementById('editPreview').src = document.getElementById('myAvatar').src;
    document.getElementById('profileModal').style.display = 'flex'; 
}
function openGroupModal() {
    currentBase64 = null;
    document.getElementById('groupCreatePreview').src = "https://ui-avatars.com/api/?name=Group";
    document.getElementById('groupModal').style.display = 'flex';
    const list = document.getElementById('inviteList');
    list.innerHTML = "Laden...";
    db.collection("users").doc(user.uid).collection("friends").get().then(snap => {
        list.innerHTML = snap.empty ? "Geen vrienden." : "";
        snap.forEach(doc => {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:5px;"><span>${doc.data().name}</span><input type="checkbox" class="invite-chk" value="${doc.id}"></div>`;
        });
    });
}
async function sendFriendRequest(id, name) {
    const me = (await db.collection("users").doc(user.uid).get()).data();
    await db.collection("users").doc(id).collection("requests").doc(user.uid).set({ name: me.name, pic: me.pic || "" });
    notify("Verzonden", `Verzoek naar ${name}`);
}
async function acceptFriend(id, name, pic) {
    const me = (await db.collection("users").doc(user.uid).get()).data();
    await db.collection("users").doc(user.uid).collection("friends").doc(id).set({ name, pic });
    await db.collection("users").doc(id).collection("friends").doc(user.uid).set({ name: me.name, pic: me.pic || "" });
    await db.collection("users").doc(user.uid).collection("requests").doc(id).delete();
    location.reload();
}
async function declineRequest(id) {
    if(!confirm("Verzoek afwijzen?")) return;
    await db.collection("users").doc(user.uid).collection("requests").doc(id).delete();
}
</script>
